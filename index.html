{id:'D004',topic:'3.5',objective:'3.5-internal-resistance',level:2,type:'scenario',source:'Module 3 notes',page:'70–73',q:'A battery with internal resistance supplies current to a connected load. Assuming its EMF and internal resistance are constant, what happens to its terminal voltage as load current increases?',options:['It increases because the load draws more power.','It remains equal to the open-circuit EMF.','It decreases because the voltage drop across the internal resistance increases.'],answer:2,explanation:'Terminal voltage = EMF − current × internal resistance. Increasing current reduces the terminal voltage.'},
{id:'D005',topic:'3.6',objective:'3.6-kcl',level:2,type:'definition',source:'Module 3 notes',page:'88–89',q:'Kirchhoff’s Current Law states that:',options:['The sum of currents entering a junction equals the sum leaving it.','The current is identical in all parallel branches.','The total voltage around a closed loop is equal to the supply current.'],answer:0,explanation:'Conservation of charge requires the current entering a junction to equal the current leaving it.'},
{id:'D006',topic:'3.7',objective:'3.7-resistivity',level:2,type:'scenario',source:'Module 3 notes',page:'101–106',q:'Two conductors are made from the same metal and kept at the same temperature. One is twice as long and has twice the cross-sectional area of the other. How do their resistances compare?',options:['The longer conductor has double the resistance.','Both conductors have the same resistance.','The longer conductor has half the resistance.'],answer:1,explanation:'R = ρL/A; doubling both length and cross-sectional area leaves resistance unchanged.'},
{id:'D007',topic:'3.7',objective:'3.7-rheostat',level:1,type:'definition',source:'Module 3 notes',page:'127–131',q:'What is a rheostat?',options:['A three-terminal voltage divider only.','A resistor whose resistance depends on temperature.','A two-terminal variable resistor used to control current.'],answer:2,explanation:'The rheostat is a two-terminal variable resistor commonly used for current control.'},
{id:'D008',topic:'3.7',objective:'3.7-ntc',level:2,type:'definition',source:'Module 3 notes',page:'141–144',q:'What happens to the resistance of an NTC thermistor when its temperature increases?',options:['Resistance decreases.','Resistance increases.','Resistance remains constant.'],answer:0,explanation:'Negative temperature coefficient means resistance decreases as temperature rises.'},
{id:'D009',topic:'3.5',objective:'3.5-cell-series',level:2,type:'technical',source:'Module 3 notes',page:'66–68',q:'When identical cells are connected in series, which quantity increases?',options:['Their total EMF.','The current rating of each individual cell.','The number of parallel current paths.'],answer:0,explanation:'Series connection adds cell voltages; it also adds internal resistances.'},
{id:'D010',topic:'3.6',objective:'3.6-ohm',level:2,type:'calculation',source:'Module 3 notes',page:'88, 91',q:'A 24 V supply is connected across a 6 Ω resistor. What current flows through the resistor?',options:['0.25 A','4 A','144 A'],answer:1,explanation:'Ohm’s Law: I = V/R = 24/6 = 4 A.',working:'I = V/R = 24 V ÷ 6 Ω = 4 A'},
{id:'D011',topic:'3.5',objective:'3.5-battery-internal',level:2,type:'calculation',source:'Module 3 notes',page:'70–73',q:'A battery has an EMF of 28 V and an internal resistance of 0.5 Ω. What is its terminal voltage when delivering 8 A?',options:['24 V','28 V','32 V'],answer:0,explanation:'Vt = E − Ir = 28 − (8 × 0.5) = 24 V.',working:'Vt = E − Ir = 28 V − (8 A × 0.5 Ω) = 24 V'},
{id:'D012',topic:'3.7',objective:'3.7-parallel',level:2,type:'calculation',source:'Module 3 notes',page:'118–125',q:'Two resistors of 6 Ω and 3 Ω are connected in parallel. What is their combined resistance?',options:['9 Ω','4.5 Ω','2 Ω'],answer:2,explanation:'1/R = 1/6 + 1/3 = 1/2, so R = 2 Ω.',working:'1/R = 1/6 + 1/3 = 3/6 → R = 2 Ω'}
];

ap": "Parallel capacitors share voltage; total capacitance increases.", "keywords": ["parallel"]}, {"topic": "3.9", "id": "capvolts", "title": "Series capacitor voltage division", "page": "177,190–191", "formulas": ["Q = CtVtotal", "Vi = Q/Ci", "V₁ = Vtotal C₂/(C₁+C₂) (two)"], "units": "Q (C), C (F), V (V)", "method": "Initially uncharged series capacitors carry equal charge. Find Ct then Q then each voltage.", "example": "9 µF and 27 µF across 40 V: V9=40×27/36=30 V.", "trap": "Smaller capacitance receives larger voltage.", "keywords": ["voltage-split", "series-voltage"]}, {"topic": "3.9", "id": "capcolour", "title": "Capacitor colour values and voltage rating", "page": "173,186–187", "formulas": ["C(pF) = digits × multiplier", "Cmax/min = C(1 ± tol)", "Recommended voltage rating ≥ 2 × working V"], "units": "C (pF), tol decimal, voltage (V)", "method": "Use capacitor-specific multiplier/tolerance table from page 187; the first two bands are digits.", "example": "Red-violet-orange-green = 27×1000 pF = 27 nF ±5%. For 32 V working choose ≥64 V.", "trap": "Capacitors are coded in pF, not Ω. The voltage rule is a recommendation from the notes.", "keywords": ["colour", "rating-rule"]}, {"topic": "3.9", "id": "rc", "title": "RC time constant", "page": "194–196", "formulas": ["τ = RC", "R = τ/C", "C = τ/R", "tpractical ≈ 5τ"], "units": "τ,t (s), R (Ω), C (F)", "method": "Convert kΩ to Ω and µF to F; multiply; five time constants for practical full charge/discharge.", "example": "15 kΩ × 220 µF = 3.3 s; 5τ ≈16.5 s.", "trap": "RC has seconds as unit; practical full charge is not mathematically 100%.", "keywords": ["rc", "time-constant", "practical-charge"]}, {"topic": "3.9", "id": "rccharge", "title": "RC charging and discharging", "page": "194–196", "formulas": ["Vc at 1τ ≈ 0.63Vs (charging)", "Vc at 1τ ≈ 0.37Vinitial (discharging)", "I at 1τ ≈ 0.37I₀", "I at 2τ ≈ 0.14I₀", "I₀ = Vs/R", "I = (Vs−Vc)/R (charging)"], "units": "V (V), I (A), R (Ω)", "method": "Identify charging or discharging; apply the notes’ rounded percentage to the initial/final magnitude.", "example": "42 V charging: after one τ, Vc≈26.46 V; 90 V discharging: 33.3 V remains.", "trap": "63% charged is not 63% remaining during discharge.", "keywords": ["charge-voltage", "discharge-voltage", "initial-charge", "charging-instant", "two-tau"]}, {"topic": "3.10", "id": "mmf", "title": "Magnetomotive force", "page": "239", "formulas": ["F = NI", "N = F/I", "I = F/N"], "units": "F (ampere-turns), N turns, I (A)", "method": "Multiply turns by coil current.", "example": "600 turns × 2 A = 1200 At.", "trap": "Ampere-turns are not newtons.", "keywords": ["mmf"]}, {"topic": "3.10", "id": "field", "title": "Magnetic field strength", "page": "239–240", "formulas": ["H = NI/l = F/l", "l = NI/H", "I = Hl/N", "N = Hl/I"], "units": "H (At/m), l (m), N turns, I (A)", "method": "Convert magnetic path length to metres; divide MMF by length.", "example": "500 turns, 1.5 A, 0.5 m: H=1500 At/m.", "trap": "Length is magnetic path length, not coil wire length.", "keywords": ["calc-h", "magnetic-length"]}, {"topic": "3.10", "id": "flux", "title": "Magnetic flux and flux density", "page": "241", "formulas": ["Φ = BA", "B = Φ/A", "A = Φ/B"], "units": "Φ (Wb), B (T), A (m²)", "method": "Use area perpendicular to field and convert cm² to m².", "example": "0.006 Wb through 0.003 m² gives 2 T.", "trap": "1 cm² = 10⁻⁴ m².", "keywords": ["flux"]}, {"topic": "3.10", "id": "permeability", "title": "Magnetic permeability", "page": "241,250", "formulas": ["μ = B/H", "B = μH", "H = B/μ", "μ = μ₀μr", "μr = μ/μ₀"], "units": "μ (H/m), B (T), H (A/m), μ₀≈1.257×10⁻⁶ H/m", "method": "Use the given absolute permeability or calculate it from relative permeability.", "example": "0.8 T / 400 A/m = 0.002 H/m.", "trap": "Relative permeability is dimensionless; absolute permeability is not.", "keywords": ["permeability"]}, {"topic": "3.10", "id": "reluctance", "title": "Magnetic reluctance", "page": "251", "formulas": ["ℜ = F/Φ", "Φ = F/ℜ", "F = ℜΦ", "ℜ = l/(μA) (uniform linear path)"], "units": "ℜ (At/Wb), F (At), Φ (Wb), l (m), μ (H/m), A (m²)", "method": "Divide MMF by flux; geometry relationship assumes uniform permeability.", "example": "200 At / 0.004 Wb = 50,000 At/Wb.", "trap": "Larger cross-section reduces reluctance; material saturation complicates linear formula.", "keywords": ["reluctance"]}, {"topic": "3.11", "id": "faraday", "title": "Induced EMF and flux change", "page": "267", "formulas": ["E magnitude = N×|ΔΦ|/Δt", "N = EΔt/|ΔΦ|", "Δt = N|ΔΦ|/E"], "units": "E (V), N turns, Φ (Wb), t (s)", "method": "Use flux change per turn and change time; negative sign in Faraday’s law indicates Lenz direction.", "example": "100 turns, 0.002 Wb change in 0.05 s: E=4 V.", "trap": "Number of turns multiplies induced EMF; direction opposes change.", "keywords": ["induction-turns", "faraday"]}, {"topic": "3.11", "id": "mutual", "title": "Mutual induction", "page": "275–276", "formulas": ["E₂ = −M ΔI₁/Δt", "|M| = |E₂|Δt/|ΔI₁|", "M = μAN₁N₂/l (closely coupled geometry)"], "units": "M (H), E (V), ΔI (A), Δt (s), μ (H/m), A (m²), l (m)", "method": "Calculate rate of primary current change; multiply by mutual inductance for magnitude.", "example": "0.4 H × 20 A/s = 8 V.", "trap": "The minus sign is direction, not negative magnitude. Geometry relation requires close common coupling.", "keywords": ["mutual", "secondary-change"]}, {"topic": "3.11", "id": "self", "title": "Self-induction and coil inductance", "page": "281", "formulas": ["E = −L ΔI/Δt", "L = |E|Δt/|ΔI|", "L = μAN²/l", "N = √(Ll/(μA))", "l = μAN²/L"], "units": "L (H), μ (H/m), A (m²), N turns, l (m)", "method": "For EMF use current change per second; for geometry use square of turns.", "example": "0.25 H × 12 A/s gives 3 V; doubling turns gives four times inductance.", "trap": "Increasing coil length decreases L at fixed N, area and μ.", "keywords": ["self-emf", "inductance-from", "coil", "inductance"]}, {"topic": "3.12", "id": "shaft", "title": "DC motor output power and speed", "page": "307", "formulas": ["P = Tω", "T = P/ω", "ω = P/T", "hp = P(W)/746", "ω = 2πn/60"], "units": "P (W), T (N·m), ω (rad/s), n (rpm)", "method": "If given rpm, convert to rad/s; multiply torque by angular speed.", "example": "5 N·m at 20 rad/s gives 100 W.", "trap": "Do not use rpm directly in P=Tω.", "keywords": ["shaft-power", "torque-conversion", "power-angular"]}, {"topic": "3.12", "id": "torque", "title": "DC motor torque constant", "page": "308", "formulas": ["T = kI", "I = T/k", "k = T/I"], "units": "T (N·m), k (N·m/A), I (A)", "method": "Use constant for motor and armature current.", "example": "k=0.4 N·m/A, I=15 A: T=6 N·m.", "trap": "Assumes constant field/torque constant.", "keywords": ["torque-current", "torque-double"]}, {"topic": "3.13", "id": "period", "title": "Frequency and period", "page": "329", "formulas": ["f = 1/T", "T = 1/f"], "units": "f (Hz), T (s)", "method": "Convert time to seconds before taking reciprocal.", "example": "400 Hz gives T=1/400=0.0025 s=2.5 ms.", "trap": "Frequency is cycles per second, not angular frequency.", "keywords": ["period", "frequency-from"]}, {"topic": "3.13", "id": "sine", "title": "Instantaneous sinusoidal value", "page": "333,337,343,459", "formulas": ["v = Vpk sin θ", "θ = 2πft (rad)", "ω = 2πf", "v = Vpk sin(2πft)"], "units": "v,Vpk (V), f (Hz), t (s), θ (rad or degrees)", "method": "Set calculator angle mode correctly; multiply peak by sine of angle.", "example": "200 V peak at 30°: v=200×0.5=100 V.", "trap": "At 270° sine is −1; RMS is not peak.", "keywords": ["instantaneous", "sine"]}, {"topic": "3.13", "id": "rms", "title": "RMS, peak and peak-to-peak", "page": "335,338", "formulas": ["Vrms = Vpk/√2", "Vpk = √2 Vrms", "Vpp = 2Vpk", "Vrms = Vpp/(2√2)"], "units": "V (V); same relations for current of a pure sine", "method": "Identify which amplitude is given, apply matching conversion.", "example": "115 V RMS gives peak 162.63 V, peak-to-peak 325.27 V.", "trap": "Only use √2 conversion for sinusoidal waveforms.", "keywords": ["rms", "peak"]}, {"topic": "3.13", "id": "average", "title": "Mean of a sine wave", "page": "334", "formulas": ["Vavg half-cycle = 2Vpk/π", "Vpk = πVavg/2", "Signed mean over full cycle = 0"], "units": "V (V); applies equally to current", "method": "Use half-cycle/rectified average only when asked.", "example": "10 A peak gives half-cycle average 6.366 A.", "trap": "Full signed cycle average is zero, unlike RMS.", "keywords": ["average-half"]}, {"topic": "3.13", "id": "star", "title": "Three-phase star (wye)", "page": "349,436,473", "formulas": ["VL = √3 Vph", "Vph = VL/√3", "IL = Iph"], "units": "VL line-line voltage (V), Vph line-neutral (V), I (A)", "method": "Multiply phase voltage by √3 for balanced star; current unchanged.", "example": "115 V phase → 199.19 V line ≈200 V.", "trap": "Do not multiply both voltage and current by √3.", "keywords": ["star", "line-voltage"]}, {"topic": "3.13", "id": "delta", "title": "Three-phase delta", "page": "350,436,475", "formulas": ["VL = Vph", "IL = √3 Iph", "Iph = IL/√3"], "units": "V (V), I (A)", "method": "For balanced delta, voltage is unchanged; multiply phase current by √3.", "example": "20 A phase →34.64 A line.", "trap": "Star and delta use √3 on different quantities.", "keywords": ["delta", "line-current"]}, {"topic": "3.14", "id": "xl", "title": "Inductive reactance", "page": "358", "formulas": ["XL = 2πfL", "f = XL/(2πL)", "L = XL/(2πf)"], "units": "XL (Ω), f (Hz), L (H)", "method": "Convert mH to H; multiply by 2π and frequency.", "example": "50 Hz, 0.1 H gives XL=31.4 Ω.", "trap": "XL increases with frequency; current lags voltage.", "keywords": ["xl", "inductive-reactance"]}, {"topic": "3.14", "id": "xc", "title": "Capacitive reactance", "page": "360–361", "formulas": ["XC = 1/(2πfC)", "f = 1/(2πXC C)", "C = 1/(2πfXC)"], "units": "XC (Ω), f (Hz), C (F)", "method": "Convert µF to F; multiply denominator then take reciprocal.", "example": "50 Hz, 100 µF: XC≈31.8 Ω.", "trap": "XC decreases with frequency; current leads voltage.", "keywords": ["xc", "capacitive-reactance"]}, {"topic": "3.14", "id": "resonance", "title": "LC resonant frequency (derived)", "page": "358,360–361,455", "formulas": ["XL = XC", "f₀ = 1/(2π√(LC))", "L = 1/((2πf₀)²C)", "C = 1/((2πf₀)²L)"], "units": "f₀ (Hz), L (H), C (F)", "method": "Equate XL and XC, rearrange to solve for frequency; convert components to base units.", "example": "L=0.01 H, C=1 µF: f₀=1/(2π√(0.01×10⁻⁶))≈1591.55 Hz.", "trap": "Derived from the notes’ reactance equations and resonance condition; not a separate quoted source formula.", "keywords": ["resonance"]}, {"topic": "3.14", "id": "acohm", "title": "AC Ohm's law and impedance", "page": "355,372", "formulas": ["V = IZ", "I = V/Z", "Z = V/I"], "units": "V (V RMS), I (A RMS), Z (Ω)", "method": "Use total impedance rather than resistance for non-resistive circuit.", "example": "120 V RMS / 4 A RMS = 30 Ω.", "trap": "Do not mix peak and RMS in one calculation.", "keywords": ["ac-resistor", "z-from"]}, {"topic": "3.14", "id": "rlc", "title": "Series RLC impedance", "page": "378–390", "formulas": ["X = XL−XC", "Z = √(R²+X²)", "R = √(Z²−X²)", "|X| = √(Z²−R²)"], "units": "R, XL, XC, Z (Ω)", "method": "Subtract capacitive from inductive reactance, square, add R², take root.", "example": "R=5 Ω, XL=16 Ω, XC=4 Ω: Z=√(25+144)=13 Ω.", "trap": "At resonance XL=XC so Z=R in series; retain sign for lag/lead.", "keywords": ["impedance", "net-reactance", "series-z"]}, {"topic": "3.14", "id": "phasor", "title": "AC voltage and current phasors", "page": "376–394", "formulas": ["V = √(VR²+(VL−VC)²)", "Iparallel = √(IR²+(IC−IL)²)"], "units": "V (V RMS), I (A RMS)", "method": "In series use voltage phasors; parallel use current phasors. Subtract opposing reactive components first.", "example": "Series VR=30 V, VL=40 V gives V=50 V; parallel IR=3 A, IC=4 A gives 5 A.", "trap": "Do not add reactive and resistive magnitudes arithmetically.", "keywords": ["voltage-vector", "parallel-current", "parallel-reactive"]}, {"topic": "3.14", "id": "phase", "title": "Phase angle", "page": "379,396", "formulas": ["tan φ = (XL−XC)/R (series)", "φ = atan((XL−XC)/R)", "cos φ = R/Z (series)"], "units": "φ (degrees or rad), R,X,Z (Ω)", "method": "Use signed net reactance and inverse tangent; check lead/lag.", "example": "40 V inductive and 30 V resistive: φ=atan(40/30)=53.1° lagging current.", "trap": "Positive net inductive reactance means current lags.", "keywords": ["phase-angle"]}, {"topic": "3.14", "id": "powers", "title": "AC power and power factor", "page": "363–364,396,400–401", "formulas": ["S = VI", "P = S cos φ = VI cos φ", "Q = S sin φ", "PF = P/S = cos φ", "S = √(P²+Q²)", "P = √(S²−Q²)", "|Q| = √(S²−P²)"], "units": "S (VA), P (W), Q (VAr), V/I RMS, PF dimensionless", "method": "Identify apparent, real and reactive quantities; apply triangle or trigonometry.", "example": "S=500 VA, P=300 W: Q=400 VAr, PF=0.6.", "trap": "Reactive power is not watts; don't add P and Q arithmetically.", "keywords": ["apparent-power", "power-factor", "reactive-power"]}, {"topic": "3.15", "id": "ratio", "title": "Transformer turns, voltage and current ratio", "page": "413–414,425–426", "formulas": ["Np/Ns = Vp/Vs = Is/Ip", "Vs = VpNs/Np", "Np = NsVp/Vs", "Ip = IsNs/Np", "Is = IpNp/Ns"], "units": "N turns, V (V RMS), I (A RMS)", "method": "Use ideal transformer assumption; voltage follows turns, current inversely follows turns.", "example": "230 V, Np=500, Ns=100: Vs=46 V; if Is=5 A then Ip=1 A.", "trap": "Current ratio is inverted relative to voltage ratio.", "keywords": ["ratio", "turns", "current-ratio"]}, {"topic": "3.15", "id": "ideal", "title": "Ideal transformer power and losses", "page": "413,420,439", "formulas": ["VpIp = VsIs (ideal VA)", "Ip = VsIs/Vp", "Loss = Pin−Pout"], "units": "V (V RMS), I (A RMS), P (W real), S (VA)", "method": "For ideal power/VA use voltage times current; real loss uses real input and output power.", "example": "24 V × 5 A secondary=120 VA; at 240 V primary, Ip=0.5 A.", "trap": "Real transformer losses reduce output real power.", "keywords": ["power-ideal", "loss"]}, {"topic": "3.15", "id": "efficiency", "title": "Transformer efficiency", "page": "420", "formulas": ["η% = 100Pout/Pin", "Pout = Pinη%/100", "Pin = 100Pout/η%", "Loss = Pin−Pout"], "units": "P (W), η (%)", "method": "Use real power in and out; convert percent to decimal if multiplying.", "example": "720 W output at 90% efficiency requires 800 W input; loss=80 W.", "trap": "Efficiency cannot exceed 100%; do not divide by 90 instead of 0.90.", "keywords": ["efficiency", "loss-calc"]}, {"topic": "3.15", "id": "no-load", "title": "No-load transformer current", "page": "415–416", "formulas": ["I₀ = √(Ic²+Im²)", "Ic = I₀ cos φ", "Im = I₀ sin φ"], "units": "I (A), Ic core loss/in-phase, Im magnetising/quadrature", "method": "Treat perpendicular components as phasors.", "example": "3 A in-phase and 4 A quadrature: I₀=5 A.", "trap": "Add squares, not current magnitudes.", "keywords": ["no-load"]}, {"topic": "3.15", "id": "impedance", "title": "Transformer impedance matching", "page": "426–427", "formulas": ["Zp/Zs = (Np/Ns)²", "Np/Ns = √(Zp/Zs)", "Zp = Zs(Np/Ns)²", "Zs = Zp(Ns/Np)²"], "units": "Z (Ω), N turns", "method": "Square turns ratio to reflect impedance (ideal transformer).", "example": "20,000 Ω versus 200 Ω: turns ratio √100=10:1.", "trap": "Do not use a linear impedance ratio.", "keywords": ["impedance"]}, {"topic": "3.15", "id": "rating", "title": "Transformer VA rating and three-phase power", "page": "435–436", "formulas": ["S₁φ = VI", "S₃φ = √3 VL IL", "P₃φ = √3 VL IL PF", "Srating = Sload/0.8 (notes' recommendation)"], "units": "S (VA), P (W), V (V), I (A), PF", "method": "Choose single or balanced three-phase relationship. Convert VA to kVA by /1000.", "example": "115 V ×100 A=11.5 kVA; rating at 80% loading=14.375 kVA.", "trap": "Use line values in √3 formula. Select an available rating above the calculated minimum.", "keywords": ["kva", "derating", "threephase-power"]}, {"topic": "3.16", "id": "bandwidth", "title": "Filter bandwidth and resonance", "page": "455", "formulas": ["BW = fhigh−flow", "fhigh = flow+BW", "flow = fhigh−BW", "XL = XC at resonance"], "units": "f, BW (Hz or matching prefix)", "method": "Subtract lower cutoff from upper cutoff; notes define amplitude cutoff as 70.7% peak.", "example": "89.3−88.9 MHz=0.4 MHz=400 kHz.", "trap": "Bandwidth is the difference, not the centre frequency.", "keywords": ["bandwidth"]}, {"topic": "3.17", "id": "genstar", "title": "AC generator star/delta and sinusoid", "page": "459,473–475", "formulas": ["Star: VL = √3Vph; IL = Iph", "Delta: VL = Vph; IL = √3Iph", "v = Vpk sin(2πft)"], "units": "V (V), I (A), f (Hz), t (s)", "method": "Identify winding configuration and use matching relation.", "example": "Star 115 V phase gives 199.2 V line; delta 20 A phase gives 34.64 A line.", "trap": "Use phase-to-phase vs phase-to-neutral correctly.", "keywords": ["star", "delta", "sine"]}, {"topic": "3.18", "id": "speed", "title": "AC motor synchronous speed", "page": "496–497", "formulas": ["Ns = 120f/p", "f = Nsp/120", "p = 120f/Ns"], "units": "Ns (rpm), f (Hz), p total poles", "method": "Use total number of poles, not pole pairs.", "example": "400 Hz six-pole motor: Ns=120×400/6=8000 rpm.", "trap": "Induction rotor speed is below synchronous speed when motoring.", "keywords": ["speed-sixpole", "speed", "slip"]}, {"topic": "3.18", "id": "slip", "title": "Induction motor slip", "page": "496–497", "formulas": ["Slip rpm = Ns−Nr", "Slip% = 100(Ns−Nr)/Ns", "Nr = Ns(1−Slip%/100)"], "units": "Ns,Nr (rpm), slip (%)", "method": "Find synchronous speed first; subtract actual speed; divide by synchronous speed for percentage.", "example": "1500 rpm synchronous, 1440 rpm rotor: slip 60 rpm, 4%.", "trap": "Divide by synchronous speed, not actual rotor speed.", "keywords": ["slip"]}, {"topic": "3.18", "id": "switch", "title": "Centrifugal switch speed", "page": "507", "formulas": ["Nswitch ≈ 0.75 Nreference (when 75% is specified)"], "units": "N (rpm)", "method": "Multiply specified reference speed by stated switch percentage.", "example": "75% of 1600 rpm = 1200 rpm.", "trap": "Use the reference speed specified in the question, not an assumed universal rpm.", "keywords": ["switch-speed"]}];

const COMPONENTS=[{"topic":"3.1","page":"2–10","name":"Conductor","aliases":["conductors","conductive material"],"what":"A material that lets charge move easily.","how":"Metals have mobile electrons, so comparatively little resistance.","application":"Copper wiring carries electrical power and signals.","trap":"A conductor still has resistance."},{"topic":"3.1","page":"2–10","name":"Doping","aliases":["doped"],"what":"Adding controlled impurities to a semiconductor.","how":"It changes the number of available electrons or holes.","application":"Used to manufacture semiconductor junctions and sensors.","trap":"N-type has electron majority carriers; P-type has hole majority carriers."},{"topic":"3.1","page":"2–10","name":"Electron","aliases":["electrons"],"what":"A tiny negatively charged particle in an atom.","how":"In a metal, some electrons can move between atoms and carry charge.","application":"Current through an aircraft wiring loom involves moving electrons.","trap":"Electron flow is opposite to conventional current."},{"topic":"3.1","page":"2–10","name":"Insulator","aliases":["insulators","insulating material"],"what":"A material that makes it difficult for charge to move.","how":"Electrons are held tightly in their atoms.","application":"Wire insulation keeps adjacent conductors apart electrically.","trap":"Insulation can break down at sufficient voltage."},{"topic":"3.1","page":"2–10","name":"Ion","aliases":["ions","ionisation"],"what":"An atom or group of atoms carrying a net charge.","how":"Losing electrons makes a positive ion; gaining makes a negative ion.","application":"Ions carry charge through a battery electrolyte.","trap":"A positive ion has lost electrons."},{"topic":"3.1","page":"2–10","name":"Neutron","aliases":["neutrons"],"what":"A particle in the nucleus with no electric charge.","how":"It contributes to the atom's mass.","application":"Different isotopes of an element have different neutron counts.","trap":"Neutral does not mean massless."},{ yte is carried by ions, not just free electrons."},{"topic":"3.2","page":"12–27","name":"Gas discharge","aliases":["gas ionisation"],"what":"Electric current passing through an ionised gas.","how":"A strong electric field creates mobile ions and electrons.","application":"Neon indicators and fluorescent lamps use gas discharge.","trap":"Ordinary neutral gas is a poor conductor."},{"topic":"3.2","page":"12–27","name":"Pith ball","aliases":["pith balls"],"what":"A lightweight ball used to demonstrate static charge.","how":"A nearby charge produces attraction or repulsion.","application":"A simple laboratory demonstration of electrostatic forces.","trap":"A charged object can attract a neutral one."},{"topic":"3.3","page":"30–42","name":"Ammeter","aliases":["ammeters"],"what":"A meter that measures current in amperes.","how":"It is placed in series so the measured current flows through it.","application":"Measuring current drawn by a test circuit.","trap":"Low internal resistance; never place directly across a supply."},{"topic":"3.3","page":"30–42","name":"Current","aliases":["electric current"],"what":"The rate at which charge flows.","how":"One ampere equals one coulomb per second.","application":"A running motor draws current from its supply.","trap":"Conventional current is positive-to-negative externally."},{"topic":"3.3","page":"30–42","name":"Electromotive force","aliases":["EMF"],"what":"The energy a source supplies per coulomb of charge.","how":"Chemical or mechanical energy is converted into electrical energy.","application":"A battery's open-circuit voltage approximates its EMF.","trap":"EMF is measured in volts, not newtons."},{"topic":"3.3","page":"30–42","name":"Multimeter","aliases":["multimeters"],"what":"A meter that can measure several electrical quantities.","how":"Selecting a function changes how its input circuit measures voltage, resistance or current.","application":"Checking continuity or supply voltage as specified in maintenance data.","trap":"Choose the correct mode, range and connections."},{"topic":"3.3","page":"30–42","name":"Potential difference","aliases":["voltage"],"what":"Energy transferred per unit charge between two points.","how":"A voltage difference can drive current through a closed circuit.","application":"A voltage drop across a connector can indicate resistance under load.","trap":"Voltage is not current."},{"topic":"3.3","page":"30–42","name":"Voltmeter","aliases":["voltmeters"],"what":"A meter that measures the voltage between two points.","how":"It goes in parallel and draws very little current.","application":"Checking a 28 V supply at a connector using approved procedures.","trap":"High internal resistance."},{"topic":"3.4","page":"45–52","name":"Bonding strap","aliases":["bonding braid","earthing wrist strap","bonding lead"],"what":"A conductive link between items that keeps them at similar potential.","how":"Charge has a controlled path to equalise potential.","application":"ESD wrist straps and aircraft bonding connections have different specific purposes.","trap":"Use approved bonding or ESD procedures; they are not interchangeable."},{"topic":"3.4","page":"45–52","name":"Galvanic cell","aliases":["galvanic cells"],"what":"A chemical source of electrical energy.","how":"Two electrodes and an electrolyte create a voltage through a chemical reaction.","application":"The basic principle of a battery cell.","trap":"Converts chemical energy to electrical energy."},{"topic":"3.4","page":"45–52","name":"Photovoltaic cell","aliases":["solar cell","solar cells","photovoltaic cells","PV cell"],"what":"A device that turns light directly into electrical energy.","how":"Light creates charge carriers that a semiconductor junction separates.","application":"Solar panels powering remote sensors.","trap":"Produces a voltage without an external supply."},{"topic":"3.4","page":"45–52","name":"Piezoelectric crystal","aliases":["piezoelectric device","piezoelectric effect","piezoelectric"],"what":"A material that links mechanical stress and electrical voltage.","how":"Squeezing creates charge; applying voltage can deform it.","application":"Piezoelectric vibration sensors, buzzers and ignition devices.","trap":"The reverse effect converts electrical energy into movement."},{"topic":"3.4","page":"45–52","name":"Static discharger","aliases":["static wick","static wicks","static dischargers"],"what":"A small device on an aircraft trailing edge that helps release accumulated static charge.","how":"Its shape encourages controlled discharge into the surrounding air.","application":"Reduces precipitation-static interference with radios.","trap":"Not a lightning protection device by itself."},{"topic":"3.4","page":"45–52","name":"Thermocouple","aliases":["thermocouples"],"what":"Two different metals joined to make a temperature sensor.","how":"A temperature difference between junctions produces a small voltage.","application":"Engine exhaust gas temperature sensing is a familiar example.","trap":"Measures a temperature difference; needs a reference junction."},{"topic":"3.5","page":"54–73","name":"Alkaline cell","aliases":["alkaline battery","alkaline cells"],"what":"A primary cell with an alkaline electrolyte.","how":"Typically uses zinc and manganese dioxide.","application":"Flashlights and portable test accessories.","trap":"Most ordinary alkaline cells are not rechargeable."},{"topic":"3.5","page":"54–73","name":"Battery","aliases":["batteries"],"what":"One or more electrochemical cells supplying electrical energy.","how":"Chemical reactions establish a terminal voltage.","application":"Aircraft emergency or starting power, depending on design.","trap":"Series cells add voltage; parallel identical cells add capacity."},{"topic":"3.5","page":"72–73","name":"Internal resistance","aliases":["internal resistances"],"what":"The resistance inside a real source.","how":"Load current produces an internal voltage drop.","application":"A weak battery may show normal open-circuit voltage but sag under load.","trap":"Terminal voltage during discharge equals EMF minus Ir."},{"topic":"3.5","page":"54–73","name":"Lead-acid battery","aliases":["lead acid battery","lead-acid cell","lead acid cell"],"what":"A rechargeable battery with lead-based plates and sulphuric acid electrolyte.","how":"Discharge changes both plates towards lead sulphate.","application":"Backup power and conventional starting batteries.","trap":"Electrolyte specific gravity changes with state of charge."},{"topic":"3.5","page":"66–85","name":"Nickel-cadmium battery","aliases":["NiCd","Ni-Cd","Ni-Cad","nicad","nickel cadmium","nickel-cadmium cell"],"what":"A rechargeable battery using nickel and cadmium chemistry.","how":"Uses potassium hydroxide electrolyte and delivers strong discharge current.","application":"Some aircraft starting and emergency battery systems.","trap":"Electrolyte density is not a reliable state-of-charge indication; thermal runaway is a risk."},{"topic":"3.5","page":"75–85","name":"Photocell","aliases":["photocells","photoelectric cell"],"what":"A light-sensitive electrical device.","how":"Depending on the type, light changes current, voltage or resistance.","application":"Automatic light sensing and optical detection.","trap":"A photovoltaic cell produces voltage; other photocells require a bias."},{"topic":"3.5","page":"54–73","name":"Primary cell","aliases":["primary cells","non-rechargeable cell"],"what":"A cell designed for one discharge cycle.","how":"Its useful chemical reaction is not intended to be reversed by charging.","application":"Disposable alkaline torch batteries.","trap":"Do not attempt to recharge a primary cell."},{"topic":"3.5","page":"54–73","name":"Secondary cell","aliases":["secondary cells","rechargeable cell"],"what":"A cell designed to be recharged.","how":"Charging drives the chemical reaction backwards.","application":"Rechargeable aircraft battery systems.","trap":"Charging must match the battery chemistry."},{"topic":"3.5","page":"54–73","name":"Zinc-carbon cell","aliases":["zinc carbon cell","dry cell","zinc-carbon battery"],"what":"A common non-rechargeable cell using zinc and manganese dioxide.","how":"A paste electrolyte allows the chemical reaction.","application":"Basic disposable batteries in low-drain equipment.","trap":"Dry cell does not mean no electrolyte."},{"topic":"3.6","page":"92–94","name":"Kirchhoff's current law","aliases":["Kirchhoff’s current law","KCL"],"what":"Current entering a junction equals current leaving it.","how":"Charge cannot pile up indefinitely at an ordinary circuit node.","application":"Working out branch current in a distribution circuit.","trap":"Do not add incoming and outgoing currents with the same sign."},{"topic":"3.6","page":"92–94","name":"Kirchhoff's voltage law","aliases":["Kirchhoff’s voltage law","KVL"],"what":"The signed voltage changes around a closed loop sum to zero.","how":"Energy supplied equals energy transferred per unit charge around the loop.","application":"Finding a missing voltage drop.","trap":"Keep the polarity and loop direction consistent."},{"topic":"3.6","page":"88–99","name":"Ohm's law","aliases":["Ohm’s law"],"what":"The relationship V = IR for an ohmic conductor.","how":"At fixed resistance, higher voltage means higher current.","application":"Calculating expected current through a known resistive load.","trap":"Resistance must remain constant for the simple proportional rule."},{"topic":"3.6","page":"88–99","name":"Open circuit","aliases":["open-circuited","open circuits"],"what":"A broken or incomplete electrical path.","how":"No steady current flows through the break.","application":"A broken conductor can stop a powered unit working.","trap":"Voltage may still be present across the break."},{"topic":"3.6","page":"88–99","name":"Parallel circuit","aliases":["parallel connection","parallel circuits"],"what":"Several current paths connected across the same two points.","how":"Every branch has the same voltage.","application":"Loads on a distribution bus.","trap":"Branch currents add; equivalent resistance decreases."},{"topic":"3.6","page":"88–99","name":"Series circuit","aliases":["series connection","series circuits"],"what":"A single path for current.","how":"Every component carries the same current.","application":"A switch and load connected in series.","trap":"Voltage drops add; current does not split."},{"topic":"3.6","page":"88–99","name":"Short circuit","aliases":["short-circuited","short circuits"],"what":"An unintended very low-resistance path.","how":"Current is limited by the source and remaining circuit resistance.","application":"Damaged wire insulation can allow a fault to structure.","trap":"Never create a short to test a source."},{"topic":"3.7","page":"137–149","name":"Carbon composition resistor","aliases":["carbon composition","carbon-composition resistor"],"what":"A resistor formed from a resistive carbon mixture.","how":"The composition and dimensions determine resistance.","application":"Older circuits and some pulse-tolerant applications.","trap":"Less stable and noisier than many film types."},{"topic":"3.7","page":"137–140","name":"Carbon film resistor","aliases":["carbon-film resistor","carbon film"],"what":"A fixed resistor made using a resistive carbon film.","how":"The film geometry sets resistance.","application":"General-purpose low-cost circuit resistance.","trap":"Film resistors have specified tolerance and power rating."},{"topic":"3.7","page":"137–140","name":"Metal film resistor","aliases":["metal-film resistor","metal film"],"what":"A fixed resistor using a thin metal resistive film.","how":"A controlled film gives stable resistance and low noise.","application":"Precision analogue signal circuits.","trap":"Metal film is often selected for precision, not just power."},{"topic":"3.7","page":"141–144","name":"NTC thermistor","aliases":["NTC","negative temperature coefficient thermistor","NTC thermistors"],"what":"A resistor whose resistance falls as it gets hotter.","how":"More thermal energy makes conduction easier in its material.","application":"Temperature sensing in electronics; NTC types can also limit inrush current.","trap":"Temperature up, resistance down."},{"topic":"3.7","page":"128–149","name":"Potentiometer","aliases":["potentiometers","pot","helipot"],"what":"A three-terminal adjustable resistor used as a voltage divider.","how":"A moving wiper selects part of the resistance track.","application":"Position feedback or a control knob.","trap":"Used as a divider with three terminals; a rheostat uses two."},{"topic":"3.7","page":"141–144","name":"PTC thermistor","aliases":["PTC","positive temperature coefficient thermistor","PTC thermistors"],"what":"A resistor whose resistance rises as it gets hotter.","how":"Heating changes the material so it opposes current more strongly.","application":"Self-regulating heaters and some overcurrent protection devices.","trap":"Temperature up, resistance up."},{"topic":"3.7","page":"101–152","name":"Resistor","aliases":["resistors"],"what":"A component that limits current or drops voltage.","how":"Electrical energy is dissipated mainly as heat.","application":"Current limiting and setting signal voltages in circuit boards.","trap":"Resistance is measured in ohms; power rating matters too."},{"topic":"3.7","page":"128–149","name":"Rheostat","aliases":["rheostats"],"what":"An adjustable resistor used to control current.","how":"The wiper changes the resistance in the current path.","application":"A variable load or older lamp dimming circuit.","trap":"Typically uses two terminals."},{"topic":"3.7","page":"109–113","name":"Surface mount resistor","aliases":["SMD resistor","surface-mount resistor","surface mount"],"what":"A small resistor soldered to pads on a PCB.","how":"Its resistive layer connects two end terminals.","application":"Compact avionics circuit boards.","trap":"A small package may have a low power rating."},{"topic":"3.7","page":"141–144","name":"Thermistor","aliases":["thermistors"],"what":"A resistor deliberately made sensitive to temperature.","how":"NTC and PTC types have opposite resistance trends.","application":"Temperature monitoring and compensation.","trap":"Identify which type the question specifies."},{"topic":"3.7","page":"147–149","name":"Trimmer resistor","aliases":["preset resistor","variable preset","trimmer potentiometer"],"what":"A small adjustable resistor intended for occasional setup.","how":"A tool moves its wiper to calibrate a circuit.","application":"Factory adjustment of an analogue signal level.","trap":"Not normally a frequent user control."},{"topic":"3.7","page":"141–146","name":"Voltage dependent resistor","aliases":["VDR","varistor","MOV","voltage-dependent resistor"],"what":"A resistor that changes resistance with applied voltage.","how":"At a high voltage its resistance drops sharply and diverts transient current.","application":"Surge protection in electrical equipment.","trap":"A varistor is not a normal linear resistor."},{"topic":"3.7","page":"116–128","name":"Voltage divider","aliases":["potential divider","voltage dividers"],"what":"Resistors arranged to take a fraction of a supply voltage.","how":"The output depends on the resistor ratio and any connected load.","application":"Scaling a sensor signal for measurement.","trap":"A load can change the divider ratio."},{"topic":"3.7","page":"151–152","name":"Wheatstone bridge","aliases":["Wheatstone bridges"],"what":"Four resistive arms arranged as a comparison circuit.","how":"When the resistor ratios match, the detector voltage is zero.","application":"Sensitive measurement of changes in resistance, such as strain sensors.","trap":"At balance, no current flows through the ideal detector."},{"topic":"3.7","page":"137–140","name":"Wirewound resistor","aliases":["wire-wound resistor","wire wound resistor","wirewound"],"what":"A resistor built from resistive wire wound around a former.","how":"Wire length and material establish resistance.","application":"High-power loads and current-sensing applications.","trap":"Ordinary wirewound types can introduce inductance."},{"topic":"3.8","page":"160","name":"Fuse","aliases":["fuses"],"what":"A protective device with a deliberately weak conducting element.","how":"Too much current heats the element until it melts and opens the circuit.","application":"Protecting wiring and equipment from overcurrent.","trap":"Never replace a fuse with a different rating without approved instructions."},{"topic":"3.8","page":"155–170","name":"Power rating","aliases":["wattage rating"],"what":"The power a component can safely dissipate under specified conditions.","how":"Heat must escape without damaging the component.","application":"Selecting a resistor suitable for its load.","trap":"A rating is a limit, not its actual consumption."},{"topic":"3.8","page":"155–170","name":"Wattmeter","aliases":["power meter","wattmeters"],"what":"An instrument that measures real electrical power.","how":"It combines voltage and current measurements, accounting for phase in AC.","application":"Measuring power consumed by equipment.","trap":"Watts are not always equal to volt-amperes in AC."},{"topic":"3.9","page":"180–184","name":"Capacitive fuel probe","aliases":["fuel gauging","fuel-gauging probe","fuel tank capacitor"],"what":"A sensor that uses capacitance to estimate fuel quantity.","how":"Fuel and air have different dielectric properties, so immersion changes capacitance.","application":"Aircraft capacitive fuel quantity measurement.","trap":"Water contamination can affect capacitance readings."},{"topic":"3.9","page":"172–200","name":"Capacitor","aliases":["capacitors"],"what":"Two conductors separated by insulation that store energy in an electric field.","how":"Charge builds on the plates when voltage is applied.","application":"Smoothing power supplies and filtering unwanted signals.","trap":"A charged capacitor can retain energy after power is removed."},{"topic":"3.9","page":"180–184","name":"Ceramic capacitor","aliases":["ceramic capacitors"],"what":"A capacitor using ceramic as its dielectric.","how":"It can offer very small size and good high-frequency behaviour.","application":"Decoupling supply rails on PCB assemblies.","trap":"Capacitance and voltage behaviour depend on ceramic type."},{"topic":"3.9","page":"177–184","name":"Dielectric","aliases":["dielectrics"],"what":"The insulating material between capacitor plates.","how":"It allows the field to exist and affects capacitance.","application":"Fuel-gauging sensors use changes in dielectric properties.","trap":"Higher permittivity increases capacitance for the same geometry."},{"topic":"3.9","page":"180–184","name":"Electrolytic capacitor","aliases":["electrolytic capacitors","polarised capacitor","polarized capacitor"],"what":"A capacitor that achieves a large capacitance using a thin oxide dielectric.","how":"Many types are polarised and must be connected correctly.","application":"Bulk smoothing in DC power supplies.","trap":"Observe polarity and voltage rating."},{"topic":"3.9","page":"180–184","name":"Film capacitor","aliases":["paper capacitor","paper or film capacitor","film capacitors","paper capacitors"],"what":"A capacitor using thin insulating film or paper layers.","how":"Metal electrodes and dielectric form a compact energy store.","application":"Signal coupling and filtering.","trap":"Film types are generally non-polarised; ratings vary."},{"topic":"3.9","page":"180–184","name":"Mica capacitor","aliases":["mica capacitors"],"what":"A capacitor with mica as its dielectric.","how":"The material gives stable capacitance in many radio-frequency uses.","application":"Radio tuning and stable RF circuits.","trap":"It is not normally chosen for very large capacitance."},{"topic":"3.9","page":"194–196","name":"Time constant","aliases":["RC time constant","time constants"],"what":"A measure of how quickly an RC circuit charges or discharges.","how":"One time constant equals resistance times capacitance.","application":"Timing circuits and filtering.","trap":"Charging reaches about 63.2%; discharge retains about 36.8% after one tau."},{"topic":"3.9","page":"180–184","name":"Variable capacitor","aliases":["trimmer capacitor","tuning capacitor","variable capacitors"],"what":"A capacitor whose capacitance can be adjusted.","how":"Moving plates changes overlap area or spacing.","application":"Tuning a radio resonant circuit.","trap":"Different from a potentiometer, which varies resistance."},{"topic":"3.10","page":"202–251","name":"Diamagnetic material","aliases":["diamagnetic","diamagnetism"],"what":"A material weakly repelled by a magnetic field.","how":"Its induced magnetisation opposes the applied field.","application":"Copper and other diamagnetic materials have a very weak response.","trap":"Do not confuse with paramagnetism."},{"topic":"3.10","page":"238–251","name":"Eddy current","aliases":["eddy currents"],"what":"Circulating currents induced within conductive material.","how":"Changing magnetic flux produces loops of current and heating.","application":"Induction heating and magnetic braking; unwanted losses in transformer cores.","trap":"Laminations reduce eddy-current loss."},{"topic":"3.10","page":"202–251","name":"Electromagnet","aliases":["electromagnets"],"what":"A magnet created by passing current through a coil.","how":"Current establishes a magnetic field, often strengthened by a soft magnetic core.","application":"Relays, solenoid valves and contactors.","trap":"The field generally depends on current and coil turns."},{"topic":"3.10","page":"202–251","name":"Ferromagnetic material","aliases":["ferromagnetic","ferromagnetism","soft iron"],"what":"A material strongly attracted by magnetic fields.","how":"Its domains can align with an applied field.","application":"Magnetic cores of transformers and relays.","trap":"Soft iron is easily magnetised and demagnetised."},{"topic":"3.10","page":"238–251","name":"Hysteresis","aliases":["hysteresis loss"],"what":"Magnetisation lagging changes in the applied magnetic field.","how":"Repeated reversal uses energy and creates heat.","application":"AC magnetic cores exhibit hysteresis loss.","trap":"Soft magnetic materials generally have a narrow hysteresis loop."},{"topic":"3.10","page":"238–251","name":"Magnetic core","aliases":["iron core","laminated core","soft-iron core"],"what":"A piece of magnetic material providing an easier path for flux.","how":"High permeability concentrates the magnetic field.","application":"Transformer and inductor cores.","trap":"Saturation limits the increase in flux."},{"topic":"3.10","page":"238–251","name":"Magnetic flux","aliases":["flux density","magnetic flux density"],"what":"Magnetic flux describes the field passing through an area.","how":"Flux density is flux per perpendicular area.","application":"Explaining generator output and magnetic pickup response.","trap":"Flux is in webers; flux density in teslas."},{"topic":"3.10","page":"238–251","name":"Magnetic saturation","aliases":["saturation"],"what":"The point at which increasing magnetising force gives little extra flux.","how":"Most available magnetic domains are aligned.","application":"A transformer core can saturate when operated outside design conditions.","trap":"Inductance may fall substantially near saturation."},{"topic":"3.10","page":"238–251","name":"Magnetic shielding","aliases":["magnetic shield"],"what":"A material arrangement that redirects or attenuates magnetic fields.","how":"High permeability can provide a preferred flux path.","application":"Protecting sensitive instruments from nearby magnetic equipment.","trap":"Shielding depends on field type and geometry."},{"topic":"3.10","page":"202–251","name":"Paramagnetic material","aliases":["paramagnetic","paramagnetism"],"what":"A material weakly attracted to a magnetic field.","how":"It develops a small magnetisation in the field direction.","application":"Material selection around sensitive magnetic equipment.","trap":"Much weaker response than ferromagnetism."},{"topic":"3.10","page":"202–251","name":"Permanent magnet","aliases":["permanent magnets"],"what":"A material that keeps its own magnetic field.","how":"Magnetic domains remain substantially aligned after magnetisation.","application":"Magnetic pickups and permanent-magnet generators.","trap":"Hard magnetic material retains magnetism."},{"topic":"3.10","page":"202–251","name":"Solenoid","aliases":["solenoids"],"what":"A coil that produces a magnetic field, often to move a plunger.","how":"Energising it attracts a movable iron core.","application":"Electrically operated valves or actuating latches.","trap":"A solenoid can convert electrical input into linear motion."},{"topic":"3.11","page":"257–288","name":"Air-core coil","aliases":["air core","air-core inductor"],"what":"An inductor without a ferromagnetic core.","how":"Its magnetic field passes mainly through air.","application":"RF coils and inductors where core losses are undesirable.","trap":"Air cores do not have ferromagnetic saturation."},{"topic":"3.11","page":"257–288","name":"Back EMF","aliases":["back-emf","counter EMF","back electromotive force"],"what":"An induced voltage that opposes the change causing it.","how":"An inductive coil or running motor generates opposing voltage.","application":"Motor current falls as speed and back EMF rise.","trap":"Switching off coils can create a large voltage transient."},{"topic":"3.11","page":"257–288","name":"Choke","aliases":["chokes","choke coil"],"what":"An inductor used to impede changing current.","how":"Its reactance increases with AC frequency.","application":"Power-supply and electromagnetic interference filters.","trap":"A choke ideally passes DC more easily than high-frequency AC."},{"topic":"3.11","page":"282","name":"Diode","aliases":["diodes"],"what":"A semiconductor device that allows current much more readily in one direction.","how":"It conducts when forward biased and blocks ordinary reverse voltage within ratings.","application":"Rectification and suppression of coil switching transients.","trap":"Reverse voltage ratings matter."},{"topic":"3.11","page":"257–288","name":"Faraday's law","aliases":["Faraday’s law","electromagnetic induction"],"what":"Changing magnetic flux linkage induces voltage.","how":"Faster change or more turns produces more induced EMF.","application":"Generators, transformers and inductive sensors.","trap":"No changing flux linkage means no induced EMF."},{"topic":"3.11","page":"257–288","name":"Galvanometer","aliases":["galvanometers"],"what":"A sensitive instrument for detecting small current.","how":"A current produces a magnetic force and pointer deflection.","application":"Detecting Wheatstone bridge imbalance.","trap":"At bridge balance the detector reads zero."},{"topic":"3.11","page":"257–288","name":"Inductor","aliases":["inductors","inductance coil"],"what":"A coil that stores energy in a magnetic field.","how":"It develops a voltage opposing changes in current.","application":"Smoothing current and filtering electrical noise.","trap":"It opposes changes in current, not steady ideal DC."},{"topic":"3.11","page":"257–288","name":"Lenz's law","aliases":["Lenz’s law"],"what":"The induced effect opposes the change that created it.","how":"The direction follows conservation of energy.","application":"Explains coil back EMF and magnetic braking.","trap":"Opposes the change, not necessarily the original field."},{"topic":"3.11","page":"257–288","name":"Mutual induction","aliases":["mutual inductance"],"what":"A changing current in one coil induces voltage in another.","how":"The coils link through changing magnetic flux.","application":"Transformer energy transfer without a direct electrical connection.","trap":"A steady DC current does not sustain an induced secondary voltage."},{"topic":"3.12","page":"292–323","name":"Armature","aliases":["armatures","armature winding"],"what":"The winding or assembly in which useful voltage is induced or current interacts with the field.","how":"In conventional DC machines it is commonly the rotating winding.","application":"DC motors and generators.","trap":"In a rotating-field alternator the armature can be stationary."},{"topic":"3.12","page":"292–323","name":"Carbon brush","aliases":["carbon brushes","brushes"],"what":"A stationary sliding electrical contact.","how":"It carries current between a moving commutator or slip ring and fixed wiring.","application":"Servicing brushed motors or generators under approved instructions.","trap":"Wear and contact resistance can affect performance."},{"topic":"3.12","page":"292–323","name":"Commutator","aliases":["commutators"],"what":"Segmented conducting contacts connected to a rotating winding.","how":"Brushes switch connections as the rotor turns.","application":"Brushed DC motors and DC generators.","trap":"A commutator switches connections; slip rings do not."},{"topic":"3.12","page":"292–323","name":"Compound motor","aliases":["compound-wound motor","compound machine"],"what":"A machine with both series and shunt field windings.","how":"The fields combine to tailor torque and speed characteristics.","application":"Drives needing starting torque and more stable speed.","trap":"Cumulative and differential compound fields act differently."},{"topic":"3.12","page":"292–323","name":"DC generator","aliases":["direct current generator"],"what":"A machine converting rotation into a DC output.","how":"Induced alternating voltage in rotating coils is mechanically rectified by a commutator.","application":"Older DC power generation systems.","trap":"Do not confuse commutator and slip rings."},{"topic":"3.12","page":"292–323","name":"DC series motor","aliases":["series-wound motor","series motor"],"what":"A DC motor with field and armature in series.","how":"High starting current creates strong field and torque.","application":"Older high-starting-torque drive applications.","trap":"Speed can become excessive at very light load."},{"topic":"3.12","page":"292–323","name":"DC shunt motor","aliases":["shunt-wound motor","shunt motor"],"what":"A DC motor with field winding connected in parallel with the armature.","how":"Field current remains relatively stable as load changes.","application":"Constant-speed drive applications.","trap":"Compared with a series motor, speed regulation is better."},{"topic":"3.12","page":"292–323","name":"Field winding","aliases":["field windings","field coil","excitation winding"],"what":"A coil that produces the machine's working magnetic field.","how":"Current through it sets magnetic field strength.","application":"Regulating a wound-field generator's output.","trap":"Excitation current is not the same as load current."},{"topic":"3.12","page":"323","name":"Interpole","aliases":["interpoles","commutating poles"],"what":"A small auxiliary magnetic pole between the main poles of a DC machine.","how":"It helps correct the field around the commutation region.","application":"Improving commutation in brushed motors and generators.","trap":"Its purpose is reducing commutation problems, not replacing the main field."},{"topic":"3.12","page":"292–323","name":"Rotor","aliases":["rotors","rotor winding"],"what":"The rotating part of an electrical machine.","how":"Its field or conductors interact with the stationary part.","application":"Motor shafts and generator rotating assemblies.","trap":"Rotor means rotating, not necessarily the armature."},{"topic":"3.12","page":"292–323","name":"Starter-generator","aliases":["starter generator","starter-generators"],"what":"One machine that can start an engine and then generate electrical power.","how":"As a motor it drives the engine; once running it acts as a generator.","application":"Some turbine aircraft electrical systems.","trap":"Motor and generator operation use different energy-flow directions."},{"topic":"3.12","page":"292–323","name":"Stator","aliases":["stators","stator winding"],"what":"The stationary part of a rotating electrical machine.","how":"Its windings or magnets create or receive magnetic flux.","application":"The stationary output windings of many alternators.","trap":"Stator means stationary, not necessarily the field winding."},{"topic":"3.13","page":"327–351","name":"Delta connection","aliases":["delta-connected","delta connections"],"what":"Three windings connected end to end in a closed triangle.","how":"Each winding is connected between two lines.","application":"Three-phase motor and transformer connections.","trap":"Line voltage equals phase voltage; line current is square root of three times phase current when balanced."},{"topic":"3.13","page":"327–351","name":"Phasor","aliases":["phasors"],"what":"An arrow representing AC magnitude and phase.","how":"It allows sinusoidal quantities of the same frequency to be compared.","application":"Analysing phase differences in AC power systems.","trap":"Angle represents phase, not physical location."},{"topic":"3.13","page":"327–351","name":"Sawtooth wave","aliases":["sawtooth","saw-tooth waveform"],"what":"A ramp waveform followed by a rapid reset.","how":"It repeatedly increases or decreases linearly then returns.","application":"Time-base and scanning circuits.","trap":"Different rise and fall shape from a triangle wave."},{"topic":"3.13","page":"327–351","name":"Sine wave","aliases":["sinusoidal waveform","sinusoidal voltage","sinusoidal current"],"what":"A smooth repeating AC waveform.","how":"It rises and falls according to a sine function.","application":"Ideal alternator voltage and AC circuit analysis.","trap":"RMS equals peak divided by square root of two for a pure sine."},{"topic":"3.13","page":"327–351","name":"Square wave","aliases":["square waves"],"what":"A waveform switching between two levels.","how":"It spends portions of each cycle at high and low levels.","application":"Digital timing and switched electronics.","trap":"Its RMS conversion is not the sine-wave formula."},{"topic":"3.13","page":"327–351","name":"Star connection","aliases":["wye connection","star-connected","wye-connected"],"what":"Three windings joined at a common neutral point.","how":"Line voltage is square root of three times phase voltage in a balanced system.","application":"Three-phase generators and loads.","trap":"Line current equals phase current."},{"topic":"3.13","page":"327–351","name":"Triangle wave","aliases":["triangular waveform","triangle waveform"],"what":"A waveform with straight rising and falling ramps.","how":"Voltage changes at approximately constant rates in each direction.","application":"Signal generators and modulation circuits.","trap":"The sine-wave RMS factor does not apply."},{"topic":"3.14","page":"353–401","name":"Impedance","aliases":["impedances"],"what":"The total opposition to AC, including resistance and reactance.","how":"Resistance and net reactance combine as a complex quantity.","application":"Determining current drawn by an AC load.","trap":"Do not simply add R and X as ordinary magnitudes."},{"topic":"3.14","page":"353–401","name":"Power factor","aliases":["PF"],"what":"The ratio of real power to apparent power.","how":"Current and voltage phase differences reduce the proportion doing useful work in a sinusoidal circuit.","application":"Sizing generator and distribution equipment.","trap":"Unity power factor means real and apparent power are equal."},{"topic":"3.14","page":"353–401","name":"RC circuit","aliases":["resistor-capacitor circuit"],"what":"A circuit containing a resistor and capacitor.","how":"The resistor controls charging and discharging; the capacitor stores energy.","application":"Signal filtering and timing.","trap":"The time constant is RC."},{"topic":"3.14","page":"353–401","name":"Reactance","aliases":["inductive reactance","capacitive reactance"],"what":"Opposition to AC caused by energy storage in electric or magnetic fields.","how":"XL rises with frequency; XC falls with ":"Primary winding","aliases":["primary coil"],"what":"The winding connected to the input supply.","how":"Alternating current creates changing core flux.","application":"Input side of a conventional transformer.","trap":"Primary is input, not always the higher-voltage winding."},{"topic":"3.15","page":"404–447","name":"Secondary winding","aliases":["secondary coil"],"what":"The winding delivering transformer output.","how":"Changing core flux induces voltage in it.","application":"Output feeding a connected AC load.","trap":"The voltage depends on turns ratio; current depends on load."},{"topic":"3.15","page":"404–447","name":"Step-down transformer","aliases":["step down transformer","step-down"],"what":"A transformer with fewer secondary turns than primary turns.","how":"Lowers voltage and increases available current for a given ideal power.","application":"Supplying lower-voltage AC equipment.","trap":"It does not create extra power."},{"topic":"3.15","page":"404–447","name":"Step-up transformer","aliases":["step up transformer","step-up"],"what":"A transformer with more secondary turns than primary turns.","how":"Raises secondary voltage while reducing available current for a given ideal power.","application":"Raising voltage for power transmission or specialised equipment.","trap":"Voltage ratio follows turns ratio."},{"topic":"3.15","page":"404–447","name":"Transformer","aliases":["transformers"],"what":"Two or more windings that transfer energy through changing magnetic flux.","how":"The turns ratio determines the ideal voltage ratio.","application":"Changing AC voltage in power supplies and aircraft electrical equipment.","trap":"Does not change frequency; steady DC cannot sustain transformer action."},{"topic":"3.15","page":"443–447","name":"Variac","aliases":["variable autotransformer"],"what":"An adjustable autotransformer with a moving contact.","how":"The contact selects the effective turns ratio.","application":"Adjustable AC test supplies.","trap":"An ation":"Pilot excitation supply in some brushless aircraft generators.","trap":"The PMG, exciter and main generator can be separate stages."},{"topic":"3.17","page":"481–482","name":"Rectifier","aliases":["rectifiers","rectification"],"what":"A device or circuit that converts AC into DC.","how":"Diodes guide current in the desired output direction.","application":"Converting exciter AC to the DC field current in a brushless generator.","trap":"Rectified output can still contain ripple."},{"topic":"3.17","page":"462–464","name":"Rotating armature generator","aliases":["revolving armature generator","rotating-armature generator"],"what":"A generator with the output winding on the rotor.","how":"Generated power leaves the rotating assembly through contacts.","application":"Small or older generator arrangements.","trap":"Passing high load current through sliding contacts limits usefulness."},{"topic":"3.17","page":"462–464","name":"Rotating field generator","aliases":["revolving field generator","rotating-field alternator","rotating-field generator"],"what":"A generator with the field on the rotor and output windings on the stator.","how":"The spinning magnetic field induces AC in stationary windings.","application":"Common high-power alternator arrangement.","trap":"Only excitation need cross sliding contacts in a brushed design."},{"topic":"3.17","page":"480–482","name":"Rotating rectifier","aliases":["rotating rectifiers","rotating diode assembly"],"what":"A rectifier mounted on a rotating shaft.","how":"Converts exciter AC into DC for the rotating main field.","application":"Brushless alternator excitation system.","trap":"It rectifies exciter output, not necessarily main AC output."},{"topic":"3.17","page":"462–464","name":"Slip ring","aliases":["slip rings"],"what":"A continuous conducting ring transferring electrical connection to a rotating assembly.","how":"A brush maintains contact as the ring rotates.","application":"Supplying rotor excitation in some wound-f  const p=state.packs[i];if(!p||!p.qaApproved||!(formal(p)||calculationPack(p)))return;
 guidedMode=true;guidedAnswers=[];guidedComplete=false;tutorPack=p.title;tutorIndex=0;tutorSourceIndex=tutorBestPage();tutorZoom=1;view='tutor';render();scrollTo(0,0)
}
function guidedAnswer(i){
 const q=tutorQuestion();if(!guidedMode||guidedComplete||!q||guidedAnswers[tutorIndex]!==undefined||!Number.isInteger(i)||i<0||i>=q.options.length)return;
 guidedAnswers[tutorIndex]=i;tutorSourceIndex=tutorBestPage();tutorZoom=1;render();
 const feedback=$('guidedFeedback');if(feedback)feedback.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function guidedNext(){
 if(!guidedMode||guidedAnswers[tutorIndex]===undefined)return;
 if(tutorIndex+1>=tutorQuestions().length){guidedComplete=true;cancelTutor();render();scrollTo(0,0);return}
 tutorMove(tutorIndex+1)
}
function guidedPrevious(){if(guidedMode&&tutorIndex>0)tutorMove(tutorIndex-1)}
function guidedRestart(){guidedAnswers=[];guidedComplete=false;tutorIndex=0;tutorSourceIndex=tutorBestPage();tutorZoom=1;render();scrollTo(0,0)}
function guidedReview(i){if(!guidedMode||guidedAnswers[i]===undefined)return;guidedComplete=false;tutorMove(i)}
function guidedScreen(){
 const qs=tutorQuestions(),q=qs[tutorIndex],answered=guidedAnswers[tutorIndex]!==undefined;
 if(!q)return '<p>No questions available.</p>';
 const score=qs.filter((x,i)=>guidedAnswers[i]===x.answer).length,done=qs.filter((x,i)=>guidedAnswers[i]!==undefined).length;
 const base=hdr('Guided Mock','Study & Tutor · untimed · immediate teaching')+'<div class="btnrow" style="margin-bottom:14px"><button class="btn secondary" onclick="guidedExit()">‹ All papers</button></div>';
 if(guidedComplete)return base+`<div class="card"><div class="kicker">GUIDED PRACTICE COMPLETE</div><h2>${safe(tutorPack)}</h2><div class="metric">${score}/${qs.length}</div><p class="softnote">First-answer accuracy: ${Math.round(score/qs.length*100)}%. This is study practice, not an official mock result.</p><div class="btnrow"><button class="btn" onclick="guidedRestart()">Repeat paper</button><button class="btn secondary" onclick="guidedExit()">All papers</button></div></div><h2 class="sectiontitle">Review missed questions</h2><div class="card">${qs.map((x,i)=>({x,i})).filter(({x,i})=>guidedAnswers[i]!==x.answer).map(({x,i})=>`<div class="listitem"><div><b>Question ${i+1}</b><div class="mini">${safe(x.q)}</div></div><button class="btn secondary" onclick="guidedReview(${i})">Review</button></div>`).join('')||'<p>Excellent — all first answers were correct.</p>'}</div>`;
 const chosen=guidedAnswers[tutorIndex],correct=chosen===q.answer;
 return base+`<div class="card tutor-nav"><b>${safe(tutorPack)}</b><p class="mini">${done} of ${qs.length} answered · ${score} correct so far</p><div class="progress"><i style="width:${100*done/qs.length}%"></i></div></div><div class="${answered?'tutor-grid':'guided-single'}"><div class="card"><div class="qhead"><span>Question ${tutorIndex+1} of ${qs.length} · ${safe(q.blueprintSubsection||q.topic)}</span><span class="tag">Level ${safe(q.level)}</span></div><p class="question">${answered?componentLink(q.q):safe(q.q)}</p>${q.options.map((o,i)=>answered?`<div class="tutor-choice ${i===q.answer?'tutor-correct':i===chosen?'guided-wrong':''}"><b>${'ABC'[i]}.</b> ${componentLink(o)} ${i===q.answer?' <b>✓ Correct answer</b>':i===chosen?' <b>✕ Your answer</b>':''}</div>`:`<button class="answer guided-option" onclick="guidedAnswer(${i})"><b>${'ABC'[i]}.</b> ${safe(o)}</button>`).join('')}${answered?`<div id="guidedFeedback" class="tutor-explain" role="status"><div class="guided-verdict ${correct?'guided-yes':'guided-no'}">${correct?'✓ Correct — nicely done!':'✕ Not quite — let’s break it down'}</div><p><b>Correct answer:</b> ${componentLink(q.options[q.answer])}</p><div class="lesson-label">Why this is the answer</div><p>${componentLink(q.explanation||'No written explanation recorded.')}</p>${q.working?`<div class="lesson-working"><b>Worked solution</b><p>${componentLink(q.working)}</p></div>`:''}<p class="mini">Resource Group notes · PDF p. ${safe(q.page||'no reference')}</p></div>`:'<p class="mini">Choose an answer to unlock the explanation and source. Your first choice is recorded for this practice session.</p>'}<div class="btnrow" style="margin-top:14px"><button class="btn secondary" ${tutorIndex===0?'disabled':''} onclick="guidedPrevious()">‹ Previous</button><button class="btn" ${answered?'':'disabled'} onclick="guidedNext()">${tutorIndex===qs.length-1?'Finish practice':'Next question ›'}</button></div></div>${answered?tutorSourceCard(q):''}</div>`;
}
function guidedExit(){if(!guidedComplete&&guidedAnswers.some(x=>x!==undefined)&&!confirm('Leave guided practice? This practice session will not be saved.'))return;tutorHome()}

function tutor(){if(guidedMode)return guidedScreen();const q=tutorQuestion(),qs=tutorQuestions();if(!q){const papers=state.packs.map((p,i)=>({p,i})).filter(({p})=>p.qaApproved&&(formal(p)||calculationPack(p)));const list=(items)=>items.map(({p,i})=>`<div class="listitem"><div><b>${safe(p.title)}</b><div class="mini">${p.questions.length} questions · answers and explanations visible</div></div><div class="btnrow"><button class="btn" onclick="guidedOpen(${i})">Guided mock ›</button><button class="btn secondary" onclick="tutorOpen(${i})">Review answers</button></div></div>`).join('')||'<p class="softnote">No approved papers installed in this category yet.</p>';return hdr('Study & Tutor','Explore components or learn from your papers, without starting an exam')+componentExplorer()+`<div class="card softnote">Choose Guided mock to answer each question first, then unlock the correct answer, teaching and PDF source. Choose Review answers to see answers immediately. Both are untimed and separate from your official exam results.</div><h2 class="sectiontitle">Mock exam lessons</h2><div class="card">${list(papers.filter(({p})=>formal(p)&&!shortMock(p)))}</div><h2 class="sectiontitle">Short-form mock lessons</h2><div class="card">${list(papers.filter(({p})=>shortMock(p)))}</div><h2 class="sectiontitle">Calculation paper lessons</h2><div class="card">${list(papers.filter(({p})=>calculationPack(p)))}</div>`}
const pages=tutorPages(q.page);return hdr('Study & Tutor','Study only · no exam timer or scoring')+`<div class="btnrow" style="margin-bottom:14px"><button class="btn secondary" onclick="tutorHome()">‹ All papers</button></div><div class="card tutor-nav"><b>${safe(tutorPack)}</b><div class="btnrow" style="margin-top:10px;align-items:center"><button class="btn secondary" ${tutorIndex===0?'disabled':''} onclick="tutorMove(tutorIndex-1)">‹ Previous</button><select aria-label="Select question" class="field" onchange="tutorMove(Number(this.value))">${qs.map((x,i)=>`<option value="${i}" ${i===tutorIndex?'selected':''}>Question ${i+1} · ${safe(x.blueprintSubsection||x.topic)}</option>`).join('')}</select><button class="btn" ${tutorIndex===qs.length-1?'disabled':''} onclick="tutorMove(tutorIndex+1)">Next ›</button></div><div class="progress"><i style="width:${100*(tutorIndex+1)/qs.length}%"></i></div></div><div class="tutor-grid"><div class="card"><div class="qhead"><span>Question ${tutorIndex+1} of ${qs.length} · ${safe(q.blueprintSubsection||q.topic)}</span><span class="tag">Level ${safe(q.level)}</span></div><p class="question">${componentLink(q.q)}</p>${q.options.map((o,i)=>`<div class="tutor-choice ${i===q.answer?'tutor-correct':''}"><b>${'ABC'[i]}.</b> ${componentLink(o)}${i===q.answer?' <b>✓</b>':''}</div>`).join('')}<div class="tutor-explain"><div class="lesson-label">${uiIcon('study','inline-note-icon')} Let's break it down</div><p>${componentLink(q.explanation||'No explanation recorded.')}</p>${q.working?`<div class="lesson-working"><b>Worked solution</b><p>${componentLink(q.working)}</p></div>`:''}<div class="mini">Correct answer: ${componentLink(q.options[q.answer])}</div></div></div>${tutorSourceCard(q)}</div>`}
function tutorStep(d){const pages=tutorPages(tutorQuestion()?.page);tutorSourceIndex=Math.max(0,Math.min(pages.length-1,tutorSourceIndex+d));renderTutorSource()}
function tutorScale(d){tutorZoom=d===0?1:Math.max(1,Math.min(3,tutorZoom+d));renderTutorSource()}
function cancelTutor(){tutorGen++;if(tutorTask){tutorTask.cancel();tutorTask=null}}
async function renderTutorSource(){const gen=++tutorGen,status=$('tutorStatus'),reader=$('tutorReader'),pages=tutorPages(tutorQuestion()?.page);if(!status||!reader||!pages.length)return;const n=pages[tutorSourceIndex]||pages[0];$('tutorPageLabel').textContent=`Page ${n} · ${tutorSourceIndex+1}/${pages.length}`;status.textContent='Loading original page…';try{const doc=await ensureNotes();if(gen!==tutorGen||view!=='tutor')return;if(!doc){status.textContent='Import the original PDF in Notes first, then return here.';return}const old=tutorTask;if(old){old.cancel();try{await old.promise}catch{}if(gen!==tutorGen)return;if(tutorTask===old)tutorTask=null}const page=await doc.getPage(n);if(gen!==tutorGen||view!=='tutor')return;const canvas=$('tutorCanvas'),base=page.getViewport({scale:1}),scale=Math.max(150,reader.clientWidth-20)/base.width*tutorZoom,ratio=Math.min(devicePixelRatio||1,2,Math.sqrt(10000000/(base.width*base.height*scale*scale)));const viewport=page.getViewport({scale:scale*ratio});canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);canvas.style.width=base.width*scale+'px';canvas.style.height=base.height*scale+'px';const task=page.render({canvasContext:canvas.getContext('2d'),viewport});tutorTask=task;await task.promise;if(gen===tutorGen){tutorTask=null;const hit=tutorMatch(tutorQuestion()),painted=tutorPaintHighlight(canvas,n);status.textContent=painted?'Suggested passage highlighted · original PDF':!tutorHighlightOn?'Highlighting off · original PDF':hit?'Suggested passage is on page '+hit.p:'No confident passage match · original cited page';if(painted){const rect=hit.r[0];reader.scrollTop=Math.max(0,rect[1]*canvas.clientHeight-24)}else reader.scrollTop=0;}}catch(e){if(gen===tutorGen&&e.name!=='RenderingCancelledException')status.textContent='Unable to load page: '+e.message}}
