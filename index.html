const UNIT_PREFIXES=[['giga','G','10⁹','1 GW = 1,000,000,000 W'],['mega','M','10⁶','1 MΩ = 1,000,000 Ω'],['kilo','k','10³','1 kΩ = 1,000 Ω'],['milli','m','10⁻³','1 mA = 0.001 A'],['micro','μ / µ','10⁻⁶','1 µF = 0.000001 F'],['nano','n','10⁻⁹','1 nF = 0.000000001 F'],['pico','p','10⁻¹²','1 pF = 0.000000000001 F']];
let formulaReferenceTab='formulas',unitQuery='',unitGroup='all';
function unitNorm(s){return String(s).normalize('NFKC').replaceAll('μ','u').replaceAll('µ','u').replaceAll('Ω','ohm').replaceAll('ω','omega').toLowerCase().trim()}
function filteredUnits(){let query=unitNorm(unitQuery);return UNIT_ROWS.filter(r=>(unitGroup==='all'||r[0]===unitGroup)&&(!query||(query.length===1?unitNorm(r[2]+' '+r[4]).split(/[\s,\/()·]+/).includes(query):unitNorm(r.join(' ')).includes(query)))).sort((a,b)=>a[1].localeCompare(b[1]))}
function unitResults(){let rows=filteredUnits(),query=unitNorm(unitQuery),prefixes=UNIT_PREFIXES.filter(r=>!query||unitNorm(r.join(' ')).includes(query));return `${rows.length?rows.map(r=>`<details class="card unit-entry"><summary><span class="unit-measure"><b>${safe(r[4])}</b><span>${safe(r[3])}</span></span><span class="unit-name"><b>${safe(r[1])}</b><span class="mini">Formula symbol: ${safe(r[2])}</span></span><span class="unit-expand">⌄</span></summary><div class="unit-body"><p><b>What it measures</b><br>${safe(r[5])}</p><p class="unit-equation">${safe(r[6])}</p><p><b>Remember:</b> ${safe(r[7])}</p><p class="mini">Original notes · PDF ${safe(r[8])}</p>${noteButtons(r[8])}</div></details>`).join(''):'<div class="card softnote">No matching quantities.</div>'}${unitGroup==='all'&&prefixes.length?`<h2 class="sectiontitle">SI prefixes</h2><div class="card">${prefixes.map(r=>`<div class="listitem"><div><b>${safe(r[0])} (${safe(r[1])})</b><div class="mini">${safe(r[3])}</div></div><b>${safe(r[2])}</b></div>`).join('')}<p class="softnote">Uppercase M = mega; lowercase m = milli. Prefixes multiply the unit, not the quantity symbol.</p>${noteButtons('31')}</div>`:''}`}
function refreshUnits(){const el=$('unitResults');if(el)el.innerHTML=unitResults();const count=$('unitCount');if(count)count.textContent=filteredUnits().length+' matching quantities'}
function unitPanel(){return `<div class="card"><p class="softnote">What electrical quantities and their units actually mean. Search by name, symbol or unit; expand any entry for a definition, formula, memory aid and notes link.</p><input type="search" class="field" aria-label="Search symbols and units" placeholder="Search e.g. farad, Q, ohm…" value="${safe(unitQuery)}" oninput="unitQuery=this.value;refreshUnits()" style="width:100%;margin-bottom:10px"><select class="field" aria-label="Quantity category" onchange="unitGroup=this.value;refreshUnits()"><option value="all">All categories</option>${[...new Set(UNIT_ROWS.map(r=>r[0]))].map(g=>`<option ${unitGroup===g?'selected':''} value="${safe(g)}">${safe(g)}</option>`).join('')}</select><p class="mini" id="unitCount">${filteredUnits().length} matching quantities</p><p class="softnote">Formula symbols can have different meanings in different contexts; unit symbols are case-sensitive. For example, C can mean capacitance in an equation or coulomb as a unit.</p></div><div id="unitResults" style="margin-top:12px">${unitResults()}</div>`}
function referencePanel(){return `<h2 class="sectiontitle" id="referenceTop">Reference library</h2><div class="btnrow" style="margin-bottom:14px"><button class="btn ${formulaReferenceTab==='formulas'?'':'secondary'}" onclick="formulaReferenceTab='formulas';render();$('referenceTop').scrollIntoView()">Formula Library</button><button class="btn ${formulaReferenceTab==='units'?'':'secondary'}" onclick="formulaReferenceTab='units';render();$('referenceTop').scrollIntoView()">Symbols &amp; Units</button></div>${formulaReferenceTab==='units'?unitPanel():formulaPanel()}`}

const REVISION_TOPICS=[["3.1", "Electron theory", "2–10", ["Proton +, neutron neutral (both in nucleus); electron − in shells. Neutral atom: equal protons and electrons. Almost all mass is in nucleus.", "Positive ion loses electrons; negative ion gains them. Ionisation requires energy to remove an electron. Molecule: bonded atoms; compound: different elements chemically combined.", "Ionic bonding transfers electrons; covalent shares them; metallic bonding has mobile delocalised electrons.", "Conductors have mobile electrons (e.g. copper); insulators resist free-electron motion. Silicon/germanium are semiconductors; doping changes carrier concentration; conductivity generally increases with temperature."], ["Ions change electron count, not proton count.", "Electron direction and conventional current are opposite."], "Proton +, electron −; positive ion loses electrons. Conductors have mobile carriers; doping changes semiconductor conductivity."], ["3.2", "Static electricity and conduction", "12–27", ["Charge by friction or contact transfers electrons; induction redistributes charge without contact. Earthing an induced conductor can leave a net charge. Like charges repel, unlike attract; a charged body can attract a neutral body by polarisation.", "Coulomb force F = k|Q₁Q₂|/r²; k ≈ 9 × 10⁹ N·m²/C². Doubling distance quarters force.", "Solid metals: free electrons. Electrolytes: mobile positive and negative ions; cations go to cathode, anions to anode. Pure water conducts poorly; dissolved ions increase conductivity.", "Gas conduction requires ionisation; collisions can create cascades. In a vacuum, emitted electrons carry current; electron beams can be deflected by fields (CRT)."], ["Do not confuse induction with direct contact.", "Coulomb force obeys inverse square, not inverse distance."], "Like repel/unlike attract; induction without contact. F ∝ 1/r². Metals electrons; liquids ions; gases ionise; vacuum emitted electrons."], ["3.3", "Electrical terminology", "30–42", ["Voltage/PD = energy transferred per charge (V = E/Q). EMF = energy supplied per charge, equal to open-circuit terminal voltage. Current I = Q/t; charge Q = It; 1 C = 1 A·s; 1 Ah = 3600 C.", "Resistance R = V/I (Ω); conductance G = 1/R (S). Conventional current + to − outside source; electrons − to +. DC unidirectional; AC periodically reverses.", "Ammeter in series, low resistance; voltmeter across component, high resistance. Choose correct range and DC polarity.", "Prefixes: G 10⁹, M 10⁶, k 10³, m 10⁻³, µ 10⁻⁶, n 10⁻⁹, p 10⁻¹². Typical aircraft systems 28 V DC and 115 V AC."], ["m versus M differ by 10⁹.", "Voltage is not current; never connect an ammeter across a supply."], "I = Q/t; V = E/Q; G = 1/R; 1 Ah = 3600 C. Ammeter series, voltmeter parallel. M ≠ m."], ["3.4", "Generation of electricity", "45–51", ["Six methods: light (photovoltaic), heat (thermoelectric), friction, pressure (piezoelectric), chemical reaction, magnetism (electromagnetic induction).", "Solar cell: light creates electron-hole pairs; junction separates carriers, electrodes collect current. Thermocouple: two dissimilar metals, temperature difference produces EMF.", "Friction separates charges; aircraft static dischargers help dissipate static charge, especially at trailing edges. Strong fields at sharp points encourage discharge.", "Piezoelectric material develops charge when stressed; reverse effect causes deformation with voltage. Galvanic cell converts chemical energy to electrical; zinc electrode becomes negative in copper-zinc example.", "Generator: changing flux linkage induces EMF. Rotor rotates, stator stationary. Alternator generates AC."], ["Thermocouple measures temperature difference, not absolute temperature without a reference.", "Induction needs change in flux linkage; steady field alone is insufficient."], "Light, heat, friction, pressure, chemical, magnetism. Piezo: pressure ↔ voltage. Thermocouple: dissimilar metals + temperature difference."], ["3.5", "DC sources of electricity", "54–84", ["Primary cells normally non-rechargeable; secondary rechargeable. Zinc-carbon: zinc container negative, carbon rod positive collector; electrolyte paste. Alkaline primary cells not intended for recharge.", "Lead-acid: charged positive PbO₂, negative Pb, dilute H₂SO₄. Discharge forms PbSO₄ at both plates; acid specific gravity falls. Charging reverses reaction; nominal 2 V/cell.", "Ni-Cd: nickel positive, cadmium negative; potassium hydroxide electrolyte (KOH), nominal 1.2 V/cell. State of charge not reliably indicated by electrolyte specific gravity. Risk of thermal runaway; electrolyte level depends on charge state.", "Silver oxide/mercury/lithium cells have different chemistries and voltages; common lithium coin cell 3 V. Capacity Ah = A × h; affected by rate, temperature and condition.", "Identical cells series: add EMF and internal resistance. Parallel: EMF unchanged; effective internal resistance r/n, capacity increases. Unequal EMFs in parallel can circulate current.", "Off-load Vt = E. On discharge Vt = E − Ir; I = E/(R+r); short-circuit I = E/r. Thermocouple and photovoltaic cell also DC sources."], ["Battery Ah is charge, not energy.", "Lead-acid electrolyte specific gravity changes with charge; Ni-Cd is different.", "Series raises voltage; parallel raises capacity."], "Pb-acid 2 V/cell; Ni-Cd 1.2 V/cell. Series E adds, parallel E same. Vt = E − Ir; Isc = E/r. Ah = A × h."], ["3.6", "DC circuits", "88–99", ["Ohm law V = IR at constant temperature. KCL: incoming current = outgoing current (charge conservation). KVL: algebraic sum of EMF and voltage drops around closed loop = 0.", "Series current same; voltage divides in proportion to R. Parallel voltage same; branch currents add. Reduce parallel/series networks systematically, then work back to branch values.", "Aiding sources add; opposing sources subtract (choose loop direction). Off-load terminal voltage equals EMF; loaded source loses Ir internally. Vt = E − Ir, I = E/(R+r).", "For short circuit external R = 0, so current limited by source internal resistance; voltage across short nearly zero."], ["Do not add currents in series or voltages in parallel.", "Use signed voltage rises/drops consistently; terminal voltage is not always EMF."], "V = IR; KCL currents at junction, KVL voltages in loop. Same I series, same V parallel. Vt = E − Ir."], ["3.7", "Resistance and resistors", "101–153", ["R = ρl/A; longer wire higher R, wider area lower R. Resistivity depends on material and temperature; silver extremely low. Use consistent units for ρ and area.", "Colour digits: black 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8, white 9. Multiplier 10^digit; gold ×0.1, silver ×0.01; gold tolerance ±5%, silver ±10%. E12 10%, E24 5% typical.", "Resistor power rating is maximum dissipation under stated conditions; derate at high temperature. Wirewound high power (can be inductive), film precision, surface mount compact.", "Series Rt = ΣR; parallel 1/Rt = Σ1/R; two resistors Rt = R₁R₂/(R₁+R₂). Unloaded divider Vout = Vin × Rlower/Rtotal; load in parallel with lower resistor changes ratio.", "Potentiometer three terminals, wiper gives divider output; rheostat two terminals varies current; preset/trimmer adjustment. NTC resistance falls as temperature rises; PTC rises. VDR resistance falls with applied voltage magnitude.", "R = R₀(1+αΔT). Wheatstone bridge balanced when ratios equal; detector current zero; solve missing resistance by cross-multiplying."], ["Parallel total is below smallest branch; series total above largest.", "Gold and silver are not ordinary digit bands; no tolerance band typically ±20%.", "Area conversion: mm² to m² multiply 10⁻⁶."], "R = ρl/A. Series add; parallel reciprocals. NTC ↓R with ↑T; PTC ↑R. Pot 3 terminals; rheostat 2. Balanced bridge equal ratios."], ["3.8", "Power", "155–170", ["Kinetic energy motion; potential energy stored by position/configuration. Work = force × distance in force direction; joule = N·m. Energy conserved, converted between forms.", "Power is rate of energy transfer: P = E/t = VI = I²R = V²/R. E = Pt = QV = VIt; watt = J/s; 1 kWh = 3.6 MJ.", "At fixed R, doubling V or I quadruples power. At fixed current, P proportional R; at fixed voltage, P inversely proportional R.", "Direct power measurement wattmeter; indirect multiply voltage/current for DC. Current coil series, voltage coil parallel. Resistive heating and power rating determine safe dissipation."], ["kW is power; kWh energy.", "Use correct constant condition before predicting power change."], "P = VI = I²R = V²/R; E = Pt = QV. Double V at fixed R → 4× P. 1 kWh = 3.6 MJ."], ["3.9", "Capacitance and capacitors", "172–200", ["Two conducting plates separated by dielectric store equal/opposite charge; C = Q/V. C = εA/d: larger area or permittivity raises C, wider gap lowers C. Capacitance fuel gauging responds to dielectric changes.", "Electrolytic capacitor usually polarised; paper/film/ceramic typically non-polarised; trimmers variable. Observe voltage rating, polarity and discharge safely before testing.", "Parallel Ctotal = ΣC; series 1/Ctotal = Σ1/C. Series charge same; smaller C has larger voltage. Parallel voltage same.", "RC τ = RC (Ω × F = s). Uncharged capacitor initially draws maximum I = V/R; charging current decays. After 1τ voltage reaches 63.2%; discharge retains 36.8%; after 5τ near steady state.", "Continuity/resistance check: sound capacitor momentary charge indication then high resistance; persistent low indicates short; no response may indicate open (meter/test-dependent). Leakage, dielectric breakdown and absorption possible."], ["Capacitor rules reverse resistor rules.", "Capacitor can retain dangerous charge after power off.", "Use µF = 10⁻⁶ F in RC calculations."], "C = Q/V = εA/d. Parallel add; series reciprocals; smaller series C gets higher V. τ = RC; 63% charge / 37% remain; ~5τ."], ["3.10", "Magnetism", "202–255", ["Field lines form closed loops, outside magnet N→S, never cross; closer lines stronger field. Like poles repel. Magnetic declination is angle between magnetic and geographic north.", "Ferromagnetic domains align when magnetised. Ferromagnetic strongly attracted; paramagnetic weak attraction; diamagnetic weak repulsion. Heating above Curie temperature or alternating field can demagnetise.", "Electromagnet field from current and turns; soft iron core increases field, can be switched. Right-hand grip: fingers conventional current, thumb north/field direction in solenoid. Shielding redirects flux via high permeability material.", "MMF = NI (At); H = NI/l (A/m); Φ flux in Wb; B = Φ/A (T); B = μH; μr = μ/μ₀. Reluctance ℜ = l/(μA), Φ = MMF/ℜ; air gap increases reluctance.", "Hysteresis: lag of B behind H; remanence residual flux, coercivity reverse field needed to reduce it. Saturation: little more B with more H. Soft magnetic materials narrow loop/low loss; permanent magnets hard materials high coercivity. Laminations reduce eddy-current loss; keepers provide magnetic path."], ["Weber total flux, tesla flux density; H and B differ.", "Laminations reduce eddy currents, not hysteresis."], "MMF = NI; H = NI/l; B = Φ/A = μH; ℜ = l/(μA). Soft core low hysteresis; hard magnet high coercivity. Air gap ↑ reluctance."], ["3.11", "Inductance and inductors", "257–288", ["Faraday: induced EMF proportional to rate of change of flux linkage E = −NΔΦ/Δt. Relative motion, stronger field, faster change or more turns increase EMF. Lenz: induced effect opposes change causing it.", "Fleming right hand generator: thumb motion, first finger field N→S, second finger conventional induced current. Left hand motor: thumb force/motion, first finger field, second current.", "Self-induction E = −LΔI/Δt; mutual E₂ = −MΔI₁/Δt. One henry induces 1 V for 1 A/s change. L ∝ μN²A/l for ideal solenoid; coupling depends on distance, orientation, core.", "Inductor opposes current change; switch-off can create large voltage spike. Freewheel diode reverse biased during normal DC supply, conducts when coil switches off. Choke impedes AC, passes steady DC (winding resistance remains).", "Core saturation reduces effective incremental inductance; air core avoids ferromagnetic saturation. Transformers use mutual induction; LC circuits tune frequency."], ["Lenz opposes CHANGE, not always the original field.", "Turns squared for self-inductance; Faraday EMF proportional to turns."], "Faraday E = −NΔΦ/Δt; Lenz opposes change. E = −LΔI/Δt; L ∝ N². Right hand generator, left hand motor."], ["3.12", "DC motor and generator theory", "292–324", ["Motor electrical→mechanical; generator mechanical→electrical. DC commutator reverses armature connection each half-turn for unidirectional torque or rectified output. Brushes contact segmented commutator; laminated armature reduces eddy currents.", "Armature reaction distorts main field and shifts neutral plane; interpoles improve commutation, compensating windings counter armature reaction. Generator EMF increases with flux, speed and active conductor count; field control regulates output.", "Motor back EMF opposes supply; at stall/starting, back EMF near zero → high current. Torque proportional to flux × armature current; P = Tω, ω = 2πn/60. Weakening field generally raises speed at a given armature voltage.", "Series motor field in series: high starting torque, speed varies greatly with load; dangerous unloaded overspeed. Shunt field parallel: relatively constant speed. Compound combines series/shunt characteristics; separately excited field has own supply.", "Reverse either armature or field connection (not both) to reverse rotation. Starter-generator acts as motor for starting then generator; changeover/control circuit reconfigures function."], ["Never run a DC series motor unloaded.", "Back EMF is smallest at start, not largest.", "Reversing both field and armature leaves direction unchanged."], "Motor electrical→mechanical; generator reverse. Series high start torque, no-load danger; shunt constant speed. Back EMF low at stall; P = Tω."], ["3.13", "AC theory", "327–351", ["Cycle 360°; period T = 1/f, frequency Hz. Phase difference is angular/time displacement. Instantaneous sine v = Vpk sin(2πft + φ). Phasor represents magnitude and phase.", "For pure sine Vrms = Vpk/√2 ≈ 0.707 Vpk; Vpp = 2Vpk. Half-cycle mean = 0.637 Vpk; full-cycle algebraic mean zero. RMS is effective heating equivalent, not mean or peak.", "Square, triangle and sawtooth have different waveforms; sine conversion factors not universal. AC ratings normally RMS unless stated.", "Three-phase balanced waveforms 120° apart. Star: VL = √3 Vph, IL = Iph; neutral possible. Delta: VL = Vph, IL = √3 Iph. Single-phase one waveform; polyphase multiple phase-displaced waveforms."], ["Do not use 0.707 for non-sinusoidal waveform.", "Star voltage ratio; delta current ratio."], "T = 1/f; sine RMS = 0.707 peak; Vpp = 2 peak; half mean 0.637 peak. 3φ 120°. Star V×√3; delta I×√3."], ["3.14", "Resistive, capacitive and inductive circuits", "353–401", ["Pure R: current and voltage in phase; pure L: current lags voltage 90°; pure C: current leads voltage 90°. ELI the ICE man (E leads I in L; I leads E in C).", "XL = 2πfL increases with f; XC = 1/(2πfC) decreases with f. Impedance Z = V/I (RMS magnitudes). Skin effect raises AC resistance at higher f.", "Series RL/RC/RLC: same current; voltages add as phasors. Z = √(R²+(XL−XC)²); tan φ = (XL−XC)/R. Net inductive if XL>XC, capacitive if XC>XL.", "Parallel branches: common voltage; branch currents add vectorially; inductive and capacitive reactive currents oppose. Series resonance XL = XC, Z minimum (R), I maximum; ideal parallel resonance input impedance maximum, supply current minimum.", "Real power P = VI cos φ (W), reactive Q = VI sin φ (var), apparent S = VI (VA), S² = P²+Q²; PF = P/S. Pure reactive ideal load average real power zero; low PF requires more current for same real power."], ["Do not add R + XL mechanically; use vectors.", "L lags, C leads.", "Real W, apparent VA, reactive var."], "ELI ICE. XL ↑f, XC ↓f. Z = √(R²+(XL−XC)²). Resonance XL=XC. P=VI cosφ; S=VI; Q=VI sinφ; PF=P/S."], ["3.15", "Transformers", "404–447", ["AC transformer uses mutual induction; primary and secondary share alternating magnetic flux, ideally frequency unchanged. Vs/Vp = Ns/Np = Ip/Is. Step-up voltage means step-down current for ideal power conservation.", "Copper losses I²R, eddy-current loss reduced by laminations, hysteresis reduced by low-loss core. No-load current has magnetising (quadrature) and core-loss (in-phase) components. Loaded secondary current reflected into primary.", "Efficiency η = Pout/Pin × 100%; VA rating limits voltage/current heating, not W alone. P = S × PF; balanced three-phase S = √3 VL IL; P = √3 VL IL cosφ.", "Dots indicate corresponding instantaneous polarity; reversing winding connections reverses relative phase. Impedance reflected by turns ratio squared: Zp/Zs = (Np/Ns)².", "Autotransformer shares winding, no galvanic isolation; Variac variable autotransformer. Current transformer steps current for measurement: never open secondary while primary energised. Star/delta connections as 3.13."], ["Transformer cannot sustain ordinary steady DC transformation.", "CT secondary must not be open circuit when primary energised.", "Turns ratio squared for impedance, inverse for current."], "Vs/Vp=Ns/Np=Ip/Is; Z ratio squared. η=Pout/Pin. Laminations eddy; soft core hysteresis. Auto no isolation; CT never open live."], ["3.16", "Filters", "449–456", ["Low-pass passes lower frequencies, attenuates higher (series L, shunt C; RC version output across C). High-pass passes higher frequencies, attenuates lower (series C, shunt L; RC output across R).", "Band-pass passes a band; band-stop/notch rejects a band. Series resonant LC low impedance, parallel LC high impedance at resonance; arrangement determines whether pass or reject.", "Cutoff frequencies define bandwidth BW = fH−fL; usual half-power point −3 dB. Q = f₀/BW for standard resonance response. Higher Q means narrower bandwidth. f₀ = 1/(2π√LC).", "Filtering selects radio frequencies, removes unwanted noise, routes audio crossover bands and helps prevent aliasing."], ["Filter response depends on where output is taken, not simply presence of L/C.", "Series resonance low impedance; parallel resonance high."], "LP passes low; HP passes high; BP passes band; BS rejects. Series LC low Z at resonance; parallel high. BW=fH−fL; Q=f₀/BW."], ["3.17", "AC generators", "458–482", ["Rotating loop in magnetic field produces sinusoidal EMF; maximum when conductors cut flux at maximum rate, zero at maximum flux linkage. One mechanical revolution equals one electrical cycle for two poles.", "Rotating armature uses slip rings to collect output; rotating field permits stationary armature output, easier insulation and high-power/current collection. Excitation may be permanent magnet or DC field.", "Single-phase one winding system; two-phase quadrature; three-phase windings/output 120° electrically apart. Star common neutral; line voltage √3 phase, line current phase. Delta closed loop; line voltage phase, line current √3 phase.", "Brushless generator commonly PMG/exciter/main generator; rotating rectifiers supply DC to main rotating field. GCU regulates excitation/output and protection; avoids main brushes and slip rings."], ["Maximum flux linkage is zero instantaneous generated EMF.", "Frequency depends on speed and pole count, not only speed."], "EMF max at fastest flux change. Rotating field/stationary output preferred high power. Star V×√3; delta I×√3. Brushless exciter + rotating rectifier."], ["3.18", "AC motors", "488–512", ["Synchronous motor rotor locks to rotating field at Ns=120f/p rpm; load angle increases with load; beyond pull-out loses synchronism. Damper winding can assist starting and reduce hunting; overexcitation can improve leading PF.", "Induction motor stator rotating field induces rotor currents; squirrel-cage bars shorted by end rings, skew reduces noise/cogging. Rotor speed below Ns in motoring; slip=(Ns−Nr)/Ns ×100%. At synchronous speed no induced torque.", "Reverse three-phase direction by swapping any two supply phases. Two-phase fields require phase-displaced supplies. Wound rotor permits external resistance for starting torque/current control.", "Single-phase induction motor is not inherently self-starting; auxiliary winding with phase shift, split-phase, capacitor-start or shaded-pole creates starting torque. The notes give centrifugal switch cut-out at 70–80% rated speed; start capacitor intermittent duty and larger than run capacitor.", "Universal/series motor can operate on AC or DC, high starting torque, speed strongly load-dependent; laminated magnetic circuit reduces eddy loss. The notes describe a current-operated starting relay (Klixon switch) as an alternative to the centrifugal switch."], ["Induction rotor never reaches synchronous speed while producing motoring torque.", "Synchronous speed uses total poles, not pole pairs when formula is 120f/p.", "Single-phase start winding/capacitor may not be continuous duty."], "Ns=120f/p; slip=(Ns−Nr)/Ns ×100%. Induction needs slip; synchronous locks speed. Swap two phases to reverse. Single-phase needs starting arrangement."]];
let revisionQuery='';
function revisionCards(day=false){const q=revisionQuery.toLowerCase().trim();const rows=REVISION_TOPICS.filter(t=>!q||t.flat(2).join(' ').toLowerCase().includes(q));return rows.map(t=>`<div class="card revision-card"><div class="mini">${safe(t[0])} · ${Object.entries(BLUEPRINT).filter(([k])=>k.replace(/[ab]$/,'')===t[0]).reduce((a,[k,v])=>a+v,0)} blueprint questions · PDF ${safe(t[2])}</div><h2>${safe(t[1])}</h2>${day?`<div class="revision-summary">${safe(t[5])}</div>`:`<ul class="revision-points">${t[3].map(p=>`<li>${safe(p)}</li>`).join('')}</ul>`}<div class="revision-traps"><b>Exam traps</b><ul>${t[4].map(p=>`<li>${safe(p)}</li>`).join('')}</ul></div>${noteButtons(t[2])}</div>`).join('')||'<div class="card">No matching topics.</div>'}
function revisionRefresh(day){$('revisionResults').innerHTML=revisionCards(day)}
function revisionPanel(day){return `<div class="card"><h2 style="margin-top:0">${day?'Exam-day checklist':'Quick reference by submodule'}</h2><p class="softnote">${day?'52 questions · 65 minutes · 39 correct to pass (75%). Read the question carefully; identify units and what stays constant; eliminate wrong answers; flag uncertain questions and return.':'A syllabus-wide revision summary, with core principles, equations and traps. Use the full source notes for detail.'}</p><input class="field" type="search" aria-label="Search revision topics" placeholder="Search a topic or formula…" value="${safe(revisionQuery)}" oninput="revisionQuery=this.value;revisionRefresh(${day})" style="width:100%"></div><div id="revisionResults">${revisionCards(day)}</div>`}

let weakSize=20;
const baseTopic=t=>String(t||'').replace(/[ab]$/,'');
function weaknessData(){
 const history=state.history.filter(h=>h.completed!==false&&Array.isArray(h.responses));
 const latest=new Map(),seen=new Set(),completedPapers=new Set(history.filter(h=>h.mode==='mock'||h.mode==='calc-exam').map(h=>h.title));
 for(const h of history)for(const r of h.responses){if(!r.id)continue;seen.add(r.id);if(!latest.has(r.id))latest.set(r.id,r)}
 const reserved=new Set(state.packs.filter(p=>(formal(p)||calculationPack(p))&&!completedPapers.has(p.title)).flatMap(p=>p.questions.map(q=>q.id)));
 const all=allQ(),pool=all.filter(q=>seen.has(q.id)||!reserved.has(q.id)),byId=new Map(all.map(q=>[q.id,q]));
 const misses=[...latest.values()].filter(r=>!r.correct),missIds=new Set(misses.map(r=>r.id)),missObjectives=new Set(misses.map(r=>r.objective||byId.get(r.id)?.objective).filter(Boolean));
 const stats=SYLLABUS.map(t=>{const rows=[...latest.values()].filter(r=>baseTopic(r.topic||byId.get(r.id)?.topic)===t[0]),attempted=rows.filter(r=>r.chosen!==null&&r.chosen!==undefined),correct=attempted.filter(r=>r.correct).length,missed=rows.filter(r=>!r.correct).length,available=pool.filter(q=>baseTopic(q.topic)===t[0]).length;return {id:t[0],name:t[1],attempted:attempted.length,correct,missed,seen:rows.length,available,accuracy:attempted.length?Math.round(100*correct/attempted.length):null}});
 const weak=stats.filter(s=>s.missed>0||(s.accuracy!==null&&s.accuracy<75)).sort((a,b)=>(a.accuracy??0)-(b.accuracy??0)||b.missed-a.missed||syllabusRank({topic:a.id})-syllabusRank({topic:b.id}));
 return {latest,seen,pool,byId,misses,missIds,missObjectives,stats,weak,reserved,completedPapers};
}
function weaknessPick(kind,limit=weakSize,topic=''){
 const d=weaknessData(),rank=new Map(d.weak.map((s,i)=>[s.id,i]));
 let candidates=d.pool.filter(q=>{const t=baseTopic(q.topic);if(kind==='missed')return d.missIds.has(q.id);if(kind==='related')return !d.seen.has(q.id)&&d.missObjectives.has(q.objective);if(kind==='topic')return t===topic;if(kind==='untested')return !d.seen.has(q.id);return d.missIds.has(q.id)||d.missObjectives.has(q.objective)||rank.has(t)});
 // Exact missed questions first; unseen related items next, then weakest topics. Never fill with unrelated questions.
 const priority=q=>d.missIds.has(q.id)?0:!d.seen.has(q.id)&&d.missObjectives.has(q.objective)?1:!d.seen.has(q.id)?2:3;
 candidates.sort((a,b)=>priority(a)-priority(b)||(rank.get(baseTopic(a.topic))??99)-(rank.get(baseTopic(b.topic))??99)||syllabusRank(a)-syllabusRank(b)||String(a.id).localeCompare(String(b.id)));
 return candidates.slice(0,limit).map(q=>q.id);
}
function startWeakness(kind,topic=''){const ids=weaknessPick(kind,weakSize,topic);if(!ids.length)return;const labels={mixed:'Targeted mixed practice',missed:'Missed-question recovery',related:'Related unseen questions',untested:'Untested questions',topic:'Topic '+topic};start('study',ids,'Weakness Trainer · '+labels[kind]);}
function weakness(){const d=weaknessData(),unresolved=d.misses.length,reviewable=d.misses.filter(r=>d.byId.has(r.id)).length,covered=d.stats.filter(s=>s.seen>0).length;const tiles=[['mixed','Targeted mixed practice','Missed answers, related objectives and weakest topics'],['missed','Retry missed questions','Questions still incorrect or unanswered on their latest attempt'],['related','Fresh related practice','Unseen questions matching missed objectives'],['untested','Untested practice','Available questions you have not seen in completed sessions']];return hdr('Weakness Trainer','Targeted revision based on your recorded answers')+`<div class="metrics"><div class="card"><div class="kicker">Unresolved misses</div><div class="metric">${unresolved}</div></div><div class="card"><div class="kicker">Weak topics</div><div class="metric">${d.weak.length}</div></div><div class="card"><div class="kicker">Topics seen</div><div class="metric">${covered}/18</div></div></div><div class="card"><h2 style="margin-top:0">Build a practice session</h2><p class="softnote">A correct answer on a later completed practice clears that question from unresolved misses. Latest answers are used once per question. Unanswered items remain unresolved, but are not included in accuracy. Unattempted official mock and calculation papers are protected from being revealed here.</p>${!d.seen.size?'<p class="softnote"><b>No completed answers yet.</b> Complete a mock or a study session to generate targeted recommendations. Untested practice can use available non-reserved questions.</p>':''}<label class="mini" for="weakSize">Maximum session size</label><select id="weakSize" class="field" onchange="weakSize=Number(this.value);render()" style="display:block;margin-top:6px;width:100%">${[10,20,30,50].map(n=>`<option value="${n}" ${n===weakSize?'selected':''}>${n} questions</option>`).join('')}</select>${tiles.map(([id,title,sub])=>{const count=weaknessPick(id,Infinity).length;return `<div class="listitem" style="flex-wrap:wrap"><div><b>${title}</b><div class="mini">${sub} · ${count} available</div></div><button class="btn secondary" ${count?'':'disabled'} onclick="startWeakness('${id}')">Practise ${Math.min(weakSize,count)}</button></div>`}).join('')}${reviewable<unresolved?`<p class="softnote">${unresolved-reviewable} missed question(s) are not in your current bank. Reimport the original pack to practise them.</p>`:''}</div><h2 class="sectiontitle">Topic priorities</h2><div class="card">${[...d.weak,...d.stats.filter(s=>!d.weak.some(w=>w.id===s.id))].map(s=>`<div class="weak-topic"><div class="weak-topic-head"><div><b>${s.id} · ${safe(s.name)}</b><div class="mini">${s.attempted} distinct answered · ${s.missed} unresolved · ${s.available} available</div></div><span class="tag ${s.seen===0?'warn':s.missed?'warn':s.accuracy>=75?'good':''}">${s.seen===0?'Untested':s.accuracy===null?'Unanswered':s.accuracy+'% latest'}</span></div>${s.accuracy!==null?`<div class="progress"><i style="width:${s.accuracy}%"></i></div>`:''}<button class="btn secondary" ${s.available?'':'disabled'} onclick="startWeakness('topic','${s.id}')" style="margin-top:10px">Practise topic</button>${s.attempted<3&&s.seen>0?'<span class="mini" style="margin-left:9px">Limited evidence</span>':''}</div>`).join('')}</div><p class="softnote">These are practice indicators, not pass predictions. Official mock and calculation exam marks are not changed; targeted sessions are saved separately as study results.</p>`}

// Idealised educational models; not engineering test procedures.
const LABS=[
{id:'ohm',title:'Ohm’s law & power',topic:'3.6 / 3.8',page:'88–91,163–167',controls:[['V','Supply voltage','V',1,60,1,28],['R','Resistance','Ω',1,100,1,14]],formula:'I = V/R · P = VI = V²/R',trap:'At fixed resistance, doubling voltage doubles current but quadruples power.'},
{id:'series',title:'Series & parallel resistors',topic:'3.7',page:'116–124',controls:[['V','Supply voltage','V',1,60,1,28],['R1','Resistor 1','Ω',1,100,1,10],['R2','Resistor 2','Ω',1,100,1,20]],formula:'Series: Rₜ = R₁ + R₂ · Parallel: Rₜ = R₁R₂/(R₁+R₂)',trap:'Series current is equal; parallel voltage is equal. Parallel total resistance is less than either branch.'},
{id:'rc',title:'Capacitor charging & discharge',topic:'3.9',page:'194–196',controls:[['V','Supply voltage','V',1,50,1,28],['R','Resistance','kΩ',1,100,1,10],['C','Capacitance','µF',10,1000,10,100],['t','Elapsed time','s',0,10,.1,1]],formula:'τ = RC · Vcharge = V(1−e⁻ᵗ/τ) · Vdischarge = Ve⁻ᵗ/τ',trap:'After one time constant, a charging capacitor reaches 63.2%; a discharging one retains 36.8%. Convert kΩ and µF to base units.'},
{id:'sine',title:'AC waveform',topic:'3.13',page:'327–338',controls:[['A','Peak voltage','V',1,200,1,115],['f','Frequency','Hz',1,400,1,50],['phase','Phase offset','°',-180,180,15,0]],formula:'v = Vpk sin(2πft + φ) · Vrms = Vpk/√2 · T = 1/f',trap:'The RMS factors here apply to a pure sine; the full-cycle average is zero.'},
{id:'rlc',title:'AC reactance & resonance',topic:'3.14 / 3.16',page:'358–390,455',controls:[['f','Frequency','Hz',10,1000,10,50],['R','Resistance','Ω',1,100,1,20],['L','Inductance','mH',10,500,10,100],['C','Capacitance','µF',1,200,1,100],['V','RMS voltage','V',1,60,1,28]],formula:'XL = 2πfL · XC = 1/(2πfC) · Z = √(R²+(XL−XC)²)',trap:'Inductor current lags; capacitor current leads. Series resonance occurs when XL = XC; Z is then R.'},
{id:'transformer',title:'Ideal transformer',topic:'3.15',page:'413–426',controls:[['V','Primary RMS voltage','V',1,250,1,115],['Np','Primary turns','turns',10,1000,10,500],['Ns','Secondary turns','turns',10,1000,10,100],['R','Secondary resistive load','Ω',10,500,10,100]],formula:'Vs/Vp = Ns/Np = Ip/Is (ideal) · Pp = Ps',trap:'Turns ratio increases voltage and decreases current, or vice versa. The transformer does not change frequency.'},
{id:'motor',title:'Induction motor speed & slip',topic:'3.18',page:'496–497',controls:[['f','Supply frequency','Hz',10,400,5,50],['p','Total poles','poles',2,12,2,4],['slip','Slip','%',0,20,.5,4]],formula:'Ns = 120f/p · Nr = Ns(1−slip/100)',trap:'Use total poles, not pole pairs. An ideal induction motor has zero induced torque at zero slip.'},
{id:'magnetic',title:'Magnetic flux & induced EMF',topic:'3.10 / 3.11',page:'239–241,267',controls:[['N','Turns','turns',10,500,10,100],['B','Flux density','T',.1,2,.1,.5],['A','Coil area','cm²',1,100,1,20],['t','Time for flux to fall to zero','ms',1,100,1,10]],formula:'Φ = BA · |Eavg| = N|ΔΦ|/Δt',trap:'Faraday’s law depends on change of linked flux, not simply the existence of a magnetic field. Lenz’s law determines polarity.'}
];
let labId='ohm',labValues={};
function labState(){const m=LABS.find(l=>l.id===labId)||LABS[0];return [m,Object.fromEntries(m.controls.map(c=>[c[0],labValues[c[0]]??c[6]]))]}
const labFmt=n=>Number(n.toPrecision(4)).toLocaleString('en-GB',{maximumFractionDigits:8});
function labCalc(id,x){let {V,R,R1,R2,C,L,f,t,A,phase,N,B,p,slip,Np,Ns}=x;switch(id){
case 'ohm':return {I:V/R,P:V*V/R};
case 'series':return {Rs:R1+R2,Rp:R1*R2/(R1+R2),Is:V/(R1+R2),Vs1:V*R1/(R1+R2),Vs2:V*R2/(R1+R2),Ip:V/R1+V/R2,I1:V/R1,I2:V/R2};
case 'rc':{let tau=R*1000*C*1e-6,ratio=Math.exp(-t/tau);return {tau,Vc:V*(1-ratio),Vd:V*ratio,I:V/(R*1000)*ratio*1000,percent:100*(1-ratio)}}
case 'sine':return {rms:A/Math.sqrt(2),pp:2*A,period:1000/f,mean:2*A/Math.PI};
case 'rlc':{let XL=2*Math.PI*f*L/1000,XC=1/(2*Math.PI*f*C*1e-6),X=XL-XC,Z=Math.hypot(R,X);return {XL,XC,X,Z,I:V/Z,phi:Math.atan2(X,R)*180/Math.PI,f0:1/(2*Math.PI*Math.sqrt(L/1000*C*1e-6)),pf:R/Z}}
case 'transformer':{let Vs=V*Ns/Np,Is=Vs/R;return {ratio:Ns/Np,Vs,Is,Ip:Is*Ns/Np,P:Vs*Is}};
case 'motor':{let Ns=120*f/p,Nr=Ns*(1-slip/100);return {Ns,Nr,diff:Ns-Nr}};
case 'magnetic':{let flux=B*A*1e-4;return {flux,E:N*flux/(t/1000)}};
}}
function labMetric(label,n,unit){return `<div class="lab-metric"><span class="mini">${label}</span><strong>${labFmt(n)} <small>${unit}</small></strong></div>`}
function labSvg(content,desc){return `<svg viewBox="0 0 560 250" role="img" aria-label="${safe(desc)}" class="lab-svg" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${content}</g></svg>`}
function labPlot(a,b,labels,desc,marker=null){let path=pts=>pts.map((p,i)=>`${i?'L':'M'}${40+p[0]*480} ${215-p[1]*180}`).join(' ');return labSvg(`<path d="M40 25V215H530" stroke="#91a0b1"/><path d="M40 125H520" stroke="#b3bdc9" stroke-dasharray="5 5"/><path d="${path(a)}" stroke="#0878f9" stroke-width="3"/>${b?`<path d="${path(b)}" stroke="#d58c12" stroke-width="3"/>`:''}${marker!==null?`<path d="M${40+marker*480} 25V215" stroke="#64748b" stroke-dasharray="4 4"/>`:''}<g fill="currentColor" stroke="none" font-size="12"><text x="45" y="20">${labels[0]}</text><text x="40" y="235">${labels[1]}</text><text x="520" y="235" text-anchor="end">${labels[2]}</text></g>`,desc)}
function labDiagram(id,x,y){
 if(id==='rc'){let end=Math.max(x.t,y.tau*5),pts=Array.from({length:101},(_,i)=>[i/100,1-Math.exp(-end*i/100/y.tau)]),down=pts.map(p=>[p[0],1-p[1]]);return labPlot(pts,down,[`${labFmt(x.V)} V`, '0 s',`${labFmt(end)} s`],'Blue charging curve, amber discharging curve',x.t/end)+`<p class="mini" style="text-align:center">Blue: charging · amber: discharging · dashed: selected time</p>`}
 if(id==='sine'){let pts=Array.from({length:161},(_,i)=>[i/160,.5+.5*Math.sin(4*Math.PI*i/160+x.phase*Math.PI/180)]);let ref=Array.from({length:161},(_,i)=>[i/160,.5+.5*Math.sin(4*Math.PI*i/160)]);return labPlot(pts,ref,[`+${x.A} V`, '0 ms',`${labFmt(y.period*2)} ms`],'Blue phase shifted sine; amber reference sine')+`<p class="mini" style="text-align:center">Blue: selected waveform · amber: zero-phase reference; midline = 0 V</p>`}
 if(id==='rlc'){let scale=100/Math.max(x.R,Math.abs(y.X),1),xx=200+x.R*scale,yy=125-y.X*scale;return labSvg(`<path d="M200 125H${xx}" stroke="#0878f9"/><path d="M${xx} 125V${yy}" stroke="#d58c12"/><path d="M200 125L${xx} ${yy}" stroke="#16835a" stroke-width="4"/><g fill="currentColor" stroke="none" font-size="13"><text x="205" y="145">R</text><text x="${xx+8}" y="${(125+yy)/2}">X</text><text x="${(200+xx)/2-10}" y="${(125+yy)/2-8}">Z</text><text x="15" y="25">Impedance triangle · ${y.X>=0?'inductive':'capacitive'}</text></g>`,'Resistance, net reactance and impedance triangle')}
 if(id==='transformer'){return labSvg(`<path d="M55 45H165M55 205H165M395 45H505M395 205H505"/><path d="M254 35V215M274 35V215" stroke-width="8" stroke="#91a0b1"/>${[0,1,2,3,4].map(i=>`<path d="M165 ${45+i*32}q70 16 0 32M395 ${45+i*32}q-70 16 0 32" stroke="#0878f9"/>`).join('')}<g fill="currentColor" stroke="none" font-size="14"><text x="55" y="27">Primary ${x.Np} turns</text><text x="365" y="27">Secondary ${x.Ns} turns</text><text x="55" y="235">${labFmt(x.V)} V</text><text x="395" y="235">${labFmt(y.Vs)} V</text></g>`,'Ideal transformer primary and secondary winding schematic')}
 if(id==='motor'){return labSvg(`<circle cx="280" cy="125" r="85" stroke="#91a0b1" stroke-width="9"/><circle cx="280" cy="125" r="48" stroke="#0878f9" stroke-width="5"/>${Array.from({length:x.p},(_,i)=>{let a=i*2*Math.PI/x.p;return `<circle cx="${280+85*Math.cos(a)}" cy="${125+85*Math.sin(a)}" r="8" fill="${i%2?'#d58c12':'#0878f9'}" stroke="none"/>`}).join('')}<g fill="currentColor" stroke="none" font-size="14"><text x="280" y="121" text-anchor="middle">Rotor</text><text x="280" y="142" text-anchor="middle">${labFmt(y.Nr)} rpm</text><text x="392" y="85">Field</text><text x="392" y="106">${labFmt(y.Ns)} rpm</text></g>`,'Schematic stator poles and rotor speed')}
 if(id==='magnetic'){return labSvg(`<rect x="30" y="55" width="70" height="140" rx="10" fill="#0878f9"/><rect x="460" y="55" width="70" height="140" rx="10" fill="#d58c12"/>${[80,105,130,155,180].map(v=>`<path d="M110 ${v}H450m-9 -5 9 5 -9 5" stroke="#91a0b1"/>`).join('')}<rect x="218" y="55" width="124" height="140" rx="10" stroke="#16835a" stroke-width="5"/><g fill="currentColor" stroke="none" font-size="14"><text x="65" y="130" text-anchor="middle" fill="white">N</text><text x="495" y="130" text-anchor="middle" fill="white">S</text><text x="280" y="25" text-anchor="middle">${x.N} turns · ${x.B} T</text><text x="280" y="235" text-anchor="middle">Flux changes to zero in ${x.t} ms</text></g>`,'Coil within magnetic field with changing flux')}
 let series=id==='series';return labSvg(`<path d="M90 75H${series?180:220}M${series?440:340} 75H470V200H90V145M90 115V75"/><path d="M70 115H110M80 145H100" stroke-width="4"/><path d="M${series?180:220} 75${series?'l10 -12 15 24 15 -24 15 24 10 -12H320l10 -12 15 24 15 -24 15 24 10 -12H440':'l10 -12 20 24 20 -24 20 24 20 -24 20 12H340'}" stroke="#0878f9"/><g fill="currentColor" stroke="none" font-size="14"><text x="55" y="105">+</text><text x="30" y="138">${x.V} V</text><text x="200" y="45">${series?x.R1+' Ω':x.R+' Ω'}</text>${series?`<text x="340" y="45">${x.R2} Ω</text>`:''}<text x="270" y="230" text-anchor="middle">${labFmt(series?y.Is:y.I)} A · ${series?'series schematic':'DC current'}</text></g>`,series?'Series circuit schematic; parallel equivalent calculated separately':'DC source and resistor circuit');
}
function labResults(){let [m,x]=labState(),y=labCalc(m.id,x),metrics=[],explain='';let add=(l,k,u)=>metrics.push(labMetric(l,y[k],u));switch(m.id){case 'ohm':add('Current','I','A');add('Power','P','W');explain=`${x.V} ÷ ${x.R} = ${labFmt(y.I)} A. The resistor dissipates ${labFmt(y.P)} W.`;break;case 'series':add('Series total R','Rs','Ω');add('Parallel total R','Rp','Ω');add('Series current','Is','A');add('Parallel total current','Ip','A');add('Series V₁','Vs1','V');add('Series V₂','Vs2','V');add('Parallel I₁','I1','A');add('Parallel I₂','I2','A');explain='The diagram shows the series circuit. In parallel both resistors have the full supply voltage; branch currents add.';break;case 'rc':add('Time constant','tau','s');add('Charging voltage','Vc','V');add('Discharging voltage','Vd','V');add('Charge current','I','mA');explain=`At ${x.t} s, the capacitor is ${labFmt(y.percent)}% of its final charging voltage.`;break;case 'sine':add('RMS','rms','V');add('Peak-to-peak','pp','V');add('Period','period','ms');add('Half-cycle mean magnitude','mean','V');explain='Phase shift changes timing; frequency changes period; peak determines amplitude and RMS.';break;case 'rlc':add('Inductive XL','XL','Ω');add('Capacitive XC','XC','Ω');add('Impedance','Z','Ω');add('Current','I','A');add('Phase angle','phi','°');add('Resonance frequency','f0','Hz');add('Power factor','pf','');explain=y.X>0?'Net inductive: current lags voltage.':y.X<0?'Net capacitive: current leads voltage.':'Series resonance: voltage and current in phase.';break;case 'transformer':add('Turns ratio Ns/Np','ratio','');add('Secondary voltage','Vs','V');add('Secondary current','Is','A');add('Primary current','Ip','A');add('Ideal power (each side)','P','W');explain=y.ratio>1?'Step-up: voltage rises, current falls.':y.ratio<1?'Step-down: voltage falls, current rises.':'1:1 transformer: equal voltages.';break;case 'motor':add('Synchronous speed','Ns','rpm');add('Rotor speed','Nr','rpm');add('Slip speed','diff','rpm');explain='Rotor speed falls below synchronous speed by the selected slip percentage.';break;case 'magnetic':add('Flux per turn','flux','Wb');add('Average EMF magnitude','E','V');explain='Assumes uniform perpendicular flux and a linear reduction to zero, with all turns fully linked.';break}return `<div class="lab-metrics">${metrics.join('')}</div><div class="lab-diagram">${labDiagram(m.id,x,y)}</div><div class="explain"><b>What is happening?</b><p>${safe(explain)}</p></div>`}
function labSet(k,v){labValues[k]=Number(v);let [m,x]=labState();$('labValue-'+k).textContent=labFmt(x[k])+' '+m.controls.find(c=>c[0]===k)[2];$('labResults').innerHTML=labResults()}
function labSelect(id){labId=id;labValues={};render()}
function lab(){let [m,x]=labState();return hdr('Electrical Lab','Interactive offline models · change a value and see the result')+`<div class="card"><label class="mini" for="labSelect">Choose a simulation</label><select id="labSelect" class="field" style="display:block;width:100%;margin-top:5px" onchange="labSelect(this.value)">${LABS.map(l=>`<option value="${l.id}" ${l.id===m.id?'selected':''}>${l.topic} · ${safe(l.title)}</option>`).join('')}</select></div><div class="lab-grid"><div class="card"><h2 style="margin-top:0">${safe(m.title)}</h2><p class="formula">${safe(m.formula)}</p>${m.controls.map(c=>`<label class="lab-control"><span><b>${safe(c[1])}</b><strong id="labValue-${c[0]}">${labFmt(x[c[0]])} ${safe(c[2])}</strong></span><input type="range" min="${c[3]}" max="${c[4]}" step="${c[5]}" value="${x[c[0]]}" oninput="labSet('${c[0]}',this.value)"></label>`).join('')}<button class="btn secondary" onclick="labSelect('${m.id}')">Reset values</button><div class="revision-traps"><b>Exam trap</b><p>${safe(m.trap)}</p></div>${noteButtons(m.page)}</div><div class="card" id="labResults">${labResults()}</div></div><p class="softnote">Idealised learning simulations, not a substitute for aircraft maintenance data or electrical test procedures.</p>`}

window.addEventListener('resize',()=>{if(view==='notes')refreshNotes();if(view==='tutor')renderTutorSource()});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline cache registration failed:',e)))}
