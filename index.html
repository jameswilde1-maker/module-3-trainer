epeat(2,1fr);gap:10px}.metrics .card:last-child{grid-column:1/-1}.card{padding:19px;border-radius:17px}.actions,.split{grid-template-columns:1fr}.action{min-height:78px}.heading{font-size:30px}.footerbar{display:flex;position:fixed;bottom:0;left:0;right:0;padding:7px 10px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);justify-content:space-around;z-index:30}.footbtn{background:none;border:0;color:var(--muted);display:grid;gap:4px;justify-items:center;font-size:10px}.footbtn.active{color:var(--blue)}.footbtn span{font-size:20px}.qhead{font-size:12px}.question{font-size:21px}.answer{padding:15px}.topbar .pill{font-size:10px}}

'use strict';
// All navigation icons are locally embedded SVG: no CDN or Wi-Fi needed.
const ICON_PATHS={
 home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',

 calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M7 6h10v4H7zM8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',

};
function uiIcon(id,cls=''){return `<svg class="ui-icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICON_PATHS[id]||ICON_PATHS.home}</svg>`;}
const ITEMS=[['home','Home'],['exams','Mock Exams'],['calc','Calculations'],['study','Study'],['progress','Progress'],['guides','Guides'],['settings','Settings']];
const DEMO=[
{id:'D001',topic:'3.1',objective:'3.1-ions',level:1,type:'definition',source:'Module 3 notes',page:'3–4',q:'An atom becomes a positive ion when it:',options:['Gains one or more electrons.','Loses one or more electrons.','Gains one or more protons.'],answer:1,explanation:'A positive ion forms when an atom loses one or more electrons, leaving more protons than electrons.'},
{id:'D002',topic:'3.3',objective:'3.3-emf',level:1,type:'definition',source:'Module 3 notes',page:'31–33',q:'What is electromotive force (EMF)?',options:['The opposition to electric current in a conductor.','The energy transferred by a source per unit charge.','The rate of flow of electric charge.'],answer:1,explanation:'EMF is energy supplied per unit charge and is expressed in volts.'},
{id:'D003',topic:'3.3',objective:'3.3-conductance',level:1,type:'definition',source:'Module 3 notes',page:'40',q:'What is electrical conductance?',options:['The reciprocal of electrical resistance.','The resistance of a material per metre.','The current delivered per unit voltage squared.'],answer:0,explanation:'Conductance G is the reciprocal of resistance, G = 1/R; the unit is the siemens.'},
{id:'D004',topic:'3.5',objective:'3.5-internal-resistance',level:2,type:'scenario',source:'Module 3 notes',page:'70–73',q:'A battery with internal resistance supplies current to a connected load. Assuming its EMF and internal resistance are constant, what happens to its terminal voltage as load current increases?',options:['It increases because the load draws more power.','It remains equal to the open-circuit EMF.','It decreases because the voltage drop across the internal resistance increases.'],answer:2,explanation:'Terminal voltage = EMF − current × internal resistance. Increasing current reduces the terminal voltage.'},
{id:'D005',topic:'3.6',objective:'3.6-kcl',level:2,type:'definition',source:'Module 3 notes',page:'88–89',q:'Kirchhoff’s Current Law states that:',options:['The sum of currents entering a junction equals the sum leaving it.','The current is identical in all parallel branches.','The total voltage around a closed loop is equal to the supply current.'],answer:0,explanation:'Conservation of charge requires the current entering a junction to equal the current leaving it.'},
{id:'D006',topic:'3.7',objective:'3.7-resistivity',level:2,type:'scenario',source:'Module 3 notes',page:'101–106',q:'Two conductors are made from the same metal and kept at the same temperature. One is twice as long and has twice the cross-sectional area of the other. How do their resistances compare?',options:['The longer conductor has double the resistance.','Both conductors have the same resistance.','The longer conductor has half the resistance.'],answer:1,explanation:'R = ρL/A; doubling both length and cross-sectional area leaves resistance unchanged.'},
{id:'D007',topic:'3.7',objective:'3.7-rheostat',level:1,type:'definition',source:'Module 3 notes',page:'127–131',q:'What is a rheostat?',options:['A three-terminal voltage divider only.','A resistor whose resistance depends on temperature.','A two-terminal variable resistor used to control current.'],answer:2,explanation:'The rheostat is a two-terminal variable resistor commonly used for current control.'},
{id:'D008',topic:'3.7',objective:'3.7-ntc',level:2,type:'definition',source:'Module 3 notes',page:'141–144',q:'What happens to the resistance of an NTC thermistor when its temperature increases?',options:['Resistance decreases.','Resistance increases.','Resistance remains constant.'],answer:0,explanation:'Negative temperature coefficient means resistance decreases as temperature rises.'},
{id:'D009',topic:'3.5',objective:'3.5-cell-series',level:2,type:'technical',source:'Module 3 notes',page:'66–68',q:'When identical cells are connected in series, which quantity increases?',options:['Their total EMF.','The current rating of each individual cell.','The number of parallel current paths.'],answer:0,explanation:'Series connection adds cell voltages; it also adds internal resistances.'},
{id:'D010',topic:'3.6',objective:'3.6-ohm',level:2,type:'calculation',source:'Module 3 notes',page:'88, 91',q:'A 24 V supply is connected across a 6 Ω resistor. What current flows through the resistor?',options:['0.25 A','4 A','144 A'],answer:1,explanation:'Ohm’s Law: I = V/R = 24/6 = 4 A.',working:'I = V/R = 24 V ÷ 6 Ω = 4 A'},
{id:'D011',topic:'3.5',objective:'3.5-battery-internal',level:2,type:'calculation',source:'Module 3 notes',page:'70–73',q:'A battery has an EMF of 28 V and an internal resistance of 0.5 Ω. What is its terminal voltage when delivering 8 A?',options:['24 V','28 V','32 V'],answer:0,explanation:'Vt = E − Ir = 28 − (8 × 0.5) = 24 V.',working:'Vt = E − Ir = 28 V − (8 A × 0.5 Ω) = 24 V'},
{id:'D012',topic:'3.7',objective:'3.7-parallel',level:2,type:'calculation',source:'Module 3 notes',page:'118–125',q:'Two resistors of 6 Ω and 3 Ω are connected in parallel. What is their combined resistance?',options:['9 Ω','4.5 Ω','2 Ω'],answer:2,explanation:'1/R = 1/6 + 1/3 = 1/2, so R = 2 Ω.',working:'1/R = 1/6 + 1/3 = 3/6 → R = 2 Ω'}
];
const SYLLABUS=[['3.1','Electron Theory',2,4],['3.2','Static Electricity and Conduction',2,4],['3.3','Electrical Terminology',2,4],['3.4','Generation of Electricity',1,3],['3.5','DC Sources of Electricity',2,4],['3.6','DC Circuits',2,3],['3.7','Resistance',2,2],['3.8','Power',1,2],['3.9','Capacitance',2,4],['3.10','Magnetism',2,4],['3.11','Inductance',2,3],['3.12','DC Motor / Generator Theory',2,3],['3.13','AC Theory',2,4],['3.14','Resistive, Capacitive and Inductive Circuits',2,4],['3.15','Transformers',2,3],['3.16','Filters',2,2],['3.17','AC Generators',2,3],['3.18','AC Motors',2,3]];
const STORAGE='m3trainer.v01';let state;try{state=JSON.parse(localStorage.getItem(STORAGE))||{}}catch{state={}};
state={history:[],packs:[],bookmarks:[],theme:'light',...state};let timerHandle=null;let view='home',session=null,studyFilter='all',guideTab='formulas',fileInput;
const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){alert('Storage unavailable. Export a backup to protect your data.')}};
const calculationPack=p=>p.kind==='calculation-pack'&&p.qaApproved===true;
const formal=p=>p.kind==='full-mock'||(!p.kind&&p.questions.length===52&&/mock exam/i.test(p.title));
const allQ=()=>{const map=new Map(DEMO.map(q=>[q.id,q]));for(const p of state.packs.filter(p=>!formal(p)))for(const q of p.questions)if(!map.has(q.id))map.set(q.id,{...q,topic:q.topic.replace(/[ab]$/,'')});for(const p of state.packs.filter(p=>formal(p)&&p.qaApproved))for(const q of p.questions)map.set(q.id,q);return [...map.values()]};
const sessionQ=()=>session.questions;const topics=()=>new Map(SYLLABUS.map(a=>[a[0],a[1]]));
function nav(id){clearInterval(timerHandle);timerHandle=null;view=id;session=null;render();scrollTo(0,0)}
function render(){document.documentElement.classList.toggle('dark',state.theme==='dark');$('sideNav').innerHTML=ITEMS.map(([id,label])=>`<button class="navbtn ${view===id?'active':''}" aria-label="${label}" title="${label}" ${view===id?'aria-current="page"':''} onclick="nav('${id}')"><span class="ico">${uiIcon(id)}</span><span class="navlabel">${label}</span></button>`).join('');$('bottomNav').innerHTML=ITEMS.filter(x=>['home','exams','calc','study','progress'].includes(x[0])).map(([id,label])=>`<button class="footbtn ${view===id?'active':''}" aria-label="${label}" ${view===id?'aria-current="page"':''} onclick="nav('${id}')"><span>${uiIcon(id)}</span>${label.replace('Mock ','')}</button>`).join('');$('main').innerHTML=({home,exams,calc,study,progress,guides,settings})[view]();}
const hdr=(title,sub)=>`<div class="topbar"><div><div class="eyebrow">Module 03 · B2</div><h1 class="heading">${title}</h1><p class="subtitle">${sub}</p></div><span class="pill">● Offline ready</span></div>`;
const percentages=()=>{let h=state.history.filter(x=>x.mode==='mock'&&x.completed);return h.length?Math.round(h.reduce((a,b)=>a+b.score,0)/h.length):null};
function home(){let avg=percentages(),tested=new Set(state.history.flatMap(h=>h.responses.filter(r=>r.chosen!==null).map(r=>r.objective)));let obj=new Set(allQ().map(q=>q.objective));let cov=obj.size?Math.round(tested.size/obj.size*100):0;return hdr('Electrical Fundamentals','Your offline examination and revision workspace')+`<div class="metrics"><div class="card"><div class="kicker">Mock average</div><div class="metric">${avg??'—'}${avg===null?'':'%'}</div><span class="mini">${avg===null?'No full mocks completed':'Completed mock results'}</span></div><div class="card"><div class="kicker">Loaded-bank coverage</div><div class="metric">${cov}%</div><div class="progress"><i style="width:${cov}%"></i></div></div><div class="card"><div class="kicker">Sessions completed</div><div class="metric">${state.history.length}</div><span class="mini">Across all practice modes</span></div></div><h2 class="sectiontitle">Continue learning</h2><div class="actions">${[['exams','exams','Mock Exams','Exam-style papers and results'],['calc','calc','Calculations','Dedicated numerical questions'],['study','study','Study Mode','Immediate explanations and feedback'],['guides','guides','Revision Guides','Formula and exam-day sheets'],['progress','progress','Progress','Scores, errors and topic coverage'],['settings','settings','Question Packs','Import new QA-approved exams']].map(([id,ico,a,b])=>`<button class="action" onclick="nav('${id}')"><span class="actionicon">${uiIcon(ico)}</span><span><strong>${a}</strong><small>${b}</small></span><span style="margin-left:auto;color:#8da1ba">›</span></button>`).join('')}</div><h2 class="sectiontitle">About this prototype</h2><div class="card softnote">The built-in ${DEMO.length} questions are <b>demonstration practice only</b>, based on selected pages of your Resource Group notes. They are not full QA-approved mock exams or a complete syllabus bank. The percentage above tracks the objectives currently loaded, not the entire 500-page syllabus. Import approved packs as we build them.</div>`}
function exams(){const papers=state.packs.map((p,i)=>({p,i})).filter(({p})=>formal(p)&&p.qaApproved);return hdr('Mock Exams','Full papers, source-backed practice and results')+`<div class="card"><h2 style="margin:0 0 9px">Demonstration paper</h2><p class="softnote">${DEMO.length} questions · untimed · for interface testing only.</p><button class="btn" onclick="start('mock',DEMO.map(q=>q.id),'Demonstration Mock')">Start demo paper</button></div><h2 class="sectiontitle">Approved full mock exams</h2><div class="card">${papers.length?papers.map(({p,i})=>`<div class="listitem"><div><b>${safe(p.title)}</b><div class="mini">52 questions · 65 minutes · 75% pass mark</div></div><button class="btn secondary" onclick="startPack(${i})">Start</button></div>`).join(''):'<p class="softnote">No approved full mocks installed. Topic packs remain available in Study Mode and Calculations.</p>'}</div><h2 class="sectiontitle">Recent mock results</h2><div class="card">${state.history.filter(h=>h.mode==='mock').slice(0,5).map(h=>`<div class="listitem"><div><b>${safe(h.title)}</b><div class="mini">${safe(h.date)} · ${h.count} questions</div></div><b>${h.score}%</b></div>`).join('')||'<div class="empty">No exams completed yet.</div>'}</div>`}
function calc(){let ids=allQ().filter(q=>q.type==='calculation').map(q=>q.id);let papers=state.packs.map((p,i)=>({p,i})).filter(({p})=>calculationPack(p));return hdr('Calculations','Formula practice and dedicated calculation papers')+`<div class="card"><div class="kicker">Available calculation questions</div><div class="metric">${ids.length}</div><div class="btnrow"><button class="btn" ${ids.length?'':'disabled'} onclick="start('study',${JSON.stringify(ids).replaceAll('"','&quot;')},'Calculation Practice')">Mixed practice</button><button class="btn secondary" onclick="nav('guides');guideTab='formulas';render()">Formula sheet</button></div></div><h2 class="sectiontitle">Calculation papers</h2><div class="card">${papers.length?papers.map(({p,i})=>`<div class="listitem" style="flex-wrap:wrap;gap:12px"><div><b>${safe(p.title)}</b><div class="mini">${p.questions.length} questions · ${p.durationMinutes??p.questions.length*1.25} minutes · 75% target</div></div><div class="btnrow"><button class="btn secondary" onclick="startCalcPack(${i},true)">Practice</button><button class="btn" onclick="startCalcPack(${i},false)">Exam</button></div></div>`).join(''):'<p class="softnote">Import a calculation paper through Settings.</p>'}</div><h2 class="sectiontitle">Formula example</h2><div class="sheet"><div class="formula">V = I × R</div>Voltage = current × resistance.<br><b>Example:</b> 24 V across 6 Ω gives I = 4 A.</div>`}
function startCalcPack(i,practice){const p=state.packs[i];if(!p||!calculationPack(p))return;start(practice?'study':'calc-exam',p.questions.map(q=>q.id),p.title,p)}
function study(){let opts=`<select class="field" onchange="studyFilter=this.value;render()"><option value="all">All topics</option>${SYLLABUS.map(t=>`<option value="${t[0]}" ${studyFilter===t[0]?'selected':''}>${t[0]} ${t[1]}</option>`).join('')}</select>`;let ids=allQ().filter(q=>studyFilter==='all'||q.topic===studyFilter).map(q=>q.id);let wrong=state.history.flatMap(h=>h.responses.filter(r=>r.chosen!==null&&!r.correct).map(r=>r.id));return hdr('Study Mode','Practise by topic or revisit incorrect answers')+`<div class="card"><div class="kicker">Choose a topic</div><div style="margin:13px 0">${opts}</div><p class="softnote">${ids.length} question(s) available for this selection. Feedback appears immediately after each answer.</p><div class="btnrow"><button class="btn" ${ids.length?'':'disabled'} onclick="start('study',${JSON.stringify(ids).replaceAll('"','&quot;')},'Study Practice')">Study these questions</button><button class="btn secondary" ${wrong.length?'':'disabled'} onclick="start('study',${JSON.stringify([...new Set(wrong)]).replaceAll('"','&quot;')},'Wrong-Answer Review')">Review wrong answers (${new Set(wrong).size})</button></div></div><h2 class="sectiontitle">Source coverage</h2><div class="card softnote">Topic selection uses the downloaded question packs. A topic with no questions is not yet covered. Our master syllabus matrix and validated full bank will be added in later builds.</div>`}
function start(mode,ids,title,pack=null){const pool=pack?pack.questions:allQ();const map=new Map(pool.map(q=>[q.id,q]));const unique=[...new Set(ids)].filter(id=>map.has(id));if(!unique.length)return;clearInterval(timerHandle);const started=Date.now();session={mode,ids:unique,questions:unique.map(id=>map.get(id)),title,i:0,answers:{},revealed:{},started,deadline:pack&&mode!=='study'?started+(formal(pack)?65:(pack.durationMinutes??pack.questions.length*1.25))*60000:null,passTarget:pack?(formal(pack)?39:Math.ceil(pack.questions.length*0.75)):null};view='runner';renderRunner();if(session.deadline)timerHandle=setInterval(updateTimer,1000);scrollTo(0,0)}
function startPack(i){const p=state.packs[i];if(!p||!formal(p)||!p.qaApproved)return;start('mock',p.questions.map(q=>q.id),p.title,p)}
function updateTimer(){if(!session||!session.deadline)return;const seconds=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));const el=$('examTimer');if(el)el.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;if(seconds===0)finish(true)}
function renderRunner(){const q=sessionQ().find(x=>x.id===session.ids[session.i]),i=session.i,picked=session.answers[q.id],show=session.mode==='study'&&session.revealed[q.id];document.querySelectorAll('.navbtn,.footbtn').forEach(x=>x.classList.remove('active'));$('main').innerHTML=`<div class="qbox"><div class="topbar"><button class="btn ghost" onclick="if(confirm('Leave this session? Unsaved answers will be lost.'))nav('exams')">‹ Exit</button><span class="tag">${session.mode==='study'?'Study mode':'Exam mode'}</span>${session.deadline?`<span class="tag" id="examTimer">${Math.floor(Math.max(0,Math.ceil((session.deadline-Date.now())/1000))/60)}:${String(Math.max(0,Math.ceil((session.deadline-Date.now())/1000))%60).padStart(2,'0')}</span>`:''}</div><div class="card" style="margin-top:15px"><div class="qhead"><span>Question ${i+1} of ${session.ids.length}</span><span>${safe(session.title)}</span></div><div class="progress"><i style="width:${(i+1)/session.ids.length*100}%"></i></div><p class="question">${safe(q.q)}</p>${q.options.map((option,j)=>`<button class="answer ${picked===j?'selected':''} ${show&&j===q.answer?'correct':''} ${show&&picked===j&&picked!==q.answer?'wrong':''}" ${show?'disabled':''} onclick="choose(${j})"><span class="letter">${'ABC'[j]}</span><span>${safe(option)}</span></button>`).join('')}${show?`<div class="explain"><b>${picked===q.answer?'Correct':'Incorrect — answer '+ 'ABC'[q.answer]}</b><br>${safe(q.explanation)}${q.working?`<p><b>Working:</b> ${safe(q.working)}</p>`:''}<div class="meta">${safe(q.source)} · pages ${safe(q.page)} · Level ${q.level}</div></div>`:''}<div class="btnrow" style="justify-content:space-between;margin-top:26px"><button class="btn secondary" ${i===0?'disabled':''} onclick="move(-1)">‹ Previous</button>${session.mode==='study'&&!show?`<button class="btn secondary" ${picked===undefined?'disabled':''} onclick="reveal()">Check answer</button>`:''}${i===session.ids.length-1?`<button class="btn" onclick="finish()">Finish & mark</button>`:`<button class="btn" onclick="move(1)">Next ›</button>`}</div></div><p class="softnote" style="text-align:center">${session.mode!=='study'?'Answers are revealed only after submitting the paper.':'Check each answer to see its explanation.'}</p></div>`}
function choose(j){let q=sessionQ().find(x=>x.id===session.ids[session.i]);session.answers[q.id]=j;renderRunner()}function reveal(){let q=sessionQ().find(x=>x.id===session.ids[session.i]);if(session.answers[q.id]===undefined)return;session.revealed[q.id]=true;renderRunner()}function move(n){session.i=Math.max(0,Math.min(session.ids.length-1,session.i+n));renderRunner();scrollTo(0,0)}
function finish(timedOut=false){if(!session)return;let missing=session.ids.filter(id=>session.answers[id]===undefined).length;if(missing&&!timedOut&&!confirm(`${missing} question(s) unanswered. Submit anyway?`))return;clearInterval(timerHandle);timerHandle=null;let qmap=new Map(sessionQ().map(q=>[q.id,q]));let responses=session.ids.map(id=>{let q=qmap.get(id),chosen=session.answers[id];return{id,objective:q.objective,topic:q.topic,chosen:chosen===undefined?null:chosen,correct:chosen===q.answer,expected:q.answer,chosenText:chosen===undefined?null:q.options[chosen],correctText:q.options[q.answer]}});let score=Math.round(responses.filter(x=>x.correct).length/responses.length*100);let record={id:'R'+Date.now(),title:session.title,mode:session.mode,count:responses.length,score,date:new Date().toLocaleDateString('en-GB'),completed:true,responses,elapsedSeconds:Math.round((Date.now()-session.started)/1000),timedOut,pass:session.deadline?responses.filter(x=>x.correct).length>=session.passTarget:null};state.history.unshift(record);save();session=null;view='result';$('main').innerHTML=hdr('Results',record.title)+`<div class="card"><div class="kicker">Your score</div><div class="metric">${score}%</div>${record.pass===null?'':`<span class="tag ${record.pass?'good':'warn'}">${record.pass?'PASS':'NOT PASSED'}</span>`}<p>${responses.filter(x=>x.correct).length} of ${record.count} correct</p><div class="btnrow"><button class="btn" onclick="nav('exams')">Back to exams</button><button class="btn secondary" onclick="nav('progress')">See progress</button></div></div><h2 class="sectiontitle">Answer review</h2>${responses.map((r,i)=>{let q=qmap.get(r.id);return `<div class="card" style="margin-bottom:12px"><div class="meta">Question ${i+1} · ${safe(q.topic)} · pages ${safe(q.page)}</div><p><b>${safe(q.q)}</b></p><p class="softnote">Your answer: ${r.chosen===null?'Not answered':safe(q.options[r.chosen])}<br><b>Correct: ${safe(q.options[q.answer])}</b></p><div class="explain">${safe(q.explanation)}${q.working?`<br><b>Working:</b> ${safe(q.working)}`:''}</div></div>`}).join('')}`;scrollTo(0,0)}
function progress(){let h=state.history,wrong=h.flatMap(x=>x.responses.filter(r=>r.chosen!==null&&!r.correct));let attempts=h.flatMap(x=>x.responses);let pct=attempts.length?Math.round(attempts.filter(r=>r.correct).length/attempts.length*100):null;return hdr('Progress','Your study history and syllabus coverage')+`<div class="metrics"><div class="card"><div class="kicker">Questions attempted</div><div class="metric">${attempts.length}</div></div><div class="card"><div class="kicker">Answer accuracy</div><div class="metric">${pct===null?'—':pct+'%'}</div></div><div class="card"><div class="kicker">Incorrect responses</div><div class="metric">${wrong.length}</div></div></div><h2 class="sectiontitle">Topic tracking</h2><div class="card">${SYLLABUS.map(t=>{let a=attempts.filter(r=>r.topic===t[0]),n=allQ().filter(q=>q.topic===t[0]).length,rate=a.length?Math.round(a.filter(r=>r.correct).length/a.length*100):null;return`<div class="listitem"><div><b>${t[0]} · ${t[1]}</b><div class="mini">${t[0]==='3.7'?'Levels 1/2':'Level '+(['3.1','3.4','3.16'].includes(t[0])?1:2)} · ${Object.entries(BLUEPRINT).filter(([k])=>k.replace(/[ab]$/,'')===t[0]).reduce((a,[k,v])=>a+v,0)} questions in supplied B2 template · ${n} loaded practice items</div></div><span class="tag ${rate===null?'warn':rate>=80?'good':''}">${rate===null?'Not tested':rate+'% accuracy'}</span></div>`}).join('')}</div><h2 class="sectiontitle">Previous sessions</h2><div class="card">${h.length?h.map(x=>`<div class="listitem"><div><b>${safe(x.title)}</b><div class="mini">${safe(x.date)} · ${x.count} questions</div></div><b>${x.score}%</b></div>`).join(''):'<div class="empty">Your results will appear here after completing a session.</div>'}</div>`}
function guides(){let tabs=[['formulas','Formula Sheet'],['examday','Exam-Day Sheet'],['topics','Topic Overview']];return hdr('Revision Guides','Offline reference sheets and exam preparation')+`<div class="btnrow" style="margin-bottom:20px">${tabs.map(t=>`<button class="btn ${guideTab===t[0]?'':'secondary'}" onclick="guideTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${guideTab==='formulas'?`<div class="sheet"><h2>Essential DC formulas</h2><div class="formula">V = I × R</div>Ohm's Law: voltage (V), current (A), resistance (Ω).<div class="formula">P = V × I</div>Electrical power in watts.<div class="formula">Q = I × t</div>Charge in coulombs; time in seconds.<div class="formula">G = 1 / R</div>Conductance in siemens.<div class="formula">R = ρL / A</div>Resistivity, length and cross-sectional area.<div class="formula">V<sub>t</sub> = E − I r</div>Terminal voltage considering internal resistance.<p class="softnote">Core relationships from Resource Group notes, pages 31–41, 70–73, 88–106. This is an initial short sheet, not the complete Module 3 formula library.</p></div>`:guideTab==='examday'?`<div class="sheet"><h2>Quick revision checklist</h2><p>□ Conventional current direction vs electron flow<br>□ Current, voltage, resistance, conductance and power units<br>□ Series versus parallel rules<br>□ Kirchhoff's Current and Voltage Laws<br>□ Batteries: EMF, terminal voltage and internal resistance<br>□ NTC versus PTC characteristics<br>□ Ohm's Law and formula rearrangement<br>□ Keep units consistent before calculating</p><p class="softnote">Initial demonstration sheet. The full day-of-exam pack will be authored and QA-checked against the complete notes.</p></div>`:`<div class="sheet"><h2>B2 Module 3 syllabus</h2>${SYLLABUS.map(t=>`<div class="listitem"><span>${t[0]} · ${t[1]}</span><span class="tag">Level ${t[2]}</span></div>`).join('')}<p class="softnote">Topic grouping and levels transcribed from the supplied Resource Group examination breakdown, page 8. The complete objective-level matrix is still to be built.</p></div>`}<button class="btn secondary" onclick="print()">Print this guide</button>`}
const normalized=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const BLUEPRINT={'3.1':2,'3.2':2,'3.3':4,'3.4':4,'3.5':4,'3.6':3,'3.7a':2,'3.7b':2,'3.8':2,'3.9':2,'3.10a':2,'3.10b':2,'3.11':3,'3.12':2,'3.13':4,'3.14':2,'3.15':2,'3.16':2,'3.17':3,'3.18':3};
function checkPack(pack){const errors=[],incoming=pack?.questions;if(!Array.isArray(incoming)||!incoming.length)return ['Missing questions array.'];const full=pack.kind==='full-mock';const calcPaper=pack.kind==='calculation-pack';if(calcPaper&&(pack.qaApproved!==true||!Number.isFinite(pack.durationMinutes)||pack.durationMinutes<=0||pack.passMarkPercent!==75||pack.passMarkQuestions!==Math.ceil(incoming.length*.75)))errors.push('Invalid calculation paper metadata.');if(typeof pack.title!=='string'||!pack.title.trim())errors.push('Missing pack title.');if(full&&pack.qaApproved!==true)errors.push('Full mock is not QA-approved. Drafts cannot be imported.');if(full&&incoming.length!==52)errors.push('Full mock must have exactly 52 questions.');if(state.packs.some(p=>p.title===pack.title))errors.push('A pack with this title is already installed.');const bank=allQ(),oldIds=new Map(bank.map(q=>[q.id,q])),oldStems=new Map(bank.map(q=>[normalized(q.q),q.id])),mockIds=new Set(state.packs.filter(formal).flatMap(p=>p.questions.map(q=>q.id))),mockStems=new Set(state.packs.filter(formal).flatMap(p=>p.questions.map(q=>normalized(q.q)))),ids=new Set(),stems=new Set(),counts={};for(let i=0;i<incoming.length;i++){const q=incoming[i],label=`Question ${i+1}`;if(!q||typeof q!=='object'){errors.push(`${label}: invalid record`);continue}if(typeof q.topic!=='string'||typeof q.q!=='string'||typeof q.id!=='string'){errors.push(`${label}: malformed topic, stem or ID`);continue}const stem=normalized(q.q||'');if(!q.id||ids.has(q.id))errors.push(`${label}: duplicate/missing ID within pack`);ids.add(q.id);if(!stem||stems.has(stem))errors.push(`${label}: duplicate/missing text within pack`);stems.add(stem);const old=oldIds.get(q.id);if(old&&(!full||DEMO.some(d=>d.id===q.id)||old.topic.replace(/[ab]$/,'')!==q.topic.replace(/[ab]$/,'')))errors.push(`${label}: ID conflicts with existing bank`);if(oldStems.has(stem)&&oldStems.get(stem)!==q.id)errors.push(`${label}: wording already belongs to another ID`);if(full&&(mockIds.has(q.id)||mockStems.has(stem)))errors.push(`${label}: question already used in another full mock`);if(!Array.isArray(q.options)||q.options.length!==3||q.options.some(x=>typeof x!=='string'||!x.trim())||new Set(q.options.map(normalized)).size!==3)errors.push(`${label}: requires 3 distinct options`);if(!Number.isInteger(q.answer)||q.answer<0||q.answer>2)errors.push(`${label}: invalid answer index`);if(!q.source||!q.page||!q.explanation||!q.objective||!q.topic||!['definition','technical','scenario','calculation'].includes(q.type)||![1,2].includes(q.level))errors.push(`${label}: missing/invalid metadata`);if(calcPaper&&q.type!=='calculation')errors.push(`${label}: calculation paper requires numerical questions`);if(q.type==='calculation'&&!q.working)errors.push(`${label}: missing calculation working`);if(!SYLLABUS.some(t=>t[0]===q.topic.replace(/[ab]$/,'')))errors.push(`${label}: unknown syllabus topic`);if(full){const sub=q.blueprintSubsection;if(!Object.hasOwn(BLUEPRINT,sub)||q.topic!==sub.replace(/[ab]$/,''))errors.push(`${label}: invalid blueprint subsection`);else{counts[sub]=(counts[sub]||0)+1;if(q.level!==(['3.1','3.4','3.7b','3.16'].includes(sub)?1:2))errors.push(`${label}: incorrect knowledge level`)}}}if(full)for(const [sub,n] of Object.entries(BLUEPRINT))if(counts[sub]!==n)errors.push(`${sub}: expected ${n}, got ${counts[sub]||0}`);return errors}
function importPack(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const pack=JSON.parse(reader.result),errors=checkPack(pack);if(errors.length){alert('Import blocked:\n'+errors.slice(0,12).join('\n'));return}if(!confirm(`${pack.questions.length} questions passed structural checks. Existing topic-bank IDs may be reused by approved full mocks; existing results remain unchanged. This check does not certify technical facts. Continue?`))return;const previous=state.packs;state.packs=[...previous,{title:pack.title||file.name,kind:pack.kind||'practice',questions:pack.questions.map(q=>({...q,topic:q.topic.replace(/[ab]$/,'')})),qaApproved:pack.qaApproved===true,durationMinutes:pack.durationMinutes,passMarkPercent:pack.passMarkPercent,passMarkQuestions:pack.passMarkQuestions}];try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){state.packs=previous;throw Error('Not enough local storage; import rolled back. Export a backup first.')}render();alert('Pack imported.')}catch(e){alert('Import failed: '+e.message)}};reader.readAsText(file);input.value=''}
function backup(){let data=JSON.stringify({version:1,savedAt:new Date().toISOString(),state},null,2);download('module3-backup.json',data,'application/json')}
function download(name,data,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:mime}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restore(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj.state||!Array.isArray(obj.state.history)||!Array.isArray(obj.state.packs))throw Error('Not a valid backup');if(!confirm('Replace ALL current progress and imported packs with this backup?'))return;state=obj.state;save();render();alert('Backup restored')}catch(e){alert(e.message)}};reader.readAsText(file);input.value=''}
function settings(){return hdr('Settings','Offline content, appearance and data management')+`<div class="card"><h2 style="margin-top:0">Appearance</h2><div class="listitem"><span>Dark mode</span><button class="btn secondary" onclick="state.theme=state.theme==='dark'?'light':'dark';save();render()">${state.theme==='dark'?'Switch to light':'Switch to dark'}</button></div><h2>Question packs</h2><p class="softnote">Import a JSON pack after external editorial QA. Approved full mocks may reuse an existing topic-bank ID, but never another full mock’s questions. Full mocks must match the 52-question blueprint; drafts are blocked. The app checks required fields, exact wording, IDs and option counts; it <b>cannot verify factual correctness or semantic paraphrases</b>. Cross-exam novelty must also be checked against the master register before pack publication.</p><input aria-label="Import question pack" type="file" accept=".json,application/json" onchange="importPack(this)"><p class="mini">Current bank: ${allQ().length} questions (${DEMO.length} demonstration + ${allQ().length-DEMO.length} imported).</p><h2>Data backups</h2><div class="btnrow"><button class="btn secondary" onclick="backup()">Export backup</button><label class="btn secondary" style="cursor:pointer">Restore backup <input style="display:none" type="file" accept=".json" onchange="restore(this)"></label></div><p class="softnote">Results are saved to this browser's local storage. Export regularly, especially before reinstalling or clearing browsing data.</p><h2>Offline installation</h2><p class="softnote">The standalone HTML works without internet when opened locally on a computer. To install as an iPad/iPhone Home Screen PWA, publish the complete folder over HTTPS (for example GitHub Pages), open while online, and allow the files to cache before using aeroplane mode. iOS storage may still be cleared by the operating system: keep backups.</p></div>`}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline cache registration failed:',e)))}
</script></body></html>
