epeat(2,1fr);gap:10px}.metrics .card:last-child{grid-column:1/-1}.card{padding:19px;border-radius:17px}.actions,.split{grid-template-columns:1fr}.action{min-height:78px}.heading{font-size:30px}.footerbar{display:flex;position:fixed;bottom:0;left:0;right:0;padding:7px 10px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);justify-content:space-around;z-index:30}.footbtn{background:none;border:0;color:var(--muted);display:grid;gap:4px;justify-items:center;font-size:10px}.footbtn.active{color:var(--blue)}.footbtn span{font-size:20px}.qhead{font-size:12px}.question{font-size:21px}.answer{padding:15px}.topbar .pill{font-size:10px}}

'use strict';
// All navigation icons are locally embedded SVG: no CDN or Wi-Fi needed.
const ICON_PATHS={
 home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',

 calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M7 6h10v4H7zM8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>',

};
function uiIcon(id,cls=''){return `<svg class="ui-icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICON_PATHS[id]||ICON_PATHS.home}</svg>`;}
const ITEMS=[['home','Home'],['exams','Mock Exams'],['calc','Calculations'],['study','Study'],['progress','Progress'],['guides','Guides'],['settings','Settings']];
const DEMO=[
{id:'D001',topic:'3.1',objective:'3.1-ions',level:1,type:'definition',source:'Module 3 notes',page:'3–4',q:'An atom becomes a positive ion when it:',options:['Gains one or more electrons.','Loses one or more electrons.','Gains one or more protons.'],answer:1,explanation:'A positive ion forms when an atom loses one or more electrons, leaving more protons than electrons.'},
{id:'D002',topic:'3.3',objective:'3.3-emf',level:1,type:'definition',source:'Module 3 notes',page:'31–33',q:'What is electromotive force (EMF)?',options:['The opposition to electric current in a conductor.','The energy transferred by a source per unit charge.','The rate of flow of electric charge.'],answer:1,explanation:'EMF is energy supplied per unit charge and is expressed in volts.'},
{id:'D003',topic:'3.3',objective:'3.3-conductance',level:1,type:'definition',source:'Module 3 notes',page:'40',q:'What is electrical conductance?',options:['The reciprocal of electrical resistance.','The resistance of a material per metre.','The current delivered per unit voltage squared.'],answer:0,explanation:'Conductance G is the reciprocal of resistance, G = 1/R; the unit is the siemens.'},
{id:'D004',topic:'3.5',objective:'3.5-internal-resistance',level:2,type:'scenario',source:'Module 3 notes',page:'70–73',q:'A battery with internal resistance supplies current to a connected load. Assuming its EMF and internal resistance are constant, what happens to its terminal voltage as load current increases?',options:['It increases because the load draws more power.','It remains equal to the open-circuit EMF.','It decreases because the voltage drop across the internal resistance increases.'],answer:2,explanation:'Terminal voltage = EMF − current × internal resistance. Increasing current reduces the terminal voltage.'},
{id:'D005',topic:'3.6',objective:'3.6-kcl',level:2,type:'definition',source:'Module 3 notes',page:'88–89',q:'Kirchhoff’s Current Law states that:',options:['The sum of currents entering a junction equals the sum leaving it.','The current is identical in all parallel branches.','The total voltage around a closed loop is equal to the supply current.'],answer:0,explanation:'Conservation of charge requires the current entering a junction to equal the current leaving it.'},
{id:'D006',topic:'3.7',objective:'3.7-resistivity',level:2,type:'scenario',source:'Module 3 notes',page:'101–106',q:'Two conductors are made from the same metal and kept at the same temperature. One is twice as long and has twice the cross-sectional area of the other. How do their resistances compare?',options:['The longer conductor has double the resistance.','Both conductors have the same resistance.','The longer conductor has half the resistance.'],answer:1,explanation:'R = ρL/A; doubling both length and cross-sectional area leaves resistance unchanged.'},
{id:'D007',topic:'3.7',objective:'3.7-rheostat',level:1,type:'definition',source:'Module 3 notes',page:'127–131',q:'What is a rheostat?',options:['A three-terminal voltage divider only.','A resistor whose resistance depends on temperature.','A two-terminal variable resistor used to control current.'],answer:2,explanation:'The rheostat is a two-terminal variable resistor commonly used for current control.'},
{id:'D008',topic:'3.7',objective:'3.7-ntc',level:2,type:'definition',source:'Module 3 notes',page:'141–144',q:'What happens to the resistance of an NTC thermistor when its temperature increases?',options:['Resistance decreases.','Resistance increases.','Resistance remains constant.'],answer:0,explanation:'Negative temperature coefficient means resistance decreases as temperature rises.'},
{id:'D009',topic:'3.5',objective:'3.5-cell-series',level:2,type:'technical',source:'Module 3 notes',page:'66–68',q:'When identical cells are connected in series, which quantity increases?',options:['Their total EMF.','The current rating of each individual cell.','The number of parallel current paths.'],answer:0,explanation:'Series connection adds cell voltages; it also adds internal resistances.'},
{id:'D010',topic:'3.6',objective:'3.6-ohm',level:2,type:'calculation',source:'Module 3 notes',page:'88, 91',q:'A 24 V supply is connected across a 6 Ω resistor. What current flows through the resistor?',options:['0.25 A','4 A','144 A'],answer:1,explanation:'Ohm’s Law: I = V/R = 24/6 = 4 A.',working:'I = V/R = 24 V ÷ 6 Ω = 4 A'},
{id:'D011',topic:'3.5',objective:'3.5-battery-internal',level:2,type:'calculation',source:'Module 3 notes',page:'70–73',q:'A battery has an EMF of 28 V and an internal resistance of 0.5 Ω. What is its terminal voltage when delivering 8 A?',options:['24 V','28 V','32 V'],answer:0,explanation:'Vt = E − Ir = 28 − (8 × 0.5) = 24 V.',working:'Vt = E − Ir = 28 V − (8 A × 0.5 Ω) = 24 V'},
{id:'D012',topic:'3.7',objective:'3.7-parallel',level:2,type:'calculation',source:'Module 3 notes',page:'118–125',q:'Two resistors of 6 Ω and 3 Ω are connected in parallel. What is their combined resistance?',options:['9 Ω','4.5 Ω','2 Ω'],answer:2,explanation:'1/R = 1/6 + 1/3 = 1/2, so R = 2 Ω.',working:'1/R = 1/6 + 1/3 = 3/6 → R = 2 Ω'}
];
const SYLLABUS=[['3.1','Electron Theory',2,4],['3.2','Static Electricity and Conduction',2,4],['3.3','Electrical Terminology',2,4],['3.4','Generation of Electricity',1,3],['3.5','DC Sources of Electricity',2,4],['3.6','DC Circuits',2,3],['3.7','Resistance',2,2],['3.8','Power',1,2],['3.9','Capacitance',2,4],['3.10','Magnetism',2,4],['3.11','Inductance',2,3],['3.12','DC Motor / Generator Theory',2,3],['3.13','AC Theory',2,4],['3.14','Resistive, Capacitive and Inductive Circuits',2,4],['3.15','Transformers',2,3],['3.16','Filters',2,2],['3.17','AC Generators',2,3],['3.18','AC Motors',2,3]];
const STORAGE='m3trainer.v01';let state;try{state=JSON.parse(localStorage.getItem(STORAGE))||{}}catch{state={}};
state={history:[],packs:[],bookmarks:[],theme:'light',shuffleMockAnswers:false,shuffleStudyQuestions:false,formulaFavourites:[],...state};let timerHandle=null;let view='home',session=null,studyFilter='all',guideTab='formulas',fileInput;
const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){alert('Storage unavailable. Export a backup to protect your data.')}};
const calculationPack=p=>p.kind==='calculation-pack'&&p.qaApproved===true;
const formal=p=>p.kind==='full-mock'||(!p.kind&&p.questions.length===52&&/mock exam/i.test(p.title));
const allQ=()=>{const map=new Map(DEMO.map(q=>[q.id,q]));for(const p of state.packs.filter(p=>!formal(p)))for(const q of p.questions)if(!map.has(q.id))map.set(q.id,{...q,topic:q.topic.replace(/[ab]$/,'')});for(const p of state.packs.filter(p=>formal(p)&&p.qaApproved))for(const q of p.questions)map.set(q.id,q);return [...map.values()]};
const sessionQ=()=>session.questions;const topics=()=>new Map(SYLLABUS.map(a=>[a[0],a[1]]));
function nav(id){clearInterval(timerHandle);timerHandle=null;view=id;session=null;render();scrollTo(0,0)}
function render(){document.documentElement.classList.toggle('dark',state.theme==='dark');$('sideNav').innerHTML=ITEMS.map(([id,label])=>`<button class="navbtn ${view===id?'active':''}" aria-label="${label}" title="${label}" ${view===id?'aria-current="page"':''} onclick="nav('${id}')"><span class="ico">${uiIcon(id)}</span><span class="navlabel">${label}</span></button>`).join('');$('bottomNav').innerHTML=ITEMS.filter(x=>['home','exams','calc','study','progress'].includes(x[0])).map(([id,label])=>`<button class="footbtn ${view===id?'active':''}" aria-label="${label}" ${view===id?'aria-current="page"':''} onclick="nav('${id}')"><span>${uiIcon(id)}</span>${label.replace('Mock ','')}</button>`).join('');$('main').innerHTML=({home,exams,calc,study,progress,guides,settings})[view]();}
const hdr=(title,sub)=>`<div class="topbar"><div><div class="eyebrow">Module 03 · B2</div><h1 class="heading">${title}</h1><p class="subtitle">${sub}</p></div><span class="pill">● Offline ready</span></div>`;
const percentages=()=>{let h=state.history.filter(x=>x.mode==='mock'&&x.completed);return h.length?Math.round(h.reduce((a,b)=>a+b.score,0)/h.length):null};
function home(){let avg=percentages(),tested=new Set(state.history.flatMap(h=>h.responses.filter(r=>r.chosen!==null).map(r=>r.objective)));let obj=new Set(allQ().map(q=>q.objective));let cov=obj.size?Math.round(tested.size/obj.size*100):0;return hdr('Electrical Fundamentals','Your offline examination and revision workspace')+`<div class="metrics"><div class="card"><div class="kicker">Mock average</div><div class="metric">${avg??'—'}${avg===null?'':'%'}</div><span class="mini">${avg===null?'No full mocks completed':'Completed mock results'}</span></div><div class="card"><div class="kicker">Loaded-bank coverage</div><div class="metric">${cov}%</div><div class="progress"><i style="width:${cov}%"></i></div></div><div class="card"><div class="kicker">Sessions completed</div><div class="metric">${state.history.length}</div><span class="mini">Across all practice modes</span></div></div><h2 class="sectiontitle">Continue learning</h2><div class="actions">${[['exams','exams','Mock Exams','Exam-style papers and results'],['calc','calc','Calculations','Dedicated numerical questions'],['study','study','Study Mode','Immediate explanations and feedback'],['guides','guides','Revision Guides','Formula and exam-day sheets'],['progress','progress','Progress','Scores, errors and topic coverage'],['settings','settings','Question Packs','Import new QA-approved exams']].map(([id,ico,a,b])=>`<button class="action" onclick="nav('${id}')"><span class="actionicon">${uiIcon(ico)}</span><span><strong>${a}</strong><small>${b}</small></span><span style="margin-left:auto;color:#8da1ba">›</span></button>`).join('')}</div><h2 class="sectiontitle">About this prototype</h2><div class="card softnote">The built-in ${DEMO.length} questions are <b>demonstration practice only</b>, based on selected pages of your Resource Group notes. They are not full QA-approved mock exams or a complete syllabus bank. The percentage above tracks the objectives currently loaded, not the entire 500-page syllabus. Import approved packs as we build them.</div>`}
function exams(){const papers=state.packs.map((p,i)=>({p,i})).filter(({p})=>formal(p)&&p.qaApproved);return hdr('Mock Exams','Full papers, source-backed practice and results')+`<div class="card"><h2 style="margin:0 0 9px">Demonstration paper</h2><p class="softnote">${DEMO.length} questions · untimed · for interface testing only.</p><button class="btn" onclick="start('mock',DEMO.map(q=>q.id),'Demonstration Mock')">Start demo paper</button></div><h2 class="sectiontitle">Approved full mock exams</h2><div class="card">${papers.length?papers.map(({p,i})=>`<div class="listitem"><div><b>${safe(p.title)}</b><div class="mini">52 questions · 65 minutes · 75% pass mark · syllabus order</div></div><button class="btn secondary" onclick="startPack(${i})">Start</button></div>`).join(''):'<p class="softnote">No approved full mocks installed. Topic packs remain available in Study Mode and Calculations.</p>'}</div><h2 class="sectiontitle">Recent mock results</h2><div class="card">${state.history.filter(h=>h.mode==='mock').slice(0,5).map(h=>`<div class="listitem"><div><b>${safe(h.title)}</b><div class="mini">${safe(h.date)} · ${h.count} questions</div></div><b>${h.score}%</b></div>`).join('')||'<div class="empty">No exams completed yet.</div>'}</div>`}
const FORMULAS=[{"topic": "3.2", "id": "coulomb", "title": "Coulomb's law", "page": "19–20", "formulas": ["F = k|Q₁Q₂|/r²", "r = √(k|Q₁Q₂|/F)", "|Q₁| = Fr²/(k|Q₂|)"], "units": "F (N), Q₁,Q₂ (C), r (m), k ≈ 9 × 10⁹ N·m²/C²", "method": "Convert charges to coulombs and separation to metres; multiply charges by k; divide by squared distance.", "example": "2 µC and 3 µC, 0.30 m apart: F = 9×10⁹ × 2×10⁻⁶ × 3×10⁻⁶ / 0.30² = 0.60 N.", "trap": "Square distance, not charge. Like charges repel, unlike attract.", "keywords": ["coulomb"]}, {"topic": "3.3", "id": "prefix", "title": "SI prefix conversions", "page": "31–34,169–170", "formulas": ["G = 10⁹; M = 10⁶; k = 10³; m = 10⁻³; µ = 10⁻⁶; n = 10⁻⁹; p = 10⁻¹²"], "units": "Base SI unit = stated value × prefix multiplier", "method": "Convert to base unit, then divide by target prefix multiplier.", "example": "450 nA = 450×10⁻⁹ A = 0.45 µA.", "trap": "Capital M is mega, lowercase m is milli; square area conversion factors.", "keywords": ["convert", "micro", "nano", "kilowatt", "milliamp"]}, {"topic": "3.3", "id": "charge", "title": "Charge, current and time", "page": "35,40–41", "formulas": ["Q = It", "I = Q/t", "t = Q/I"], "units": "Q (C), I (A), t (s)", "method": "Convert time to seconds and current to amperes; multiply or rearrange.", "example": "2 A for 3 min: Q = 2 × 180 = 360 C.", "trap": "1 Ah = 3600 C, not 60 C.", "keywords": ["charge", "amp-hours"]}, {"topic": "3.3", "id": "conductance", "title": "Conductance", "page": "40", "formulas": ["G = 1/R", "R = 1/G"], "units": "G (S), R (Ω)", "method": "Take reciprocal of resistance in ohms.", "example": "40 Ω gives G = 1/40 = 0.025 S = 25 mS.", "trap": "Conductance is not conductivity.", "keywords": ["conductance"]}, {"topic": "3.5", "id": "capacity", "title": "Battery capacity", "page": "56", "formulas": ["Capacity (Ah) = I × t", "t = Ah/I", "I = Ah/t"], "units": "I (A), t (h)", "method": "Use hours for Ah; divide capacity by current for ideal endurance.", "example": "60 Ah at 5 A: t = 60/5 = 12 h.", "trap": "Actual capacity depends on discharge conditions.", "keywords": ["capacity"]}, {"topic": "3.5", "id": "cells", "title": "Series and parallel cells", "page": "66–68", "formulas": ["Eseries = nEcell", "rseries = nr", "Eparallel = Ecell", "rparallel = r/n"], "units": "E (V), r (Ω), n identical cells", "method": "For identical, like-polarity equal cells, add EMF in series; parallel strings share current.", "example": "4 cells each 1.5 V and 0.1 Ω: series gives 6 V and 0.4 Ω; parallel gives 1.5 V and 0.025 Ω.", "trap": "Parallel cells must have matched EMF; do not add parallel voltage.", "keywords": ["cell", "battery"]}, {"topic": "3.5", "id": "terminal", "title": "Loaded terminal voltage and internal resistance", "page": "72–73,97–99", "formulas": ["Vt = E − Ir", "E = Vt + Ir", "r = (E − Vt)/I", "I = (E − Vt)/r"], "units": "E, Vt (V), I (A), r (Ω)", "method": "Calculate internal voltage drop Ir; subtract from EMF on discharge.", "example": "28 V EMF, 8 A, 0.25 Ω: Vt = 28 − 2 = 26 V.", "trap": "Terminal voltage under load is lower than EMF.", "keywords": ["terminal", "internal-resistance", "source-voltage"]}, {"topic": "3.5", "id": "short", "title": "Source current and short circuit", "page": "72–73,98–99", "formulas": ["I = E/(R + r)", "R = E/I − r", "r = E/I − R", "Isc = E/r"], "units": "E (V), R external (Ω), r internal (Ω), I (A)", "method": "Add internal and external resistance before dividing EMF; short circuit is R = 0.", "example": "24 V, 7 Ω load, 1 Ω internal: I = 24/8 = 3 A.", "trap": "The short-circuit calculation is theoretical; do not short a real battery.", "keywords": ["short-circuit", "battery-loaded"]}, {"topic": "3.5", "id": "thermocouple", "title": "Thermocouple proportional example", "page": "76", "formulas": ["V₂ = V₁ × ΔT₂/ΔT₁", "ΔT₂ = ΔT₁V₂/V₁"], "units": "ΔT temperature difference (°C or K), V (mV)", "method": "Use only when the question assumes linear response over the range.", "example": "4.2 mV per 100 °C gives 8.4 mV at 200 °C difference.", "trap": "Real thermocouples are nonlinear; use the stated assumption.", "keywords": ["thermocouple"]}, {"topic": "3.6", "id": "ohm", "title": "Ohm's law", "page": "88–91", "formulas": ["V = IR", "I = V/R", "R = V/I"], "units": "V (V), I (A), R (Ω)", "method": "Choose the unknown; convert mA and kΩ first.", "example": "24 V across 6 Ω gives I = 24/6 = 4 A.", "trap": "Use the voltage across that component, not necessarily supply voltage.", "keywords": ["ohm", "resistance-v-i"]}, {"topic": "3.6", "id": "kcl", "title": "Kirchhoff's current law", "page": "92", "formulas": ["ΣIin = ΣIout", "Iunknown = ΣIin − ΣIout known"], "units": "I (A)", "method": "Identify current directions at the junction, sum entering and leaving currents.", "example": "7 A enters; 3 A leaves one branch; other branch = 7−3 = 4 A.", "trap": "Do not add an outgoing current to an incoming total.", "keywords": ["kcl", "junction", "branch"]}, {"topic": "3.6", "id": "kvl", "title": "Kirchhoff's voltage law", "page": "92", "formulas": ["ΣV = 0", "ΣEMF = Σvoltage drops"], "units": "V (V)", "method": "Choose a loop direction; add aiding sources and subtract opposing sources and drops.", "example": "28 V supply, drops 9 V and 12 V: remaining drop = 7 V.", "trap": "Use signed voltages consistently around the loop.", "keywords": ["kvl", "source-emf"]}, {"topic": "3.7", "id": "resistivity", "title": "Resistivity and conductor dimensions", "page": "101,104–105", "formulas": ["R = ρl/A", "ρ = RA/l", "l = RA/ρ", "A = ρl/R"], "units": "R (Ω), ρ (Ω·m or Ω·mm²/m), l (m), A (m² or mm² matching ρ)", "method": "Use matching area units; multiply resistivity by length and divide by cross-sectional area.", "example": "0.018 Ω·mm²/m, 35 m, 2.5 mm²: R = 0.252 Ω.", "trap": "Do not mix Ω·m and mm²; R rises with length and falls with area.", "keywords": ["resistivity", "resistance-length", "resistance-area"]}, {"topic": "3.7", "id": "seriesr", "title": "Resistors in series", "page": "116–122", "formulas": ["Rt = R₁ + R₂ + …", "Runknown = Rt − ΣRknown"], "units": "R (Ω)", "method": "Convert to same units and add resistances.", "example": "180 Ω + 270 Ω + 1.2 kΩ = 1650 Ω.", "trap": "Total is greater than each individual resistance.", "keywords": ["series-total", "series-sum"]}, {"topic": "3.7", "id": "parallelr", "title": "Resistors in parallel", "page": "119–124", "formulas": ["1/Rt = 1/R₁ + 1/R₂ + …", "Rt = R₁R₂/(R₁+R₂) (two only)", "Rt = R/n (n identical)"], "units": "R (Ω)", "method": "Find reciprocals, add, then invert; or use two-resistor shortcut.", "example": "10 Ω ∥ 40 Ω: Rt = 400/50 = 8 Ω.", "trap": "Total is smaller than the smallest branch resistance.", "keywords": ["parallel", "series-parallel"]}, {"topic": "3.7", "id": "divider", "title": "Voltage divider and loaded divider", "page": "118–124", "formulas": ["Vout = Vin Rlower/(Rupper+Rlower)", "Rlower = Vout Rupper/(Vin−Vout)"], "units": "V (V), R (Ω)", "method": "For loaded divider, first find lower resistor in parallel with load.", "example": "30 V, 10 kΩ upper, 10 kΩ lower, 10 kΩ load: lower effective 5 kΩ, Vout = 30×5/15 = 10 V.", "trap": "A load across the lower arm reduces output voltage.", "keywords": ["divider"]}, {"topic": "3.7", "id": "colourr", "title": "Resistor colour codes and tolerance", "page": "110", "formulas": ["R = significant digits × 10^multiplier", "Rmin = R(1−tol)", "Rmax = R(1+tol)"], "units": "R (Ω), tol decimal (5% = 0.05)", "method": "Black 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8, white 9; gold multiplier 0.1, silver 0.01.", "example": "Red-violet-brown-gold = 27×10 = 270 Ω ±5%; range 256.5–283.5 Ω.", "trap": "Gold tolerance is 5%, silver 10%; distinguish multiplier from tolerance.", "keywords": ["colour", "red-violet", "orange-orange"]}, {"topic": "3.7", "id": "temp", "title": "Temperature coefficient of resistance", "page": "134", "formulas": ["ΔR = R₀αΔT", "R = R₀(1+αΔT)", "α = ΔR/(R₀ΔT)", "ΔT = ΔR/(R₀α)"], "units": "R (Ω), α (per °C), ΔT (°C)", "method": "Use change in temperature, not final temperature; apply signed coefficient.", "example": "10 kΩ, α=0.0008/°C, rise 100 °C: ΔR=800 Ω, final 10.8 kΩ.", "trap": "Negative coefficients reduce resistance as temperature rises.", "keywords": ["temp-coefficient"]}, {"topic": "3.7", "id": "bridge", "title": "Balanced Wheatstone bridge", "page": "151–153", "formulas": ["R₁/R₂ = R₃/R₄", "R₄ = R₂R₃/R₁", "R₂ = R₁R₄/R₃"], "units": "R (Ω); pairs are upper/lower arms", "method": "Label the left and right upper/lower arms and equate ratios when balanced.", "example": "15/25 = 42/R₄ → R₄=42×25/15=70 Ω.", "trap": "Check the arm positions; the detector current is zero at balance.", "keywords": ["wheatstone"]}, {"topic": "3.8", "id": "power", "title": "Electrical power", "page": "163,166–167", "formulas": ["P = VI", "V = P/I", "I = P/V", "P = I²R", "I = √(P/R)", "R = P/I²", "P = V²/R", "V = √(PR)", "R = V²/P"], "units": "P (W), V (V), I (A), R (Ω)", "method": "Pick the equation using the known values. Use positive square roots for magnitudes.", "example": "2 A through 50 Ω dissipates P=2²×50=200 W.", "trap": "At fixed resistance, doubling voltage or current quadruples power.", "keywords": ["power", "i-squared", "v-squared", "rating-limit", "resistance-from-p", "current-square", "voltage-square"]}, {"topic": "3.8", "id": "energy", "title": "Electrical work and energy", "page": "156,166–169", "formulas": ["E = Pt = VIt = QV", "P = E/t", "t = E/P", "Q = E/V", "V = E/Q"], "units": "E (J), P (W), t (s), Q (C), V (V), I (A)", "method": "Convert minutes to seconds; calculate power first if needed; multiply by time.", "example": "240 W for 2.5 min: E=240×150=36,000 J=36 kJ.", "trap": "Power is a rate; energy is total work. 1 kJ = 1000 J.", "keywords": ["work", "energy", "charge-from", "time-from"]}, {"topic": "3.8", "id": "mechanical", "title": "Mechanical work and conservation of energy", "page": "155–156,168–169", "formulas": ["W = Fd (parallel force)", "F = W/d", "d = ap": "Parallel capacitors share voltage; total capacitance increases.", "keywords": ["parallel"]}, {"topic": "3.9", "id": "capvolts", "title": "Series capacitor voltage division", "page": "177,190–191", "formulas": ["Q = CtVtotal", "Vi = Q/Ci", "V₁ = Vtotal C₂/(C₁+C₂) (two)"], "units": "Q (C), C (F), V (V)", "method": "Initially uncharged series capacitors carry equal charge. Find Ct then Q then each voltage.", "example": "9 µF and 27 µF across 40 V: V9=40×27/36=30 V.", "trap": "Smaller capacitance receives larger voltage.", "keywords": ["voltage-split", "series-voltage"]}, {"topic": "3.9", "id": "capcolour", "title": "Capacitor colour values and voltage rating", "page": "173,186–187", "formulas": ["C(pF) = digits × multiplier", "Cmax/min = C(1 ± tol)", "Recommended voltage rating ≥ 2 × working V"], "units": "C (pF), tol decimal, voltage (V)", "method": "Use capacitor-specific multiplier/tolerance table from page 187; the first two bands are digits.", "example": "Red-violet-orange-green = 27×1000 pF = 27 nF ±5%. For 32 V working choose ≥64 V.", "trap": "Capacitors are coded in pF, not Ω. The voltage rule is a recommendation from the notes.", "keywords": ["colour", "rating-rule"]}, {"topic": "3.9", "id": "rc", "title": "RC time constant", "page": "194–196", "formulas": ["τ = RC", "R = τ/C", "C = τ/R", "tpractical ≈ 5τ"], "units": "τ,t (s), R (Ω), C (F)", "method": "Convert kΩ to Ω and µF to F; multiply; five time constants for practical full charge/discharge.", "example": "15 kΩ × 220 µF = 3.3 s; 5τ ≈16.5 s.", "trap": "RC has seconds as unit; practical full charge is not mathematically 100%.", "keywords": ["rc", "time-constant", "practical-charge"]}, {"topic": "3.9", "id": "rccharge", "title": "RC charging and discharging", "page": "194–196", "formulas": ["Vc at 1τ ≈ 0.63Vs (charging)", "Vc at 1τ ≈ 0.37Vinitial (discharging)", "I at 1τ ≈ 0.37I₀", "I at 2τ ≈ 0.14I₀", "I₀ = Vs/R", "I = (Vs−Vc)/R (charging)"], "units": "V (V), I (A), R (Ω)", "method": "Identify charging or discharging; apply the notes’ rounded percentage to the initial/final magnitude.", "example": "42 V charging: after one τ, Vc≈26.46 V; 90 V discharging: 33.3 V remains.", "trap": "63% charged is not 63% remaining during discharge.", "keywords": ["charge-voltage", "discharge-voltage", "initial-charge", "charging-instant", "two-tau"]}, {"topic": "3.10", "id": "mmf", "title": "Magnetomotive force", "page": "239", "formulas": ["F = NI", "N = F/I", "I = F/N"], "units": "F (ampere-turns), N turns, I (A)", "method": "Multiply turns by coil current.", "example": "600 turns × 2 A = 1200 At.", "trap": "Ampere-turns are not newtons.", "keywords": ["mmf"]}, {"topic": "3.10", "id": "field", "title": "Magnetic field strength", "page": "239–240", "formulas": ["H = NI/l = F/l", "l = NI/H", "I = Hl/N", "N = Hl/I"], "units": "H (At/m), l (m), N turns, I (A)", "method": "Convert magnetic path length to metres; divide MMF by length.", "example": "500 turns, 1.5 A, 0.5 m: H=1500 At/m.", "trap": "Length is magnetic path length, not coil wire length.", "keywords": ["calc-h", "magnetic-length"]}, {"topic": "3.10", "id": "flux", "title": "Magnetic flux and flux density", "page": "241", "formulas": ["Φ = BA", "B = Φ/A", "A = Φ/B"], "units": "Φ (Wb), B (T), A (m²)", "method": "Use area perpendicular to field and convert cm² to m².", "example": "0.006 Wb through 0.003 m² gives 2 T.", "trap": "1 cm² = 10⁻⁴ m².", "keywords": ["flux"]}, {"topic": "3.10", "id": "permeability", "title": "Magnetic permeability", "page": "241,250", "formulas": ["μ = B/H", "B = μH", "H = B/μ", "μ = μ₀μr", "μr = μ/μ₀"], "units": "μ (H/m), B (T), H (A/m), μ₀≈1.257×10⁻⁶ H/m", "method": "Use the given absolute permeability or calculate it from relative permeability.", "example": "0.8 T / 400 A/m = 0.002 H/m.", "trap": "Relative permeability is dimensionless; absolute permeability is not.", "keywords": ["permeability"]}, {"topic": "3.10", "id": "reluctance", "title": "Magnetic reluctance", "page": "251", "formulas": [" let formulaQuery='',formulaTopic='all',formulaMode='library',formulaOnlyFavourites=false,formulaOpen=new Set();
function formulaFavourites(){return Array.isArray(state.formulaFavourites)?state.formulaFavourites:[]}
function toggleFormulaFavourite(id){let list=formulaFavourites();state.formulaFavourites=list.includes(id)?list.filter(x=>x!==id):[...list,id];save();renderFormulaResults()}
function formulaQuestions(f){const all=allQ().filter(q=>q.type==='calculation');return all.filter(q=>q.topic.replace(/[ab]$/,'')===f.topic&&f.keywords.some(k=>String(q.objective||'').toLowerCase().includes(k.toLowerCase())))}
function startFormulaPractice(id){let f=FORMULAS.find(x=>x.id===id);if(!f)return;let ids=formulaQuestions(f).map(q=>q.id);if(ids.length)start('study',ids,'Formula practice — '+f.title)}
function filteredFormulas(){const term=formulaQuery.trim().toLowerCase();return FORMULAS.filter(f=>(formulaTopic==='all'||f.topic===formulaTopic)&&(!formulaOnlyFavourites||formulaFavourites().includes(f.id))&&(!term||[f.topic,f.title,f.formulas.join(' '),f.units,f.method,f.keywords.join(' ')].join(' ').toLowerCase().includes(term)))}
function formulaResults(){let cards=filteredFormulas();if(!cards.length)return '<div class="empty">No matching formulas.</div>';let last='';return cards.map(f=>{let header=f.topic!==last?`<h2 class="sectiontitle">${safe(f.topic)} · ${safe(topics().get(f.topic))}</h2>`:'';last=f.topic;let fav=formulaFavourites().includes(f.id);if(formulaMode==='compact')return header+`<div class="card" style="margin-bottom:8px"><b>${safe(f.title)}</b><div class="formula">${f.formulas.map(safe).join(' · ')}</div><div class="mini">${safe(f.units)} · PDF ${safe(f.page)}</div></div>`;let count=formulaQuestions(f).length;return header+`<details class="card" style="margin-bottom:10px" ${formulaOpen.has(f.id)?'open':''} ontoggle="if(this.open)formulaOpen.add('${f.id}');else formulaOpen.delete('${f.id}')"><summary style="cursor:pointer;font-weight:700">${safe(f.title)}<div class="formula" style="margin:7px 0">${safe(f.formulas[0])}</div></summary><p><b>Formula and rearrangements</b></p>${f.formulas.map(x=>`<div class="formula">${safe(x)}</div>`).join('')}<p><b>Symbols and units</b><br>${safe(f.units)}</p><p><b>How to calculate</b><br>${safe(f.method)}</p><div class="explain"><b>Worked example</b><br>${safe(f.example)}</div><p><b>Exam trap</b><br>${safe(f.trap)}</p><div class="meta">Resource Group Module 3 PDF · pages ${safe(f.page)}</div><div class="btnrow" style="flex-wrap:wrap;margin-top:12px"><button class="btn secondary" onclick="toggleFormulaFavourite('${f.id}')">${fav?'★ Favourited':'☆ Favourite'}</button><button class="btn" ${count?'':'disabled'} onclick="startFormulaPractice('${f.id}')">${count?'Practise '+count+' related question(s)':'No matching practice questions loaded'}</button></div></details>`}).join('')}
function renderFormulaResults(){const el=$('formulaResults');if(el)el.innerHTML=formulaResults();const count=$('formulaCount');if(count)count.textContent=filteredFormulas().length+' formula cards';const fav=$('formulaFavToggle');if(fav)fav.textContent=formulaOnlyFavourites?'Show all':'Favourites only'}
function formulaPanel(){return `<h2 class="sectiontitle">Formula Library</h2><div class="card"><p class="softnote">${FORMULAS.length} source-referenced formula cards. Search by formula, symbol or topic. Expand a card for worked examples and practice.</p><input type="search" class="field" aria-label="Search formulas" placeholder="Search formulas…" value="${safe(formulaQuery)}" oninput="formulaQuery=this.value;renderFormulaResults()" style="width:100%;margin-bottom:10px"><select class="field" aria-label="Formula topic" onchange="formulaTopic=this.value;renderFormulaResults()"><option value="all">All submodules</option>${SYLLABUS.filter(t=>FORMULAS.some(f=>f.topic===t[0])).map(t=>`<option value="${t[0]}" ${formulaTopic===t[0]?'selected':''}>${t[0]} ${safe(t[1])}</option>`).join('')}</select><div class="btnrow" style="flex-wrap:wrap;margin-top:12px"><button class="btn secondary" id="formulaFavToggle" onclick="formulaOnlyFavourites=!formulaOnlyFavourites;renderFormulaResults()">${formulaOnlyFavourites?'Show all':'Favourites only'}</button><button class="btn secondary" onclick="formulaMode=formulaMode==='compact'?'library':'compact';render();document.getElementById('formulaResults')?.scrollIntoView()">${formulaMode==='compact'?'Detailed library':'Condensed exam-day sheet'}</button><button class="btn secondary" onclick="exportFormulas()">Export formula sheet</button></div><p class="mini" id="formulaCount">${filteredFormulas().length} formula cards</p></div><div id="formulaResults">${formulaResults()}</div>`}
function exportFormulas(){let cards=filteredFormulas(),lines=['MODULE 3 — FORMULA LIBRARY',formulaMode==='compact'?'CONDENSED EXAM-DAY SHEET':'DETAILED REVISION SHEET',''];for(const f of cards){lines.push(f.topic+' '+f.title,...f.formulas,'Symbols and units: '+f.units,'Resource Group PDF pages: '+f.page);if(formulaMode!=='compact')lines.push('Method: '+f.method,'Example: '+f.example,'Exam trap: '+f.trap);lines.push('')}download('M3_formula_'+formulaMode+'.txt',lines.join('\n'),'text/plain;charset=utf-8')}
function calc(){let ids=allQ().filter(q=>q.type==='calculation').map(q=>q.id);let papers=state.packs.map((p,i)=>({p,i})).filter(({p})=>calculationPack(p));return hdr('Calculations','Formula practice and dedicated calculation papers')+`<div class="card"><div class="kicker">Available calculation questions</div><div class="metric">${ids.length}</div><div class="btnrow"><button class="btn" ${ids.length?'':'disabled'} onclick="start('study',${JSON.stringify(ids).replaceAll('"','&quot;')},'Calculation Practice')">Mixed practice</button><button class="btn secondary" onclick="document.getElementById('formulaResults')?.scrollIntoView({behavior:'smooth'})">Formula library</button></div></div><h2 class="sectiontitle">Calculation papers</h2><div class="card">${papers.length?papers.map(({p,i})=>`<div class="listitem" style="flex-wrap:wrap;gap:12px"><div><b>${safe(p.title)}</b><div class="mini">${p.questions.length} questions · ${p.durationMinutes??p.questions.length*1.25} minutes · 75% target</div></div><div class="btnrow"><button class="btn secondary" onclick="startCalcPack(${i},true)">Practice</button><button class="btn" onclick="startCalcPack(${i},false)">Exam</button></div></div>`).join(''):'<p class="softnote">Import a calculation paper through Settings.</p>'}</div>${formulaPanel()}`}
function startCalcPack(i,practice){const p=state.packs[i];if(!p||!calculationPack(p))return;start(practice?'study':'calc-exam',p.questions.map(q=>q.id),p.title,p)}
function study(){let opts=`<select class="field" onchange="studyFilter=this.value;render()"><option value="all">All topics</option>${SYLLABUS.map(t=>`<option value="${t[0]}" ${studyFilter===t[0]?'selected':''}>${t[0]} ${t[1]}</option>`).join('')}</select>`;let ids=allQ().filter(q=>studyFilter==='all'||q.topic===studyFilter).map(q=>q.id);let wrong=state.history.flatMap(h=>h.responses.filter(r=>r.chosen!==null&&!r.correct).map(r=>r.id));return hdr('Study Mode','Practise by topic or revisit incorrect answers')+`<div class="card"><div class="kicker">Choose a topic</div><div style="margin:13px 0">${opts}</div><p class="softnote">${ids.length} question(s) available for this selection. Feedback appears immediately after each answer.</p><div class="btnrow"><button class="btn" ${ids.length?'':'disabled'} onclick="start('study',${JSON.stringify(ids).replaceAll('"','&quot;')},'Study Practice')">Study these questions</button><button class="btn secondary" ${wrong.length?'':'disabled'} onclick="start('study',${JSON.stringify([...new Set(wrong)]).replaceAll('"','&quot;')},'Wrong-Answer Review')">Review wrong answers (${new Set(wrong).size})</button></div></div><h2 class="sectiontitle">Source coverage</h2><div class="card softnote">Topic selection uses the downloaded question packs. A topic with no questions is not yet covered. Our master syllabus matrix and validated full bank will be added in later builds.</div>`}
// Full mock ordering follows the supplied Resource Group blueprint, never lexical string order.
const syllabusRank=q=>{const m=/^3\.(\d+)([ab]?)$/.exec(q.blueprintSubsection||q.topic);return m?Number(m[1])*3+({'':0,a:1,b:2}[m[2]]):999};
const orderedMock=qs=>[...qs].sort((a,b)=>syllabusRank(a)-syllabusRank(b));
function shuffled(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function shuffledOptions(q){const order=shuffled([0,1,2]);return {...q,options:order.map(i=>q.options[i]),answer:order.indexOf(q.answer)}}
function start(mode,ids,title,pack=null){const pool=pack?pack.questions:allQ();const map=new Map(pool.map(q=>[q.id,q]));let unique=[...new Set(ids)].filter(id=>map.has(id));const full=mode==='mock'&&pack&&formal(pack);if(full)unique=orderedMock(unique.map(id=>map.get(id))).map(q=>q.id);else if(mode==='study'&&state.shuffleStudyQuestions)unique=shuffled(unique);if(!unique.length)return;clearInterval(timerHandle);const started=Date.now();session={mode,ids:unique,questions:unique.map(id=>full&&state.shuffleMockAnswers?shuffledOptions(map.get(id)):map.get(id)),title,i:0,answers:{},revealed:{},started,deadline:pack&&mode!=='study'?started+(formal(pack)?65:(pack.durationMinutes??pack.questions.length*1.25))*60000:null,passTarget:pack?(formal(pack)?39:Math.ceil(pack.questions.length*0.75)):null};view='runner';renderRunner();if(session.deadline)timerHandle=setInterval(updateTimer,1000);scrollTo(0,0)}
function startPack(i){const p=state.packs[i];if(!p||!formal(p)||!p.qaApproved)return;start('mock',p.questions.map(q=>q.id),p.title,p)}
function updateTimer(){if(!session||!session.deadline)return;const seconds=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));const el=$('examTimer');if(el)el.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;if(seconds===0)finish(true)}
function renderRunner(){const q=sessionQ().find(x=>x.id===session.ids[session.i]),i=session.i,picked=session.answers[q.id],show=session.mode==='study'&&session.revealed[q.id];document.querySelectorAll('.navbtn,.footbtn').forEach(x=>x.classList.remove('active'));$('main').innerHTML=`<div class="qbox"><div class="topbar"><button class="btn ghost" onclick="if(confirm('Leave this session? Unsaved answers will be lost.'))nav('exams')">‹ Exit</button><span class="tag">${session.mode==='study'?'Study mode':'Exam mode'}</span>${session.deadline?`<span class="tag" id="examTimer">${Math.floor(Math.max(0,Math.ceil((session.deadline-Date.now())/1000))/60)}:${String(Math.max(0,Math.ceil((session.deadline-Date.now())/1000))%60).padStart(2,'0')}</span>`:''}</div><div class="card" style="margin-top:15px"><div class="qhead"><span>Question ${i+1} of ${session.ids.length}</span><span>${safe(session.title)}</span></div><div class="progress"><i style="width:${(i+1)/session.ids.length*100}%"></i></div><p class="question">${safe(q.q)}</p>${q.options.map((option,j)=>`<button class="answer ${picked===j?'selected':''} ${show&&j===q.answer?'correct':''} ${show&&picked===j&&picked!==q.answer?'wrong':''}" ${show?'disabled':''} onclick="choose(${j})"><span class="letter">${'ABC'[j]}</span><span>${safe(option)}</span></button>`).join('')}${show?`<div class="explain"><b>${picked===q.answer?'Correct':'Incorrect — answer '+ 'ABC'[q.answer]}</b><br>${safe(q.explanation)}${q.working?`<p><b>Working:</b> ${safe(q.working)}</p>`:''}<div class="meta">${safe(q.source)} · pages ${safe(q.page)} · Level ${q.level}</div></div>`:''}<div class="btnrow" style="justify-content:space-between;margin-top:26px"><button class="btn secondary" ${i===0?'disabled':''} onclick="move(-1)">‹ Previous</button>${session.mode==='study'&&!show?`<button class="btn secondary" ${picked===undefined?'disabled':''} onclick="reveal()">Check answer</button>`:''}${i===session.ids.length-1?`<button class="btn" onclick="finish()">Finish & mark</button>`:`<button class="btn" onclick="move(1)">Next ›</button>`}</div></div><p class="softnote" style="text-align:center">${session.mode!=='study'?'Answers are revealed only after submitting the paper.':'Check each answer to see its explanation.'}</p></div>`}
function choose(j){let q=sessionQ().find(x=>x.id===session.ids[session.i]);session.answers[q.id]=j;renderRunner()}function reveal(){let q=sessionQ().find(x=>x.id===session.ids[session.i]);if(session.answers[q.id]===undefined)return;session.revealed[q.id]=true;renderRunner()}function move(n){session.i=Math.max(0,Math.min(session.ids.length-1,session.i+n));renderRunner();scrollTo(0,0)}
function finish(timedOut=false){if(!session)return;let missing=session.ids.filter(id=>session.answers[id]===undefined).length;if(missing&&!timedOut&&!confirm(`${missing} question(s) unanswered. Submit anyway?`))return;clearInterval(timerHandle);timerHandle=null;let qmap=new Map(sessionQ().map(q=>[q.id,q]));let responses=session.ids.map(id=>{let q=qmap.get(id),chosen=session.answers[id];return{id,objective:q.objective,topic:q.topic,chosen:chosen===undefined?null:chosen,correct:chosen===q.answer,expected:q.answer,chosenText:chosen===undefined?null:q.options[chosen],correctText:q.options[q.answer],question:q.q,options:[...q.options],blueprintSubsection:q.blueprintSubsection||q.topic,level:q.level,type:q.type,source:q.source,page:q.page,explanation:q.explanation,working:q.working||''}});let score=Math.round(responses.filter(x=>x.correct).length/responses.length*100);let record={id:'R'+Date.now(),title:session.title,mode:session.mode,count:responses.length,score,date:new Date().toLocaleDateString('en-GB'),completed:true,responses,elapsedSeconds:Math.round((Date.now()-session.started)/1000),timedOut,passTarget:session.passTarget,pass:session.deadline?responses.filter(x=>x.correct).length>=session.passTarget:null};state.history.unshift(record);save();session=null;view='result';$('main').innerHTML=hdr('Results',record.title)+`<div class="card"><div class="kicker">Your score</div><div class="metric">${score}%</div>${record.pass===null?'':`<span class="tag ${record.pass?'good':'warn'}">${record.pass?'PASS':'NOT PASSED'}</span>`}<p>${responses.filter(x=>x.correct).length} of ${record.count} correct</p><div class="btnrow"><button class="btn" onclick="nav('exams')">Back to exams</button><button class="btn secondary" onclick="nav('progress')">See progress</button></div></div><h2 class="sectiontitle">Export for revision</h2><div class="card"><p class="softnote">Save a report to Files, then upload it to your Module 3 chat. Includes exact question wording, all options, your answers, correct answers, explanations and source pages.</p>${reportButtons(0)}</div><h2 class="sectiontitle">Answer review</h2>${responses.map((r,i)=>{let q=qmap.get(r.id);return `<div class="card" style="margin-bottom:12px"><div class="meta">Question ${i+1} · ${safe(q.topic)} · pages ${safe(q.page)}</div><p><b>${safe(q.q)}</b></p><p class="softnote">Your answer: ${r.chosen===null?'Not answered':safe(q.options[r.chosen])}<br><b>Correct: ${safe(q.options[q.answer])}</b></p><div class="explain">${safe(q.explanation)}${q.working?`<br><b>Working:</b> ${safe(q.working)}`:''}</div></div>`}).join('')}`;scrollTo(0,0)}
function progress(){let h=state.history,wrong=h.flatMap(x=>x.responses.filter(r=>r.chosen!==null&&!r.correct));let attempts=h.flatMap(x=>x.responses);let pct=attempts.length?Math.round(attempts.filter(r=>r.correct).length/attempts.length*100):null;return hdr('Progress','Your study history and syllabus coverage')+`<div class="metrics"><div class="card"><div class="kicker">Questions attempted</div><div class="metric">${attempts.length}</div></div><div class="card"><div class="kicker">Answer accuracy</div><div class="metric">${pct===null?'—':pct+'%'}</div></div><div class="card"><div class="kicker">Incorrect responses</div><div class="metric">${wrong.length}</div></div></div><h2 class="sectiontitle">Topic tracking</h2><div class="card">${SYLLABUS.map(t=>{let a=attempts.filter(r=>r.topic===t[0]),n=allQ().filter(q=>q.topic===t[0]).length,rate=a.length?Math.round(a.filter(r=>r.correct).length/a.length*100):null;return`<div class="listitem"><div><b>${t[0]} · ${t[1]}</b><div class="mini">${t[0]==='3.7'?'Levels 1/2':'Level '+(['3.1','3.4','3.16'].includes(t[0])?1:2)} · ${Object.entries(BLUEPRINT).filter(([k])=>k.replace(/[ab]$/,'')===t[0]).reduce((a,[k,v])=>a+v,0)} questions in supplied B2 template · ${n} loaded practice items</div></div><span class="tag ${rate===null?'warn':rate>=80?'good':''}">${rate===null?'Not tested':rate+'% accuracy'}</span></div>`}).join('')}</div><h2 class="sectiontitle">Previous sessions</h2><div class="card">${h.length?h.map((x,i)=>`<div class="listitem" style="flex-wrap:wrap;gap:10px"><div><b>${safe(x.title)}</b><div class="mini">${safe(x.date)} · ${x.count} questions</div></div><b>${x.score}%</b><div style="width:100%">${reportButtons(i)}</div></div>`).join(''):'<div class="empty">Your results will appear here after completing a session.</div>'}</div>`}
function guides(){let tabs=[['formulas','Formula Sheet'],['examday','Exam-Day Sheet'],['topics','Topic Overview']];return hdr('Revision Guides','Offline reference sheets and exam preparation')+`<div class="btnrow" style="margin-bottom:20px">${tabs.map(t=>`<button class="btn ${guideTab===t[0]?'':'secondary'}" onclick="guideTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${guideTab==='formulas'?formulaPanel():guideTab==='examday'?`<div class="sheet"><h2>Quick revision checklist</h2><p>□ Conventional current direction vs electron flow<br>□ Current, voltage, resistance, conductance and power units<br>□ Series versus parallel rules<br>□ Kirchhoff's Current and Voltage Laws<br>□ Batteries: EMF, terminal voltage and internal resistance<br>□ NTC versus PTC characteristics<br>□ Ohm's Law and formula rearrangement<br>□ Keep units consistent before calculating</p><p class="softnote">Initial demonstration sheet. The full day-of-exam pack will be authored and QA-checked against the complete notes.</p></div>`:`<div class="sheet"><h2>B2 Module 3 syllabus</h2>${SYLLABUS.map(t=>`<div class="listitem"><span>${t[0]} · ${t[1]}</span><span class="tag">Level ${t[2]}</span></div>`).join('')}<p class="softnote">Topic grouping and levels transcribed from the supplied Resource Group examination breakdown, page 8. The complete objective-level matrix is still to be built.</p></div>`}<button class="btn secondary" onclick="print()">Print this guide</button>`}
const normalized=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const BLUEPRINT={'3.1':2,'3.2':2,'3.3':4,'3.4':4,'3.5':4,'3.6':3,'3.7a':2,'3.7b':2,'3.8':2,'3.9':2,'3.10a':2,'3.10b':2,'3.11':3,'3.12':2,'3.13':4,'3.14':2,'3.15':2,'3.16':2,'3.17':3,'3.18':3};
function checkPack(pack){const errors=[],incoming=pack?.questions;if(!Array.isArray(incoming)||!incoming.length)return ['Missing questions array.'];const full=pack.kind==='full-mock';const calcPaper=pack.kind==='calculation-pack';if(calcPaper&&(pack.qaApproved!==true||!Number.isFinite(pack.durationMinutes)||pack.durationMinutes<=0||pack.passMarkPercent!==75||pack.passMarkQuestions!==Math.ceil(incoming.length*.75)))errors.push('Invalid calculation paper metadata.');if(typeof pack.title!=='string'||!pack.title.trim())errors.push('Missing pack title.');if(full&&pack.qaApproved!==true)errors.push('Full mock is not QA-approved. Drafts cannot be imported.');if(full&&incoming.length!==52)errors.push('Full mock must have exactly 52 questions.');if(state.packs.some(p=>p.title===pack.title))errors.push('A pack with this title is already installed.');const bank=allQ(),oldIds=new Map(bank.map(q=>[q.id,q])),oldStems=new Map(bank.map(q=>[normalized(q.q),q.id])),mockIds=new Set(state.packs.filter(formal).flatMap(p=>p.questions.map(q=>q.id))),mockStems=new Set(state.packs.filter(formal).flatMap(p=>p.questions.map(q=>normalized(q.q)))),ids=new Set(),stems=new Set(),counts={};for(let i=0;i<incoming.length;i++){const q=incoming[i],label=`Question ${i+1}`;if(!q||typeof q!=='object'){errors.push(`${label}: invalid record`);continue}if(typeof q.topic!=='string'||typeof q.q!=='string'||typeof q.id!=='string'){errors.push(`${label}: malformed topic, stem or ID`);continue}const stem=normalized(q.q||'');if(!q.id||ids.has(q.id))errors.push(`${label}: duplicate/missing ID within pack`);ids.add(q.id);if(!stem||stems.has(stem))errors.push(`${label}: duplicate/missing text within pack`);stems.add(stem);const old=oldIds.get(q.id);if(old&&(!full||DEMO.some(d=>d.id===q.id)||old.topic.replace(/[ab]$/,'')!==q.topic.replace(/[ab]$/,'')))errors.push(`${label}: ID conflicts with existing bank`);if(oldStems.has(stem)&&oldStems.get(stem)!==q.id)errors.push(`${label}: wording already belongs to another ID`);if(full&&(mockIds.has(q.id)||mockStems.has(stem)))errors.push(`${label}: question already used in another full mock`);if(!Array.isArray(q.options)||q.options.length!==3||q.options.some(x=>typeof x!=='string'||!x.trim())||new Set(q.options.map(normalized)).size!==3)errors.push(`${label}: requires 3 distinct options`);if(!Number.isInteger(q.answer)||q.answer<0||q.answer>2)errors.push(`${label}: invalid answer index`);if(!q.source||!q.page||!q.explanation||!q.objective||!q.topic||!['definition','technical','scenario','calculation'].includes(q.type)||![1,2].includes(q.level))errors.push(`${label}: missing/invalid metadata`);if(calcPaper&&q.type!=='calculation')errors.push(`${label}: calculation paper requires numerical questions`);if(q.type==='calculation'&&!q.working)errors.push(`${label}: missing calculation working`);if(!SYLLABUS.some(t=>t[0]===q.topic.replace(/[ab]$/,'')))errors.push(`${label}: unknown syllabus topic`);if(full){const sub=q.blueprintSubsection;if(!Object.hasOwn(BLUEPRINT,sub)||q.topic!==sub.replace(/[ab]$/,''))errors.push(`${label}: invalid blueprint subsection`);else{counts[sub]=(counts[sub]||0)+1;if(q.level!==(['3.1','3.4','3.7b','3.16'].includes(sub)?1:2))errors.push(`${label}: incorrect knowledge level`)}}}if(full)for(const [sub,n] of Object.entries(BLUEPRINT))if(counts[sub]!==n)errors.push(`${sub}: expected ${n}, got ${counts[sub]||0}`);return errors}
function importPack(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const pack=JSON.parse(reader.result),errors=checkPack(pack);if(errors.length){alert('Import blocked:\n'+errors.slice(0,12).join('\n'));return}if(!confirm(`${pack.questions.length} questions passed structural checks. Existing topic-bank IDs may be reused by approved full mocks; existing results remain unchanged. This check does not certify technical facts. Continue?`))return;const previous=state.packs;state.packs=[...previous,{title:pack.title||file.name,kind:pack.kind||'practice',questions:(formal(pack)?orderedMock(pack.questions):pack.questions).map(q=>({...q,topic:q.topic.replace(/[ab]$/,'')})),qaApproved:pack.qaApproved===true,durationMinutes:pack.durationMinutes,passMarkPercent:pack.passMarkPercent,passMarkQuestions:pack.passMarkQuestions}];try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){state.packs=previous;throw Error('Not enough local storage; import rolled back. Export a backup first.')}render();alert('Pack imported.')}catch(e){alert('Import failed: '+e.message)}};reader.readAsText(file);input.value=''}
function backup(){let data=JSON.stringify({version:1,savedAt:new Date().toISOString(),state},null,2);download('module3-backup.json',data,'application/json')}
// Reports are built locally: no network, and no dependence on the open session.
function reportButtons(i){return `<div class="btnrow" style="flex-wrap:wrap;gap:8px"><button class="btn" onclick="exportReport(${i},'missed','txt')">Export missed questions</button><button class="btn secondary" onclick="exportReport(${i},'all','txt')">Export full report</button><button class="btn secondary" onclick="exportReport(${i},'all','json')">Export JSON</button></div>`}
function buildReport(record,scope='all'){
 const bank=new Map(allQ().map(q=>[q.id,q]));const rows=record.responses.map((r,i)=>{
  const q=bank.get(r.id);const exact=typeof r.question==='string'&&Array.isArray(r.options);const fallback=!exact&&!!q;
  const opts=exact?r.options:fallback?q.options:null;
  const selected=r.chosenText??(r.chosen===null?null:(!exact&&q?q.options[r.chosen]:null));
  const correct=r.correctText??(exact?opts[r.expected]:q?.options[q.answer]??null);
  return {number:i+1,id:r.id,topic:r.topic,subsection:r.blueprintSubsection||q?.blueprintSubsection||r.topic,objective:r.objective,status:r.correct?'correct':r.chosen===null?'unanswered':'incorrect',question:exact?r.question:q?.q??null,options:opts,optionOrder:exact?'as presented':fallback?'current bank order (historical order not recorded)':'unavailable',questionSource:exact?'session snapshot':fallback?'current question bank; historic wording not recorded':'unavailable',selectedAnswer:selected,correctAnswer:correct,selectedIndex:exact?r.chosen:null,correctIndex:exact?r.expected:null,level:r.level??q?.level??null,type:r.type??q?.type??null,explanation:r.explanation??q?.explanation??null,working:r.working??q?.working??null,source:r.source??q?.source??null,page:r.page??q?.page??null};
 });
 const tally=items=>({total:items.length,correct:items.filter(x=>x.status==='correct').length,incorrect:items.filter(x=>x.status==='incorrect').length,unanswered:items.filter(x=>x.status==='unanswered').length});
 const counts=tally(rows);const groups=new Map();for(const row of rows){if(!groups.has(row.subsection))groups.set(row.subsection,[]);groups.get(row.subsection).push(row)}
 const breakdown=[...groups.entries()].sort((a,b)=>syllabusRank({topic:a[0]})-syllabusRank({topic:b[0]})).map(([sub,items])=>({subsection:sub,title:topics().get(sub?.replace(/[ab]$/,''))??'',...tally(items),accuracyPercent:Math.round(100*tally(items).correct/items.length)}));
 const selectedRows=scope==='missed'?rows.filter(x=>x.status!=='correct').sort((a,b)=>syllabusRank({topic:a.subsection})-syllabusRank({topic:b.subsection})||a.number-b.number):rows;
 return {schema:'module3-exam-report-v1',scope,exam:record.title,date:record.date,mode:record.mode,scorePercent:counts.total?Math.round(1000*counts.correct/counts.total)/10:0,displayedScore:record.score,pass:record.pass??null,passTarget:record.passTarget??(record.pass==null?null:Math.ceil(counts.total*.75)),elapsedSeconds:record.elapsedSeconds??null,timedOut:record.timedOut??false,...counts,breakdown,questions:selectedRows,notes:rows.some(x=>x.questionSource!=='session snapshot')?'Historical results may use current bank wording and option order; recorded selected/correct answer text is retained when available. Missing items are explicitly marked.':'All questions and answer options are exact session snapshots.'};
}
function formatReport(p){const lines=['MODULE 3 — ELECTRICAL FUNDAMENTALS','EXAM REVIEW REPORT',`Exam: ${p.exam}`,`Date: ${p.date}`,`Mode: ${p.mode}`,`Result: ${p.correct}/${p.total} (${p.scorePercent}%)${p.pass===null?'':p.pass?' — PASS':' — NOT PASSED'}`,`Incorrect: ${p.incorrect} | Unanswered: ${p.unanswered}`,`Pass threshold: ${p.passTarget??'Not applicable'}`,`Elapsed: ${p.elapsedSeconds===null?'Not recorded':Math.floor(p.elapsedSeconds/60)+'m '+p.elapsedSeconds%60+'s'}`,p.notes,'','SUBMODULE PERFORMANCE'];for(const t of p.breakdown)lines.push(`${t.subsection} ${t.title}: ${t.correct}/${t.total} (${t.accuracyPercent}%) — ${t.incorrect} incorrect, ${t.unanswered} unanswered`);lines.push('',p.scope==='missed'?'MISSED QUESTIONS (INCORRECT AND UNANSWERED)':'ALL QUESTIONS IN EXAM ORDER');if(!p.questions.length)lines.push('No missed questions.');for(const q of p.questions){lines.push('','--------------------------------------------------',`Question ${q.number} | ${q.subsection} | ${q.status.toUpperCase()} | ${q.id}`,q.question??'[Question wording unavailable — original pack no longer loaded]','');if(q.options)q.options.forEach((o,i)=>lines.push(`${'ABC'[i]}. ${o}`));else lines.push('[Answer options unavailable]');lines.push(`Option order: ${q.optionOrder}`,`Your answer: ${q.status==='unanswered'?'Not answered':q.selectedAnswer??'Not recorded'}`,`Correct answer: ${q.correctAnswer??'Not available'}`,`Explanation: ${q.explanation??'Not available'}`);if(q.working)lines.push(`Worked solution: ${q.working}`);lines.push(`Source: ${q.source??'Unknown'} | PDF pages: ${q.page??'Unknown'} | Level: ${q.level??'Unknown'}`,`Objective: ${q.objective??'Unknown'}`)}lines.push('','REVISION REQUEST: Explain each missed question using the original Resource Group notes, identify why my chosen answer was wrong, and test me with fresh questions on my weak topics.');return lines.join('\n')}
function exportReport(index,scope,format){const record=state.history[index];if(!record)return;const report=buildReport(record,scope);const name=('M3_'+record.title+'_'+record.date+'_'+scope+'_'+record.id).replace(/[^a-zA-Z0-9_-]+/g,'_').slice(0,150);download(name+'.'+format,format==='json'?JSON.stringify(report,null,2):formatReport(report),format==='json'?'application/json':'text/plain;charset=utf-8')}
function download(name,data,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:mime}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restore(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj.state||!Array.isArray(obj.state.history)||!Array.isArray(obj.state.packs))throw Error('Not a valid backup');if(!confirm('Replace ALL current progress and imported packs with this backup?'))return;state=obj.state;save();render();alert('Backup restored')}catch(e){alert(e.message)}};reader.readAsText(file);input.value=''}
function settings(){return hdr('Settings','Offline content, appearance and data management')+`<div class="card"><h2 style="margin-top:0">Appearance</h2><div class="listitem"><span>Dark mode</span><button class="btn secondary" onclick="state.theme=state.theme==='dark'?'light':'dark';save();render()">${state.theme==='dark'?'Switch to light':'Switch to dark'}</button></div><h2>Exam and study preferences</h2><p class="softnote">Trainer v0.7 · Full mocks always follow Resource Group syllabus order.</p><div class="listitem"><span>Shuffle full mock answers</span><button class="btn secondary" onclick="state.shuffleMockAnswers=!state.shuffleMockAnswers;save();render()">${state.shuffleMockAnswers?'On':'Off'}</button></div><div class="listitem"><span>Randomise study questions</span><button class="btn secondary" onclick="state.shuffleStudyQuestions=!state.shuffleStudyQuestions;save();render()">${state.shuffleStudyQuestions?'On':'Off'}</button></div><h2>Question packs</h2><p class="softnote">Import a JSON pack after external editorial QA. Approved full mocks may reuse an existing topic-bank ID, but never another full mock’s questions. Full mocks must match the 52-question blueprint; drafts are blocked. Full mocks always run in syllabus order (3.1–3.18, including a/b subsections). The app checks required fields, exact wording, IDs and option counts; it <b>cannot verify factual correctness or semantic paraphrases</b>. Cross-exam novelty must also be checked against the master register before pack publication.</p><input aria-label="Import question pack" type="file" accept=".json,application/json" onchange="importPack(this)"><p class="mini">Current bank: ${allQ().length} questions (${DEMO.length} demonstration + ${allQ().length-DEMO.length} imported).</p><h2>Data backups</h2><div class="btnrow"><button class="btn secondary" onclick="backup()">Export backup</button><label class="btn secondary" style="cursor:pointer">Restore backup <input style="display:none" type="file" accept=".json" onchange="restore(this)"></label></div><p class="softnote">Results are saved to this browser's local storage. Export regularly, especially before reinstalling or clearing browsing data.</p><h2>Offline installation</h2><p class="softnote">The standalone HTML works without internet when opened locally on a computer. To install as an iPad/iPhone Home Screen PWA, publish the complete folder over HTTPS (for example GitHub Pages), open while online, and allow the files to cache before using aeroplane mode. iOS storage may still be cleared by the operating system: keep backups.</p></div>`}
