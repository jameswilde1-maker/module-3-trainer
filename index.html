-size:32px;font-weight:800;letter-spacing:-.055em;margin-top:8px}.progress{height:8px;border-radius:20px;background:#e9eef6;overflow:hidden;margin-top:13px}.progress i{height:100%;display:block;background:var(--blue);border-radius:20px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.action{display:flex;gap:15px;text-align:left;align-items:center;min-height:100px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;color:var(--ink)}.action:hover,.navbtn:hover,.answer:hover{border-color:#a8ccff;background:#f4f9ff}.actionicon{font-size:24px;color:var(--blue);background:var(--pale);border-radius:13px;width:50px;height:50px;display:grid;place-items:center;flex-shrink:0}.action strong{display:block;font-size:16px}.action small{color:var(--muted);font-size:12px;margin-top:5px;display:block}.sectiontitle{font-size:19px;letter-spacing:-.03em;margin:33px 0 14px}.softnote{font-size:13px;color:var(--muted);line-height:1.6}.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--blue);color:white;font-weight:750}.btn.secondary{background:var(--pale);color:#1158a5}.btn.ghost{background:transparent;color:var(--blue)}.btn.danger{background:#fff0f0;color:#a32a33}.btnrow{display:flex;flex-wrap:wrap;gap:9px}.listitem{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.listitem:last-child{border-bottom:0}.tag{font-size:11px;padding:5px 9px;border-radius:20px;background:var(--pale);color:#1568cd;font-weight:700}.tag.warn{color:#a26013;background:#fff3db}.tag.good{color:#16764a;background:#e5f7ee}.qbox{max-width:800px;margin:auto}.question{font-weight:750;font-size:clamp(20px,2.5vw,25px);letter-spacing:-.025em;line-height:1.4;margin:22px 0 26px}.answer{width:100%;text-align:left;padding:18px 20px;margin-bottom:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;display:flex;align-items:flex-start;gap:12px;line-height:1.5;color:var(--ink)}.answer.selected{border-color:var(--blue);background:var(--pale)}.answer.correct{border-color:#20a675;background:#eefaf4}.answer.wrong{border-color:#d65f6b;background:#fff0f1}.letter{font-weight:800;color:#0a72e4;background:#eaf3ff;min-width:30px;height:30px;border-radius:9px;display:grid;place-items:center}.answer span:last-child{flex:1}.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.explain{border-radius:14px;background:#f1f8ff;padding:17px;line-height:1.6;margin:18px 0}.meta{font-size:12px;color:var(--muted)}.field{background:white;border:1px solid #ccd8e8;border-radius:11px;padding:12px 14px;min-width:0;max-width:100%;color:var(--ink)}select.field{min-width:220px}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mini{font-size:12px;color:var(--muted)}.hide{display:none!important}.empty{padding:34px;text-align:center;color:var(--muted)}.sheet{background:#fff;border:1px solid var(--line);padding:25px;border-radius:18px;margin-bottom:14px;line-height:1.7}.formula{font-size:21px;color:#065fb9;font-weight:800;padding:8px 0}.footerbar{display:none}.counter{color:var(--muted);font-size:12px}.toggle{display:flex;align-items:center;gap:9px}.dark{--ink:#edf3fc;--muted:#a6b4ca;--line:#35435b;--card:#212e42;--bg:#151f30;--pale:#1c4166;--sidebar:#182437;background:var(--bg);color:var(--ink)}.dark .card,.dark .action,.dark .answer,.dark .field,.dark .sheet{background:var(--card);color:var(--ink)}.dark .answer.selected{background:var(--pale)}.dark .explain{background:#253d57}.dark .action:hover,.dark .answer:hover{background:#2d4260}@media(max-width:850px){.side{width:72px;padding:14px 8px}.brand{font-size:0;justify-content:center;padding:10px 0 28px}.navbtn{padding:13px 9px;justify-content:center;font-size:0}.navbtn .ico{font-size:23px}.sidefoot{display:none}.main{padding:26px 22px 95px}}@media(max-width:600px){.side{display:none}.main{padding:24px 17px 100px}.metrics{grid-template-columns:repeat(2,1fr);gap:10px}.metrics .card:last-child{grid-column:1/-1}.card{padding:19px;border-radius:17px}.actions,.split{grid-template-columns:1fr}.action{min-height:78px}.heading{font-size:30px}.footerbar{display:flex;position:fixed;bottom:0;left:0;right:0;padding:7px 10px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);justify-content:space-around;z-index:30}.footbtn{background:none;border:0;color:var(--muted);display:grid;gap:4px;justify-items:center;font-size:10px}.footbtn.active{color:var(--blue)}.footbtn span{font-size:20px}.qhead{font-size:12px}.question{font-size:21px}.answer{padding:15px}.topbar .pill{font-size:10px}}

</style></head><body><div class="app" id="app"><aside class="side"><div class="brand"><span class="logo">⚡</span>Module 03</div><nav id="sideNav"></nav><div class="sidefoot">Electrical Fundamentals · B2<br><span id="offlineSide">Offline-first trainer</span><br>Prototype v0.1</div></aside><main class="main" id="main" aria-live="polite"></main></div><nav class="footerbar" id="bottomNav"></nav><script>
'use strict';
const ITEMS=[['home','⌂','Home'],['exams','▤','Mock Exams'],['calc','▦','Calculations'],['study','▧','Study'],['progress','▥','Progress'],['guides','≡','Guides'],['settings','⚙','Settings']];
const DEMO=[
{id:'D001',topic:'3.1',objective:'3.1-ions',level:1,type:'definition',source:'Module 3 notes',page:'3–4',q:'An atom becomes a positive ion when it:',options:['Gains one or more electrons.','Loses one or more electrons.','Gains one or more protons.'],answer:1,explanation:'A positive ion forms when an atom loses one or more electrons, leaving more protons than electrons.'},
{id:'D002',topic:'3.3',objective:'3.3-emf',level:1,type:'definition',source:'Module 3 notes',page:'31–33',q:'What is electromotive force (EMF)?',options:['The opposition to electric current in a conductor.','The energy transferred by a source per unit charge.','The rate of flow of electric charge.'],answer:1,explanation:'EMF is energy supplied per unit charge and is expressed in volts.'},
{id:'D003',topic:'3.3',objective:'3.3-conductance',level:1,type:'definition',source:'Module 3 notes',page:'40',q:'What is electrical conductance?',options:['The reciprocal of electrical resistance.','The resistance of a material per metre.','The current delivered per unit voltage squared.'],answer:0,explanation:'Conductance G is the reciprocal of resistance, G = 1/R; the unit is the siemens.'},
{id:'D004',topic:'3.5',objective:'3.5-internal-resistance',level:2,type:'scenario',source:'Module 3 notes',page:'70–73',q:'A battery with internal resistance supplies current to a connected load. Assuming its EMF and internal resistance are constant, what happens to its terminal voltage as load current increases?',options:['It increases because the load draws more power.','It remains equal to the open-circuit EMF.','It decreases because the voltage drop across the internal resistance increases.'],answer:2,explanation:'Terminal voltage = EMF − current × internal resistance. Increasing current reduces the terminal voltage.'},
{id:'D005',topic:'3.6',objective:'3.6-kcl',level:2,type:'definition',source:'Module 3 notes',page:'88–89',q:'Kirchhoff’s Current Law states that:',options:['The sum of currents entering a junction equals the sum leaving it.','The current is identical in all parallel branches.','The total voltage around a closed loop is equal to the supply current.'],answer:0,explanation:'Conservation of charge requires the current entering a junction to equal the current leaving it.'},
{id:'D006',topic:'3.7',objective:'3.7-resistivity',level:2,type:'scenario',source:'Module 3 notes',page:'101–106',q:'Two conductors are made from the same metal and kept at the same temperature. One is twice as long and has twice the cross-sectional area of the other. How do their resistances compare?',options:['The longer conductor has double the resistance.','Both conductors have the same resistance.','The longer conductor has half the resistance.'],answer:1,explanation:'R = ρL/A; doubling both length and cross-sectional area leaves resistance unchanged.'},
{id:'D007',topic:'3.7',objective:'3.7-rheostat',level:1,type:'definition',source:'Module 3 notes',page:'127–131',q:'What is a rheostat?',options:['A three-terminal voltage divider only.','A resistor whose resistance depends on temperature.','A two-terminal variable resistor used to control current.'],answer:2,explanation:'The rheostat is a two-terminal variable resistor commonly used for current control.'},
{id:'D008',topic:'3.7',objective:'3.7-ntc',level:2,type:'definition',source:'Module 3 notes',page:'141–144',q:'What happens to the resistance of an NTC thermistor when its temperature increases?',options:['Resistance decreases.','Resistance increases.','Resistance remains constant.'],answer:0,explanation:'Negative temperature coefficient means resistance decreases as temperature rises.'},
{id:'D009',topic:'3.5',objective:'3.5-cell-series',level:2,type:'technical',source:'Module 3 notes',page:'66–68',q:'When identical cells are connected in series, which quantity increases?',options:['Their total EMF.','The current rating of each individual cell.','The number of parallel current paths.'],answer:0,explanation:'Series connection adds cell voltages; it also adds internal resistances.'},
{id:'D010',topic:'3.6',objective:'3.6-ohm',level:2,type:'calculation',source:'Module 3 notes',page:'88, 91',q:'A 24 V supply is connected across a 6 Ω resistor. What current flows through the resistor?',options:['0.25 A','4 A','144 A'],answer:1,explanation:'Ohm’s Law: I = V/R = 24/6 = 4 A.',working:'I = V/R = 24 V ÷ 6 Ω = 4 A'},
{id:'D011',topic:'3.5',objective:'3.5-battery-internal',level:2,type:'calculation',source:'Module 3 notes',page:'70–73',q:'A battery has an EMF of 28 V and an internal resistance of 0.5 Ω. What is its terminal voltage when delivering 8 A?',options:['24 V','28 V','32 V'],answer:0,explanation:'Vt = E − Ir = 28 − (8 × 0.5) = 24 V.',working:'Vt = E − Ir = 28 V − (8 A × 0.5 Ω) = 24 V'},
{id:'D012',topic:'3.7',objective:'3.7-parallel',level:2,type:'calculation',source:'Module 3 notes',page:'118–125',q:'Two resistors of 6 Ω and 3 Ω are connected in parallel. What is their combined resistance?',options:['9 Ω','4.5 Ω','2 Ω'],answer:2,explanation:'1/R = 1/6 + 1/3 = 1/2, so R = 2 Ω.',working:'1/R = 1/6 + 1/3 = 3/6 → R = 2 Ω'}
];
const SYLLABUS=[['3.1','Electron Theory',2,4],['3.2','Static Electricity and Conduction',2,4],['3.3','Electrical Terminology',2,4],['3.4','Generation of Electricity',1,3],['3.5','DC Sources of Electricity',2,4],['3.6','DC Circuits',2,3],['3.7','Resistance',2,2],['3.8','Power',1,2],['3.9','Capacitance',2,4],['3.10','Magnetism',2,4],['3.11','Inductance',2,3],['3.12','DC Motor / Generator Theory',2,3],['3.13','AC Theory',2,4],['3.14','Resistive, Capacitive and Inductive Circuits',2,4],['3.15','Transformers',2,3],['3.16','Filters',2,2],['3.17','AC Generators',2,3],['3.18','AC Motors',2,3]];
const STORAGE='m3trainer.v01';let state;try{state=JSON.parse(localStorage.getItem(STORAGE))||{}}catch{state={}};
state={history:[],packs:[],bookmarks:[],theme:'light',...state};let view='home',session=null,studyFilter='all',guideTab='formulas',fileInput;
const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){alert('Storage unavailable. Export a backup to protect your data.')}};
const allQ=()=>[...DEMO,...state.packs.flatMap(p=>p.questions)];const topics=()=>new Map(SYLLABUS.map(a=>[a[0],a[1]]));
function nav(id){view=id;session=null;render();scrollTo(0,0)}
function render(){document.documentElement.classList.toggle('dark',state.theme==='dark');$('sideNav').innerHTML=ITEMS.map(([id,ico,label])=>`<button class="navbtn ${view===id?'active':''}" onclick="nav('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('');$('bottomNav').innerHTML=ITEMS.filter(x=>['home','exams','calc','study','progress'].includes(x[0])).map(([id,ico,label])=>`<button class="footbtn ${view===id?'active':''}" onclick="nav('${id}')"><span>${ico}</span>${label.replace('Mock ','')}</button>`).join('');$('main').innerHTML=({home,exams,calc,study,progress,guides,settings})[view]();}
const hdr=(title,sub)=>`<div class="topbar"><div><div class="eyebrow">Module 03 · B2</div><h1 class="heading">${title}</h1><p class="subtitle">${sub}</p></div><span class="pill">● Offline ready</span></div>`;
const percentages=()=>{let h=state.history.filter(x=>x.mode==='mock'&&x.completed);return h.length?Math.round(h.reduce((a,b)=>a+b.score,0)/h.length):null};
function home(){let avg=percentages(),tested=new Set(state.history.flatMap(h=>h.responses.filter(r=>r.chosen!==null).map(r=>r.objective)));let obj=new Set(allQ().map(q=>q.objective));let cov=obj.size?Math.round(tested.size/obj.size*100):0;return hdr('Electrical Fundamentals','Your offline examination and revision workspace')+`<div class="metrics"><div class="card"><div class="kicker">Mock average</div><div class="metric">${avg??'—'}${avg===null?'':'%'}</div><span class="mini">${avg===null?'No full mocks completed':'Completed mock results'}</span></div><div class="card"><div class="kicker">Loaded-bank coverage</div><div class="metric">${cov}%</div><div class="progress"><i style="width:${cov}%"></i></div></div><div class="card"><div class="kicker">Sessions completed</div><div class="metric">${state.history.length}</div><span class="mini">Across all practice modes</span></div></div><h2 class="sectiontitle">Continue learning</h2><div class="actions">${[['exams','▤','Mock Exams','Exam-style papers and results'],['calc','▦','Calculations','Dedicated numerical questions'],['study','▧','Study Mode','Immediate explanations and feedback'],['guides','≡','Revision Guides','Formula and exam-day sheets'],['progress','▥','Progress','Scores, errors and topic coverage'],['settings','⚙','Question Packs','Import new QA-approved exams']].map(([id,ico,a,b])=>`<button class="action" onclick="nav('${id}')"><span class="actionicon">${ico}</span><span><strong>${a}</strong><small>${b}</small></span><span style="margin-left:auto;color:#8da1ba">›</span></button>`).join('')}</div><h2 class="sectiontitle">About this prototype</h2><div class="card softnote">The built-in ${DEMO.length} questions are <b>demonstration practice only</b>, based on selected pages of your Resource Group notes. They are not full QA-approved mock exams or a complete syllabus bank. The percentage above tracks the objectives currently loaded, not the entire 500-page syllabus. Import approved packs as we build them.</div>`}
function exams(){return hdr('Mock Exams','Full papers, source-backed practice and results')+`<div class="card"><h2 style="margin:0 0 9px">Demonstration paper</h2><p class="softnote">${DEMO.length} questions · untimed · for interface testing. This is not a 52-question, exam-weighted mock.</p><button class="btn" onclick="start('mock',DEMO.map(q=>q.id),'Demonstration Mock')">Start demo paper</button></div><h2 class="sectiontitle">Imported exam packs</h2><div class="card">${state.packs.length?state.packs.map(p=>`<div class="listitem"><div><b>${safe(p.title)}</b><div class="mini">${p.questions.length} questions · ${p.qaApproved?'QA declaration present':'QA not declared'}</div></div><button class="btn secondary" onclick="start('mock',${JSON.stringify(p.questions.map(q=>q.id)).replaceAll('"','&quot;')},'${safe(p.title).replaceAll("'",'&#39;')}')">Start</button></div>`).join(''):'<p class="softnote">No additional exams installed. Approved 52-question papers can be imported from Settings.</p>'}</div><h2 class="sectiontitle">Recent mock results</h2><div class="card">${state.history.filter(h=>h.mode==='mock').slice(0,5).map(h=>`<div class="listitem"><div><b>${safe(h.title)}</b><div class="mini">${safe(h.date)} · ${h.count} questions</div></div><b>${h.score}%</b></div>`).join('')||'<div class="empty">No exams completed yet.</div>'}</div>`}
function calc(){let ids=allQ().filter(q=>q.type==='calculation').map(q=>q.id);return hdr('Calculations','Formula practice and worked solutions')+`<div class="card"><div class="kicker">Available calculation questions</div><div class="metric">${ids.length}</div><p class="softnote">During practice you can check the answer immediately and reveal a worked solution. All calculation-only papers use their own question pool.</p><div class="btnrow"><button class="btn" ${ids.length?'':'disabled'} onclick="start('study',${JSON.stringify(ids).replaceAll('"','&quot;')},'Calculation Practice')">Start calculation practice</button><button class="btn secondary" onclick="nav('guides');guideTab='formulas';render()">Formula sheet</button></div></div><h2 class="sectiontitle">Formula example</h2><div class="sheet"><div class="formula">V = I × R</div>Voltage = current × resistance.<br><b>Example:</b> 24 V across 6 Ω gives I = 24 ÷ 6 = <b>4 A</b>.<p class="softnote">Resource Group notes: DC Circuits, pages 88–94.</p></div>`}
function study(){let opts=`<select class="field" onchange="studyFilter=this.value;render()"><option value="all">All topics</option>${SYLLABUS.map(t=>`<option value="${t[0]}" ${studyFilter===t[0]?'selected':''}>${t[0]} ${t[1]}</option>`).join('')}</select>`;let ids=allQ().filter(q=>studyFilter==='all'||q.topic===studyFilter).map(q=>q.id);let wrong=state.history.flatMap(h=>h.responses.filter(r=>r.chosen!==null&&!r.correct).map(r=>r.id));return hdr('Study Mode','Practise by topic or revisit incorrect answers')+`<div class="card"><div class="kicker">Choose a topic</div><div style="margin:13px 0">${opts}</div><p class="softnote">${ids.length} question(s) available for this selection. Feedback appears immediately after each answer.</p><div class="btnrow"><button class="btn" ${ids.length?'':'disabled'} onclick="start('study',${JSON.stringify(ids).replaceAll('"','&quot;')},'Study Practice')">Study these questions</button><button class="btn secondary" ${wrong.length?'':'disabled'} onclick="start('study',${JSON.stringify([...new Set(wrong)]).replaceAll('"','&quot;')},'Wrong-Answer Review')">Review wrong answers (${new Set(wrong).size})</button></div></div><h2 class="sectiontitle">Source coverage</h2><div class="card softnote">Topic selection uses the downloaded question packs. A topic with no questions is not yet covered. Our master syllabus matrix and validated full bank will be added in later builds.</div>`}
function start(mode,ids,title){const unique=[...new Set(ids)].filter(id=>allQ().some(q=>q.id===id));if(!unique.length)return;session={mode,ids:unique,title,i:0,answers:{},revealed:{},started:Date.now()};view='runner';renderRunner();scrollTo(0,0)}
function renderRunner(){const q=allQ().find(x=>x.id===session.ids[session.i]),i=session.i,picked=session.answers[q.id],show=session.mode==='study'&&session.revealed[q.id];document.querySelectorAll('.navbtn,.footbtn').forEach(x=>x.classList.remove('active'));$('main').innerHTML=`<div class="qbox"><div class="topbar"><button class="btn ghost" onclick="if(confirm('Leave this session? Unsaved answers will be lost.'))nav('exams')">‹ Exit</button><span class="tag">${session.mode==='mock'?'Exam mode':'Study mode'}</span></div><div class="card" style="margin-top:15px"><div class="qhead"><span>Question ${i+1} of ${session.ids.length}</span><span>${safe(session.title)}</span></div><div class="progress"><i style="width:${(i+1)/session.ids.length*100}%"></i></div><p class="question">${safe(q.q)}</p>${q.options.map((option,j)=>`<button class="answer ${picked===j?'selected':''} ${show&&j===q.answer?'correct':''} ${show&&picked===j&&picked!==q.answer?'wrong':''}" ${show?'disabled':''} onclick="choose(${j})"><span class="letter">${'ABC'[j]}</span><span>${safe(option)}</span></button>`).join('')}${show?`<div class="explain"><b>${picked===q.answer?'Correct':'Incorrect — answer '+ 'ABC'[q.answer]}</b><br>${safe(q.explanation)}${q.working?`<p><b>Working:</b> ${safe(q.working)}</p>`:''}<div class="meta">${safe(q.source)} · pages ${safe(q.page)} · Level ${q.level}</div></div>`:''}<div class="btnrow" style="justify-content:space-between;margin-top:26px"><button class="btn secondary" ${i===0?'disabled':''} onclick="move(-1)">‹ Previous</button>${session.mode==='study'&&!show?`<button class="btn secondary" ${picked===undefined?'disabled':''} onclick="reveal()">Check answer</button>`:''}${i===session.ids.length-1?`<button class="btn" onclick="finish()">Finish & mark</button>`:`<button class="btn" onclick="move(1)">Next ›</button>`}</div></div><p class="softnote" style="text-align:center">${session.mode==='mock'?'Answers are revealed only after submitting the paper.':'Check each answer to see its explanation.'}</p></div>`}
function choose(j){let q=allQ().find(x=>x.id===session.ids[session.i]);session.answers[q.id]=j;renderRunner()}function reveal(){let q=allQ().find(x=>x.id===session.ids[session.i]);if(session.answers[q.id]===undefined)return;session.revealed[q.id]=true;renderRunner()}function move(n){session.i=Math.max(0,Math.min(session.ids.length-1,session.i+n));renderRunner();scrollTo(0,0)}
function finish(){if(!session)return;let missing=session.ids.filter(id=>session.answers[id]===undefined).length;if(missing&&!confirm(`${missing} question(s) unanswered. Submit anyway?`))return;let qmap=new Map(allQ().map(q=>[q.id,q]));let responses=session.ids.map(id=>{let q=qmap.get(id),chosen=session.answers[id];return{id,objective:q.objective,topic:q.topic,chosen:chosen===undefined?null:chosen,correct:chosen===q.answer,expected:q.answer}});let score=Math.round(responses.filter(x=>x.correct).length/responses.length*100);let record={id:'R'+Date.now(),title:session.title,mode:session.mode,count:responses.length,score,date:new Date().toLocaleDateString('en-GB'),completed:true,responses};state.history.unshift(record);save();session=null;view='result';$('main').innerHTML=hdr('Results',record.title)+`<div class="card"><div class="kicker">Your score</div><div class="metric">${score}%</div><p>${responses.filter(x=>x.correct).length} of ${record.count} correct</p><div class="btnrow"><button class="btn" onclick="nav('exams')">Back to exams</button><button class="btn secondary" onclick="nav('progress')">See progress</button></div></div><h2 class="sectiontitle">Answer review</h2>${responses.map((r,i)=>{let q=qmap.get(r.id);return `<div class="card" style="margin-bottom:12px"><div class="meta">Question ${i+1} · ${safe(q.topic)} · pages ${safe(q.page)}</div><p><b>${safe(q.q)}</b></p><p class="softnote">Your answer: ${r.chosen===null?'Not answered':safe(q.options[r.chosen])}<br><b>Correct: ${safe(q.options[q.answer])}</b></p><div class="explain">${safe(q.explanation)}${q.working?`<br><b>Working:</b> ${safe(q.working)}`:''}</div></div>`}).join('')}`;scrollTo(0,0)}
function progress(){let h=state.history,wrong=h.flatMap(x=>x.responses.filter(r=>r.chosen!==null&&!r.correct));let attempts=h.flatMap(x=>x.responses);let pct=attempts.length?Math.round(attempts.filter(r=>r.correct).length/attempts.length*100):null;return hdr('Progress','Your study history and syllabus coverage')+`<div class="metrics"><div class="card"><div class="kicker">Questions attempted</div><div class="metric">${attempts.length}</div></div><div class="card"><div class="kicker">Answer accuracy</div><div class="metric">${pct===null?'—':pct+'%'}</div></div><div class="card"><div class="kicker">Incorrect responses</div><div class="metric">${wrong.length}</div></div></div><h2 class="sectiontitle">Topic tracking</h2><div class="card">${SYLLABUS.map(t=>{let a=attempts.filter(r=>r.topic===t[0]),n=allQ().filter(q=>q.topic===t[0]).length,rate=a.length?Math.round(a.filter(r=>r.correct).length/a.length*100):null;return`<div class="listitem"><div><b>${t[0]} · ${t[1]}</b><div class="mini">Level ${t[2]} · ${t[3]} question(s) in supplied B2 template · ${n} loaded practice items</div></div><span class="tag ${rate===null?'warn':rate>=80?'good':''}">${rate===null?'Not tested':rate+'% accuracy'}</span></div>`}).join('')}</div><h2 class="sectiontitle">Previous sessions</h2><div class="card">${h.length?h.map(x=>`<div class="listitem"><div><b>${safe(x.title)}</b><div class="mini">${safe(x.date)} · ${x.count} questions</div></div><b>${x.score}%</b></div>`).join(''):'<div class="empty">Your results will appear here after completing a session.</div>'}</div>`}
function guides(){let tabs=[['formulas','Formula Sheet'],['examday','Exam-Day Sheet'],['topics','Topic Overview']];return hdr('Revision Guides','Offline reference sheets and exam preparation')+`<div class="btnrow" style="margin-bottom:20px">${tabs.map(t=>`<button class="btn ${guideTab===t[0]?'':'secondary'}" onclick="guideTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${guideTab==='formulas'?`<div class="sheet"><h2>Essential DC formulas</h2><div class="formula">V = I × R</div>Ohm's Law: voltage (V), current (A), resistance (Ω).<div class="formula">P = V × I</div>Electrical power in watts.<div class="formula">Q = I × t</div>Charge in coulombs; time in seconds.<div class="formula">G = 1 / R</div>Conductance in siemens.<div class="formula">R = ρL / A</div>Resistivity, length and cross-sectional area.<div class="formula">V<sub>t</sub> = E − I r</div>Terminal voltage considering internal resistance.<p class="softnote">Core relationships from Resource Group notes, pages 31–41, 70–73, 88–106. This is an initial short sheet, not the complete Module 3 formula library.</p></div>`:guideTab==='examday'?`<div class="sheet"><h2>Quick revision checklist</h2><p>□ Conventional current direction vs electron flow<br>□ Current, voltage, resistance, conductance and power units<br>□ Series versus parallel rules<br>□ Kirchhoff's Current and Voltage Laws<br>□ Batteries: EMF, terminal voltage and internal resistance<br>□ NTC versus PTC characteristics<br>□ Ohm's Law and formula rearrangement<br>□ Keep units consistent before calculating</p><p class="softnote">Initial demonstration sheet. The full day-of-exam pack will be authored and QA-checked against the complete notes.</p></div>`:`<div class="sheet"><h2>B2 Module 3 syllabus</h2>${SYLLABUS.map(t=>`<div class="listitem"><span>${t[0]} · ${t[1]}</span><span class="tag">Level ${t[2]}</span></div>`).join('')}<p class="softnote">Topic grouping and levels transcribed from the supplied Resource Group examination breakdown, page 8. The complete objective-level matrix is still to be built.</p></div>`}<button class="btn secondary" onclick="print()">Print this guide</button>`}
const normalized=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function checkPack(pack){let problems=[],incoming=pack?.questions;if(!Array.isArray(incoming)||!incoming.length)return ['Missing questions array.'];let old=allQ(),ids=new Set(old.map(q=>q.id)),stems=new Set(old.map(q=>normalized(q.q))),objectiveText=new Set(old.map(q=>q.objective+'|'+normalized(q.q)));for(let i=0;i<incoming.length;i++){let q=incoming[i],label=`Question ${i+1}`;if(!q||typeof q!=='object'){problems.push(`${label}: invalid record`);continue}if(!q.id||ids.has(q.id))problems.push(`${label}: duplicate/missing ID`);ids.add(q.id);if(!q.q||stems.has(normalized(q.q)))problems.push(`${label}: duplicate/missing question text`);stems.add(normalized(q.q));if(!Array.isArray(q.options)||q.options.length!==3||q.options.some(x=>!String(x).trim())||new Set(q.options.map(normalized)).size!==3)problems.push(`${label}: requires 3 distinct options`);if(!Number.isInteger(q.answer)||q.answer<0||q.answer>2)problems.push(`${label}: answer index must be 0, 1 or 2`);if(!q.source||!q.page||!q.explanation||!q.objective||!q.topic||!['definition','technical','scenario','calculation'].includes(q.type)||![1,2].includes(q.level))problems.push(`${label}: missing/invalid metadata`);if(q.type==='calculation'&&!q.working)problems.push(`${label}: missing calculation working`);if(!SYLLABUS.some(t=>t[0]===q.topic))problems.push(`${label}: unknown syllabus topic`)}if(pack.kind==='full-mock'&&incoming.length!==52)problems.push('Full mock must have exactly 52 questions.');return problems}
function importPack(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let pack=JSON.parse(reader.result),errors=checkPack(pack);if(errors.length){alert('Structural check failed:\n'+errors.slice(0,12).join('\n'));return}if(!confirm(`${pack.questions.length} unique questions passed STRUCTURAL checks. This does not verify source facts, syllabus weighting or semantic duplicates. Confirm you have separately completed the manual QA checklist before importing?`))return;state.packs.push({title:pack.title||file.name,questions:pack.questions,qaApproved:!!pack.qaApproved});save();render();alert('Pack imported.')}catch(e){alert('Invalid pack JSON: '+e.message)}};reader.readAsText(file);input.value=''}
function backup(){let data=JSON.stringify({version:1,savedAt:new Date().toISOString(),state},null,2);download('module3-backup.json',data,'application/json')}
function download(name,data,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type:mime}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restore(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!obj.state||!Array.isArray(obj.state.history)||!Array.isArray(obj.state.packs))throw Error('Not a valid backup');if(!confirm('Replace ALL current progress and imported packs with this backup?'))return;state=obj.state;save();render();alert('Backup restored')}catch(e){alert(e.message)}};reader.readAsText(file);input.value=''}
function settings(){return hdr('Settings','Offline content, appearance and data management')+`<div class="card"><h2 style="margin-top:0">Appearance</h2><div class="listitem"><span>Dark mode</span><button class="btn secondary" onclick="state.theme=state.theme==='dark'?'light':'dark';save();render()">${state.theme==='dark'?'Switch to light':'Switch to dark'}</button></div><h2>Question packs</h2><p class="softnote">Import a JSON pack after external editorial QA. The app automatically checks the required fields, exact duplicate wording, IDs and option counts; it <b>cannot verify factual correctness or semantic paraphrases</b>. Cross-exam novelty must also be checked against the master register before pack publication.</p><input aria-label="Import question pack" type="file" accept=".json,application/json" onchange="importPack(this)"><p class="mini">Current bank: ${allQ().length} questions (${DEMO.length} demonstration + ${allQ().length-DEMO.length} imported).</p><h2>Data backups</h2><div class="btnrow"><button class="btn secondary" onclick="backup()">Export backup</button><label class="btn secondary" style="cursor:pointer">Restore backup <input style="display:none" type="file" accept=".json" onchange="restore(this)"></label></div><p class="softnote">Results are saved to this browser's local storage. Export regularly, especially before reinstalling or clearing browsing data.</p><h2>Offline installation</h2><p class="softnote">The standalone HTML works without internet when opened locally on a computer. To install as an iPad/iPhone Home Screen PWA, publish the complete folder over HTTPS (for example GitHub Pages), open while online, and allow the files to cache before using aeroplane mode. iOS storage may still be cleared by the operating system: keep backups.</p></div>`}
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline cache registration failed:',e)))}
</script></body></html>
