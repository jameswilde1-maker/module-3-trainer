ap": "Parallel capacitors share voltage; total capacitance increases.", "keywords": ["parallel"]}, {"topic": "3.9", "id": "capvolts", "title": "Series capacitor voltage division", "page": "177,190–191", "formulas": ["Q = CtVtotal", "Vi = Q/Ci", "V₁ = Vtotal C₂/(C₁+C₂) (two)"], "units": "Q (C), C (F), V (V)", "method": "Initially uncharged series capacitors carry equal charge. Find Ct then Q then each voltage.", "example": "9 µF and 27 µF across 40 V: V9=40×27/36=30 V.", "trap": "Smaller capacitance receives larger voltage.", "keywords": ["voltage-split", "series-voltage"]}, {"topic": "3.9", "id": "capcolour", "title": "Capacitor colour values and voltage rating", "page": "173,186–187", "formulas": ["C(pF) = digits × multiplier", "Cmax/min = C(1 ± tol)", "Recommended voltage rating ≥ 2 × working V"], "units": "C (pF), tol decimal, voltage (V)", "method": "Use capacitor-specific multiplier/tolerance table from page 187; the first two bands are digits.", "example": "Red-violet-orange-green = 27×1000 pF = 27 nF ±5%. For 32 V working choose ≥64 V.", "trap": "Capacitors are coded in pF, not Ω. The voltage rule is a recommendation from the notes.", "keywords": ["colour", "rating-rule"]}, {"topic": "3.9", "id": "rc", "title": "RC time constant", "page": "194–196", "formulas": ["τ = RC", "R = τ/C", "C = τ/R", "tpractical ≈ 5τ"], "units": "τ,t (s), R (Ω), C (F)", "method": "Convert kΩ to Ω and µF to F; multiply; five time constants for practical full charge/discharge.", "example": "15 kΩ × 220 µF = 3.3 s; 5τ ≈16.5 s.", "trap": "RC has seconds as unit; practical full charge is not mathematically 100%.", "keywords": ["rc", "time-constant", "practical-charge"]}, {"topic": "3.9", "id": "rccharge", "title": "RC charging and discharging", "page": "194–196", "formulas": ["Vc at 1τ ≈ 0.63Vs (charging)", "Vc at 1τ ≈ 0.37Vinitial (discharging)", "I at 1τ ≈ 0.37I₀", "I at 2τ ≈ 0.14I₀", "I₀ = Vs/R", "I = (Vs−Vc)/R (charging)"], "units": "V (V), I (A), R (Ω)", "method": "Identify charging or discharging; apply the notes’ rounded percentage to the initial/final magnitude.", "example": "42 V charging: after one τ, Vc≈26.46 V; 90 V discharging: 33.3 V remains.", "trap": "63% charged is not 63% remaining during discharge.", "keywords": ["charge-voltage", "discharge-voltage", "initial-charge", "charging-instant", "two-tau"]}, {"topic": "3.10", "id": "mmf", "title": "Magnetomotive force", "page": "239", "formulas": ["F = NI", "N = F/I", "I = F/N"], "units": "F (ampere-turns), N turns, I (A)", "method": "Multiply turns by coil current.", "example": "600 turns × 2 A = 1200 At.", "trap": "Ampere-turns are not newtons.", "keywords": ["mmf"]}, {"topic": "3.10", "id": "field", "title": "Magnetic field strength", "page": "239–240", "formulas": ["H = NI/l = F/l", "l = NI/H", "I = Hl/N", "N = Hl/I"], "units": "H (At/m), l (m), N turns, I (A)", "method": "Convert magnetic path length to metres; divide MMF by length.", "example": "500 turns, 1.5 A, 0.5 m: H=1500 At/m.", "trap": "Length is magnetic path length, not coil wire length.", "keywords": ["calc-h", "magnetic-length"]}, {"topic": "3.10", "id": "flux", "title": "Magnetic flux and flux density", "page": "241", "formulas": ["Φ = BA", "B = Φ/A", "A = Φ/B"], "units": "Φ (Wb), B (T), A (m²)", "method": "Use area perpendicular to field and convert cm² to m².", "example": "0.006 Wb through 0.003 m² gives 2 T.", "trap": "1 cm² = 10⁻⁴ m².", "keywords": ["flux"]}, {"topic": "3.10", "id": "permeability", "title": "Magnetic permeability", "page": "241,250", "formulas": ["μ = B/H", "B = μH", "H = B/μ", "μ = μ₀μr", "μr = μ/μ₀"], "units": "μ (H/m), B (T), H (A/m), μ₀≈1.257×10⁻⁶ H/m", "method": "Use the given absolute permeability or calculate it from relative permeability.", "example": "0.8 T / 400 A/m = 0.002 H/m.", "trap": "Relative permeability is dimensionless; absolute permeability is not.", "keywords": ["permeability"]}, {"topic": "3.10", "id": "reluctance", "title": "Magnetic reluctance", "page": "251", "formulas": ["ℜ = F/Φ", "Φ = F/ℜ", "F = ℜΦ", "ℜ = l/(μA) (uniform linear path)"], "units": "ℜ (At/Wb), F (At), Φ (Wb), l (m), μ (H/m), A (m²)", "method": "Divide MMF by flux; geometry relationship assumes uniform permeability.", "example": "200 At / 0.004 Wb = 50,000 At/Wb.", "trap": "Larger cross-section reduces reluctance; material saturation complicates linear formula.", "keywords": ["reluctance"]}, {"topic": "3.11", "id": "faraday", "title": "Induced EMF and flux change", "page": "267", "formulas": ["E magnitude = N×|ΔΦ|/Δt", "N = EΔt/|ΔΦ|", "Δt = N|ΔΦ|/E"], "units": "E (V), N turns, Φ (Wb), t (s)", "method": "Use flux change per turn and change time; negative sign in Faraday’s law indicates Lenz direction.", "example": "100 turns, 0.002 Wb change in 0.05 s: E=4 V.", "trap": "Number of turns multiplies induced EMF; direction opposes change.", "keywords": ["induction-turns", "faraday"]}, {"topic": "3.11", "id": "mutual", "title": "Mutual induction", "page": "275–276", "formulas": ["E₂ = −M ΔI₁/Δt", "|M| = |E₂|Δt/|ΔI₁|", "M = μAN₁N₂/l (closely coupled geometry)"], "units": "M (H), E (V), ΔI (A), Δt (s), μ (H/m), A (m²), l (m)", "method": "Calculate rate of primary current change; multiply by mutual inductance for magnitude.", "example": "0.4 H × 20 A/s = 8 V.", "trap": "The minus sign is direction, not negative magnitude. Geometry relation requires close common coupling.", "keywords": ["mutual", "secondary-change"]}, {"topic": "3.11", "id": "self", "title": "Self-induction and coil inductance", "page": "281", "formulas": ["E = −L ΔI/Δt", "L = |E|Δt/|ΔI|", "L = μAN²/l", "N = √(Ll/(μA))", "l = μAN²/L"], "units": "L (H), μ (H/m), A (m²), N turns, l (m)", "method": "For EMF use current change per second; for geometry use square of turns.", "example": "0.25 H × 12 A/s gives 3 V; doubling turns gives four times inductance.", "trap": "Increasing coil length decreases L at fixed N, area and μ.", "keywords": ["self-emf", "inductance-from", "coil", "inductance"]}, {"topic": "3.12", "id": "shaft", "title": "DC motor output power and speed", "page": "307", "formulas": ["P = Tω", "T = P/ω", "ω = P/T", "hp = P(W)/746", "ω = 2πn/60"], "units": "P (W), T (N·m), ω (rad/s), n (rpm)", "method": "If given rpm, convert to rad/s; multiply torque by angular speed.", "example": "5 N·m at 20 rad/s gives 100 W.", "trap": "Do not use rpm directly in P=Tω.", "keywords": ["shaft-power", "torque-conversion", "power-angular"]}, {"topic": "3.12", "id": "torque", "title": "DC motor torque constant", "page": "308", "formulas": ["T = kI", "I = T/k", "k = T/I"], "units": "T (N·m), k (N·m/A), I (A)", "method": "Use constant for motor and armature current.", "example": "k=0.4 N·m/A, I=15 A: T=6 N·m.", "trap": "Assumes constant field/torque constant.", "keywords": ["torque-current", "torque-double"]}, {"topic": "3.13", "id": "period", "title": "Frequency and period", "page": "329", "formulas": ["f = 1/T", "T = 1/f"], "units": "f (Hz), T (s)", "method": "Convert time to seconds before taking reciprocal.", "example": "400 Hz gives T=1/400=0.0025 s=2.5 ms.", "trap": "Frequency is cycles per second, not angular frequency.", "keywords": ["period", "frequency-from"]}, {"topic": "3.13", "id": "sine", "title": "Instantaneous sinusoidal value", "page": "333,337,343,459", "formulas": ["v = Vpk sin θ", "θ = 2πft (rad)", "ω = 2πf", "v = Vpk sin(2πft)"], "units": "v,Vpk (V), f (Hz), t (s), θ (rad or degrees)", "method": "Set calculator angle mode correctly; multiply peak by sine of angle.", "example": "200 V peak at 30°: v=200×0.5=100 V.", "trap": "At 270° sine is −1; RMS is not peak.", "keywords": ["instantaneous", "sine"]}, {"topic": "3.13", "id": "rms", "title": "RMS, peak and peak-to-peak", "page": "335,338", "formulas": ["Vrms = Vpk/√2", "Vpk = √2 Vrms", "Vpp = 2Vpk", "Vrms = Vpp/(2√2)"], "units": "V (V); same relations for current of a pure sine", "method": "Identify which amplitude is given, apply matching conversion.", "example": "115 V RMS gives peak 162.63 V, peak-to-peak 325.27 V.", "trap": "Only use √2 conversion for sinusoidal waveforms.", "keywords": ["rms", "peak"]}, {"topic": "3.13", "id": "average", "title": "Mean of a sine wave", "page": "334", "formulas": ["Vavg half-cycle = 2Vpk/π", "Vpk = πVavg/2", "Signed mean over full cycle = 0"], "units": "V (V); applies equally to current", "method": "Use half-cycle/rectified average only when asked.", "example": "10 A peak gives half-cycle average 6.366 A.", "trap": "Full signed cycle average is zero, unlike RMS.", "keywords": ["average-half"]}, {"topic": "3.13", "id": "star", "title": "Three-phase star (wye)", "page": "349,436,473", "formulas": ["VL = √3 Vph", "Vph = VL/√3", "IL = Iph"], "units": "VL line-line voltage (V), Vph line-neutral (V), I (A)", "method": "Multiply phase voltage by √3 for balanced star; current unchanged.", "example": "115 V phase → 199.19 V line ≈200 V.", "trap": "Do not multiply both voltage and current by √3.", "keywords": ["star", "line-voltage"]}, {"topic": "3.13", "id": "delta", "title": "Three-phase delta", "page": "350,436,475", "formulas": ["VL = Vph", "IL = √3 Iph", "Iph = IL/√3"], "units": "V (V), I (A)", "method": "For balanced delta, voltage is unchanged; multiply phase current by √3.", "example": "20 A phase →34.64 A line.", "trap": "Star and delta use √3 on different quantities.", "keywords": ["delta", "line-current"]}, {"topic": "3.14", "id": "xl", "title": "Inductive reactance", "page": "358", "formulas": ["XL = 2πfL", "f = XL/(2πL)", "L = XL/(2πf)"], "units": "XL (Ω), f (Hz), L (H)", "method": "Convert mH to H; multiply by 2π and frequency.", "example": "50 Hz, 0.1 H gives XL=31.4 Ω.", "trap": "XL increases with frequency; current lags voltage.", "keywords": ["xl", "inductive-reactance"]}, {"topic": "3.14", "id": "xc", "title": "Capacitive reactance", "page": "360–361", "formulas": ["XC = 1/(2πfC)", "f = 1/(2πXC C)", "C = 1/(2πfXC)"], "units": "XC (Ω), f (Hz), C (F)", "method": "Convert µF to F; multiply denominator then take reciprocal.", "example": "50 Hz, 100 µF: XC≈31.8 Ω.", "trap": "XC decreases with frequency; current leads voltage.", "keywords": ["xc", "capacitive-reactance"]}, {"topic": "3.14", "id": "resonance", "title": "LC resonant frequency (derived)", "page": "358,360–361,455", "formulas": ["XL = XC", "f₀ = 1/(2π√(LC))", "L = 1/((2πf₀)²C)", "C = 1/((2πf₀)²L)"], "units": "f₀ (Hz), L (H), C (F)", "method": "Equate XL and XC, rearrange to solve for frequency; convert components to base units.", "example": "L=0.01 H, C=1 µF: f₀=1/(2π√(0.01×10⁻⁶))≈1591.55 Hz.", "trap": "Derived from the notes’ reactance equations and resonance condition; not a separate quoted source formula.", "keywords": ["resonance"]}, {"topic": "3.14", "id": "acohm", "title": "AC Ohm's law and impedance", "page": "355,372", "formulas": ["V = IZ", "I = V/Z", "Z = V/I"], "units": "V (V RMS), I (A RMS), Z (Ω)", "method": "Use total impedance rather than resistance for non-resistive circuit.", "example": "120 V RMS / 4 A RMS = 30 Ω.", "trap": "Do not mix peak and RMS in one calculation.", "keywords": ["ac-resistor", "z-from"]}, {"topic": "3.14", "id": "rlc", "title": "Series RLC impedance", "page": "378–390", "formulas": ["X = XL−XC", "Z = √(R²+X²)", "R = √(Z²−X²)", "|X| = √(Z²−R²)"], "units": "R, XL, XC, Z (Ω)", "method": "Subtract capacitive from inductive reactance, square, add R², take root.", "example": "R=5 Ω, XL=16 Ω, XC=4 Ω: Z=√(25+144)=13 Ω.", "trap": "At resonance XL=XC so Z=R in series; retain sign for lag/lead.", "keywords": ["impedance", "net-reactance", "series-z"]}, {"topic": "3.14", "id": "phasor", "title": "AC voltage and current phasors", "page": "376–394", "formulas": ["V = √(VR²+(VL−VC)²)", "Iparallel = √(IR²+(IC−IL)²)"], "units": "V (V RMS), I (A RMS)", "method": "In series use voltage phasors; parallel use current phasors. Subtract opposing reactive components first.", "example": "Series VR=30 V, VL=40 V gives V=50 V; parallel IR=3 A, IC=4 A gives 5 A.", "trap": "Do not add reactive and resistive magnitudes arithmetically.", "keywords": ["voltage-vector", "parallel-current", "parallel-reactive"]}, {"topic": "3.14", "id": "phase", "title": "Phase angle", "page": "379,396", "formulas": ["tan φ = (XL−XC)/R (series)", "φ = atan((XL−XC)/R)", "cos φ = R/Z (series)"], "units": "φ (degrees or rad), R,X,Z (Ω)", "method": "Use signed net reactance and inverse tangent; check lead/lag.", "example": "40 V inductive and 30 V resistive: φ=atan(40/30)=53.1° lagging current.", "trap": "Positive net inductive reactance means current lags.", "keywords": ["phase-angle"]}, {"topic": "3.14", "id": "powers", "title": "AC power and power factor", "page": "363–364,396,400–401", "formulas": ["S = VI", "P = S cos φ = VI cos φ", "Q = S sin φ", "PF = P/S = cos φ", "S = √(P²+Q²)", "P = √(S²−Q²)", "|Q| = √(S²−P²)"], "units": "S (VA), P (W), Q (VAr), V/I RMS, PF dimensionless", "method": "Identify apparent, real and reactive quantities; apply triangle or trigonometry.", "example": "S=500 VA, P=300 W: Q=400 VAr, PF=0.6.", "trap": "Reactive power is not watts; don't add P and Q arithmetically.", "keywords": ["apparent-power", "power-factor", "reactive-power"]}, {"topic": "3.15", "id": "ratio", "title": "Transformer turns, voltage and current ratio", "page": "413–414,425–426", "formulas": ["Np/Ns = Vp/Vs = Is/Ip", "Vs = VpNs/Np", "Np = NsVp/Vs", "Ip = IsNs/Np", "Is = IpNp/Ns"], "units": "N turns, V (V RMS), I (A RMS)", "method": "Use ideal transformer assumption; voltage follows turns, current inversely follows turns.", "example": "230 V, Np=500, Ns=100: Vs=46 V; if Is=5 A then Ip=1 A.", "trap": "Current ratio is inverted relative to voltage ratio.", "keywords": ["ratio", "turns", "current-ratio"]}, {"topic": "3.15", "id": "ideal", "title": "Ideal transformer power and losses", "page": "413,420,439", "formulas": ["VpIp = VsIs (ideal VA)", "Ip = VsIs/Vp", "Loss = Pin−Pout"], "units": "V (V RMS), I (A RMS), P (W real), S (VA)", "method": "For ideal power/VA use voltage times current; real loss uses real input and output power.", "example": "24 V × 5 A secondary=120 VA; at 240 V primary, Ip=0.5 A.", "trap": "Real transformer losses reduce output real power.", "keywords": ["power-ideal", "loss"]}, {"topic": "3.15", "id": "efficiency", "title": "Transformer efficiency", "page": "420", "formulas": ["η% = 100Pout/Pin", "Pout = Pinη%/100", "Pin = 100Pout/η%", "Loss = Pin−Pout"], "units": "P (W), η (%)", "method": "Use real power in and out; convert percent to decimal if multiplying.", "example": "720 W output at 90% efficiency requires 800 W input; loss=80 W.", "trap": "Efficiency cannot exceed 100%; do not divide by 90 instead of 0.90.", "keywords": ["efficiency", "loss-calc"]}, {"topic": "3.15", "id": "no-load", "title": "No-load transformer current", "page": "415–416", "formulas": ["I₀ = √(Ic²+Im²)", "Ic = I₀ cos φ", "Im = I₀ sin φ"], "units": "I (A), Ic core loss/in-phase, Im magnetising/quadrature", "method": "Treat perpendicular components as phasors.", "example": "3 A in-phase and 4 A quadrature: I₀=5 A.", "trap": "Add squares, not current magnitudes.", "keywords": ["no-load"]}, {"topic": "3.15", "id": "impedance", "title": "Transformer impedance matching", "page": "426–427", "formulas": ["Zp/Zs = (Np/Ns)²", "Np/Ns = √(Zp/Zs)", "Zp = Zs(Np/Ns)²", "Zs = Zp(Ns/Np)²"], "units": "Z (Ω), N turns", "method": "Square turns ratio to reflect impedance (ideal transformer).", "example": "20,000 Ω versus 200 Ω: turns ratio √100=10:1.", "trap": "Do not use a linear impedance ratio.", "keywords": ["impedance"]}, {"topic": "3.15", "id": "rating", "title": "Transformer VA rating and three-phase power", "page": "435–436", "formulas": ["S₁φ = VI", "S₃φ = √3 VL IL", "P₃φ = √3 VL IL PF", "Srating = Sload/0.8 (notes' recommendation)"], "units": "S (VA), P (W), V (V), I (A), PF", "method": "Choose single or balanced three-phase relationship. Convert VA to kVA by /1000.", "example": "115 V ×100 A=11.5 kVA; rating at 80% loading=14.375 kVA.", "trap": "Use line values in √3 formula. Select an available rating above the calculated minimum.", "keywords": ["kva", "derating", "threephase-power"]}, {"topic": "3.16", "id": "bandwidth", "title": "Filter bandwidth and resonance", "page": "455", "formulas": ["BW = fhigh−flow", "fhigh = flow+BW", "flow = fhigh−BW", "XL = XC at resonance"], "units": "f, BW (Hz or matching prefix)", "method": "Subtract lower cutoff from upper cutoff; notes define amplitude cutoff as 70.7% peak.", "example": "89.3−88.9 MHz=0.4 MHz=400 kHz.", "trap": "Bandwidth is the difference, not the centre frequency.", "keywords": ["bandwidth"]}, {"topic": "3.17", "id": "genstar", "title": "AC generator star/delta and sinusoid", "page": "459,473–475", "formulas": ["Star: VL = √3Vph; IL = Iph", "Delta: VL = Vph; IL = √3Iph", "v = Vpk sin(2πft)"], "units": "V (V), I (A), f (Hz), t (s)", "method": "Identify winding configuration and use matching relation.", "example": "Star 115 V phase gives 199.2 V line; delta 20 A phase gives 34.64 A line.", "trap": "Use phase-to-phase vs phase-to-neutral correctly.", "keywords": ["star", "delta", "sine"]}, {"topic": "3.18", "id": "speed", "title": "AC motor synchronous speed", "page": "496–497", "formulas": ["Ns = 120f/p", "f = Nsp/120", "p = 120f/Ns"], "units": "Ns (rpm), f (Hz), p total poles", "method": "Use total number of poles, not pole pairs.", "example": "400 Hz six-pole motor: Ns=120×400/6=8000 rpm.", "trap": "Induction rotor speed is below synchronous speed when motoring.", "keywords": ["speed-sixpole", "speed", "slip"]}, {"topic": "3.18", "id": "slip", "title": "Induction motor slip", "page": "496–497", "formulas": ["Slip rpm = Ns−Nr", "Slip% = 100(Ns−Nr)/Ns", "Nr = Ns(1−Slip%/100)"], "units": "Ns,Nr (rpm), slip (%)", "method": "Find synchronous speed first; subtract actual speed; divide by synchronous speed for percentage.", "example": "1500 rpm synchronous, 1440 rpm rotor: slip 60 rpm, 4%.", "trap": "Divide by synchronous speed, not actual rotor speed.", "keywords": ["slip"]}, {"topic": "3.18", "id": "switch", "title": "Centrifugal switch speed", "page": "507", "formulas": ["Nswitch ≈ 0.75 Nreference (when 75% is specified)"], "units": "N (rpm)", "method": "Multiply specified reference speed by stated switch percentage.", "example": "75% of 1600 rpm = 1200 rpm.", "trap": "Use the reference speed specified in the question, not an assumed universal rpm.", "keywords": ["switch-speed"]}];
let formulaQuery='',formulaTopic='all',formulaMode='library',formulaOnlyFavourites=false,formulaOpen=new Set();
function formulaFavourites(){return Array.isArray(state.formulaFavourites)?state.formulaFavourites:[]}
function toggleFormulaFavourite(id){let list=formulaFavourites();state.formulaFavourites=list.includes(id)?list.filter(x=>x!==id):[...list,id];save();renderFormulaResults()}
function formulaQuestions(f){const all=allQ().filter(q=>q.type==='calculation');return all.filter(q=>q.topic.replace(/[ab]$/,'')===f.topic&&f.keywords.some(k=>String(q.objective||'').toLowerCase().includes(k.toLowerCase())))}

;if(full&&(mockIds.has(q.id)||mockStems.has(stem)))errors.push(`${label}: question already used in another full mock`);if(!Array.isArray(q.options)||q.options.length!==3||q.options.some(x=>typeof x!=='string'||!x.trim())||new Set(q.options.map(normalized)).size!==3)errors.push(`${label}: requires 3 distinct options`);if(!Number.isInteger(q.answer)||q.answer<0||q.answer>2)errors.push(`${label}: invalid answer index`);if(!q.source||!q.page||!q.explanation||!q.objective||!q.topic||!['definition','technical','scenario','calculation'].includes(q.type)||![1,2].includes(q.level))errors.push(`${label}: missing/invalid metadata`);if(calcPaper&&q.type!=='calculation')errors.push(`${label}: calculation paper requires numerical questions`);if(q.type==='calculation'&&!q.working)errors.push(`${label}: missing calculation working`);if(!SYLLABUS.some(t=>t[0]===q.topic.replace(/[ab]$/,'')))errors.push(`${label}: unknown syllabus topic`);if(full){const sub=q.blueprintSubsection;if(!Object.hasOwn(BLUEPRINT,sub)||q.topic!==sub.replace(/[ab]$/,''))errors.push(`${label}: invalid blueprint subsection`);else{counts[sub]=(counts[sub]||0)+1;if(q.level!==(['3.1','3.4','3.7b','3.16'].includes(sub)?1:2))errors.push(`${label}: incorrect knowledge level`)}}}if(full)for(const [sub,n] of Object.entries(BLUEPRINT))if(counts[sub]!==n)errors.push(`${sub}: expected ${n}, got ${counts[sub]||0}`);return errors}

const UNIT_PREFIXES=[['giga','G','10⁹','1 GW = 1,000,000,000 W'],['mega','M','10⁶','1 MΩ = 1,000,000 Ω'],['kilo','k','10³','1 kΩ = 1,000 Ω'],['milli','m','10⁻³','1 mA = 0.001 A'],['micro','μ / µ','10⁻⁶','1 µF = 0.000001 F'],['nano','n','10⁻⁹','1 nF = 0.000000001 F'],['pico','p','10⁻¹²','1 pF = 0.000000000001 F']];
let formulaReferenceTab='formulas',unitQuery='',unitGroup='all';
function unitNorm(s){return String(s).normalize('NFKC').replaceAll('μ','u').replaceAll('µ','u').replaceAll('Ω','ohm').replaceAll('ω','omega').toLowerCase().trim()}
function filteredUnits(){let query=unitNorm(unitQuery);return UNIT_ROWS.filter(r=>(unitGroup==='all'||r[0]===unitGroup)&&(!query||(query.length===1?unitNorm(r[2]+' '+r[4]).split(/[\s,\/()·]+/).includes(query):unitNorm(r.join(' ')).includes(query)))).sort((a,b)=>a[1].localeCompare(b[1]))}
function unitResults(){let rows=filteredUnits(),query=unitNorm(unitQuery),prefixes=UNIT_PREFIXES.filter(r=>!query||unitNorm(r.join(' ')).includes(query));return `${rows.length?rows.map(r=>`<details class="card unit-entry"><summary><span class="unit-measure"><b>${safe(r[4])}</b><span>${safe(r[3])}</span></span><span class="unit-name"><b>${safe(r[1])}</b><span class="mini">Formula symbol: ${safe(r[2])}</span></span><span class="unit-expand">⌄</span></summary><div class="unit-body"><p><b>What it measures</b><br>${safe(r[5])}</p><p class="unit-equation">${safe(r[6])}</p><p><b>Remember:</b> ${safe(r[7])}</p><p class="mini">Original notes · PDF ${safe(r[8])}</p>${noteButtons(r[8])}</div></details>`).join(''):'<div class="card softnote">No matching quantities.</div>'}${unitGroup==='all'&&prefixes.length?`<h2 class="sectiontitle">SI prefixes</h2><div class="card">${prefixes.map(r=>`<div class="listitem"><div><b>${safe(r[0])} (${safe(r[1])})</b><div class="mini">${safe(r[3])}</div></div><b>${safe(r[2])}</b></div>`).join('')}<p class="softnote">Uppercase M = mega; lowercase m = milli. Prefixes multiply the unit, not the quantity symbol.</p>${noteButtons('31')}</div>`:''}`}
function refreshUnits(){const el=$('unitResults');if(el)el.innerHTML=unitResults();const count=$('unitCount');if(count)count.textContent=filteredUnits().length+' matching quantities'}
function unitPanel(){return `<div class="card"><p class="softnote">What electrical quantities and their units actually mean. Search by name, symbol or unit; expand any entry for a definition, formula, memory aid and notes link.</p><input type="search" class="field" aria-label="Search symbols and units" placeholder="Search e.g. farad, Q, ohm…" value="${safe(unitQuery)}" oninput="unitQuery=this.value;refreshUnits()" style="width:100%;margin-bottom:10px"><select class="field" aria-label="Quantity category" onchange="unitGroup=this.value;refreshUnits()"><option value="all">All categories</option>${[...new Set(UNIT_ROWS.map(r=>r[0]))].map(g=>`<option ${unitGroup===g?'selected':''} value="${safe(g)}">${safe(g)}</option>`).join('')}</select><p class="mini" id="unitCount">${filteredUnits().length} matching quantities</p><p class="softnote">Formula symbols can have different meanings in different contexts; unit symbols are case-sensitive. For example, C can mean capacitance in an equation or coulomb as a unit.</p></div><div id="unitResults" style="margin-top:12px">${unitResults()}</div>`}
function referencePanel(){return `<h2 class="sectiontitle" id="referenceTop">Reference library</h2><div class="btnrow" style="margin-bottom:14px"><button class="btn ${formulaReferenceTab==='formulas'?'':'secondary'}" onclick="formulaReferenceTab='formulas';render();$('referenceTop').scrollIntoView()">Formula Library</button><button class="btn ${formulaReferenceTab==='units'?'':'secondary'}" onclick="formulaReferenceTab='units';render();$('referenceTop').scrollIntoView()">Symbols &amp; Units</button></div>${formulaReferenceTab==='units'?unitPanel():formulaPanel()}`}

const REVISION_TOPICS=[["3.1", "Electron theory", "2–10", ["Proton +, neutron neutral (both in nucleus); electron − in shells. Neutral atom: equal protons and electrons. Almost all mass is in nucleus.", "Positive ion loses electrons; negative ion gains them. Ionisation requires energy to remove an electron. Molecule: bonded atoms; compound: different elements chemically combined.", "Ionic bonding transfers electrons; covalent shares them; metallic bonding has mobile delocalised electrons.", "Conductors have mobile electrons (e.g. copper); insulators resist free-electron motion. Silicon/germanium are semiconductors; doping changes carrier concentration; conductivity generally increases with temperature."], ["Ions change electron count, not proton count.", "Electron direction and conventional current are opposite."], "Proton +, electron −; positive ion loses electrons. Conductors have mobile carriers; doping changes semiconductor conductivity."], ["3.2", "Static electricity and conduction", "12–27", ["Charge by friction or contact transfers electrons; induction redistributes charge without contact. Earthing an induced conductor can leave a net charge. Like charges repel, unlike attract; a charged body can attract a neutral body by polarisation.", "Coulomb force F = k|Q₁Q₂|/r²; k ≈ 9 × 10⁹ N·m²/C². Doubling distance quarters force.", "Solid metals: free electrons. Electrolytes: mobile positive and negative ions; cations go to cathode, anions to anode. Pure water conducts poorly; dissolved ions increase conductivity.", "Gas conduction requires ionisation; collisions can create cascades. In a vacuum, emitted electrons carry current; electron beams can be deflected by fields (CRT)."], ["Do not confuse induction with direct contact.", "Coulomb force obeys inverse square, not inverse distance."], "Like repel/unlike attract; induction without contact. F ∝ 1/r². Metals electrons; liquids ions; gases ionise; vacuum emitted electrons."], ["3.3", "Electrical terminology", "30–42", ["Voltage/PD = energy transferred per charge (V = E/Q). EMF = energy supplied per charge, equal to open-circuit terminal voltage. Current I = Q/t; charge Q = It; 1 C = 1 A·s; 1 Ah = 3600 C.", "Resistance R = V/I (Ω); conductance G = 1/R (S). Conventional current + to − outside source; electrons − to +. DC unidirectional; AC periodically reverses.", "Ammeter in series, low resistance; voltmeter across component, high resistance. Choose correct range and DC polarity.", "Prefixes: G 10⁹, M 10⁶, k 10³, m 10⁻³, µ 10⁻⁶, n 10⁻⁹, p 10⁻¹². Typical aircraft systems 28 V DC and 115 V AC."], ["m versus M differ by 10⁹.", "Voltage is not current; never connect an ammeter across a supply."], "I = Q/t; V = E/Q; G = 1/R; 1 Ah = 3600 C. Ammeter series, voltmeter parallel. M ≠ m."], ["3.4", "Generation of electricity", "45–51", ["Six methods: light (photovoltaic), heat (thermoelectric), friction, pressure (piezoelectric), chemical reaction, magnetism (electromagnetic induction).", "Solar cell: light creates electron-hole pairs; junction separates carriers, electrodes collect current. Thermocouple: two dissimilar metals, temperature difference produces EMF.", "Friction separates charges; aircraft static dischargers help dissipate static charge, especially at trailing edges. Strong fields at sharp points encourage discharge.", "Piezoelectric material develops charge when stressed; reverse effect causes deformation with voltage. Galvanic cell converts chemical energy to electrical; zinc electrode becomes negative in copper-zinc example.", "Generator: changing flux linkage induces EMF. Rotor rotates, stator stationary. Alternator generates AC."], ["Thermocouple measures temperature difference, not absolute temperature without a reference.", "Induction needs change in flux linkage; steady field alone is insufficient."], "Light, heat, friction, pressure, chemical, magnetism. Piezo: pressure ↔ voltage. Thermocouple: dissimilar metals + temperature difference."], ["3.5", "DC sources of electricity", "54–84", ["Primary cells normally non-rechargeable; secondary rechargeable. Zinc-carbon: zinc container negative, carbon rod positive collector; electrolyte paste. Alkaline primary cells not intended for recharge.", "Lead-acid: charged positive PbO₂, negative Pb, dilute H₂SO₄. Discharge forms PbSO₄ at both plates; acid specific gravity falls. Charging reverses reaction; nominal 2 V/cell.", "Ni-Cd: nickel positive, cadmium negative; potassium hydroxide electrolyte (KOH), nominal 1.2 V/cell. State of charge not reliably indicated by electrolyte specific gravity. Risk of thermal runaway; electrolyte level depends on charge state.", "Silver oxide/mercury/lithium cells have different chemistries and voltages; common lithium coin cell 3 V. Capacity Ah = A × h; affected by rate, temperature and condition.", "Identical cells series: add EMF and internal resistance. Parallel: EMF unchanged; effective internal resistance r/n, capacity increases. Unequal EMFs in parallel can circulate current.", "Off-load Vt = E. On discharge Vt = E − Ir; I = E/(R+r); short-circuit I = E/r. Thermocouple and photovoltaic cell also DC sources."], ["Battery Ah is charge, not energy.", "Lead-acid electrolyte specific gravity changes with charge; Ni-Cd is different.", "Series raises voltage; parallel raises capacity."], "Pb-acid 2 V/cell; Ni-Cd 1.2 V/cell. Series E adds, parallel E same. Vt = E − Ir; Isc = E/r. Ah = A × h."], ["3.6", "DC circuits", "88–99", ["Ohm law V = IR at constant temperature. KCL: incoming current = outgoing current (charge conservation). KVL: algebraic sum of EMF and voltage drops around closed loop = 0.", "Series current same; voltage divides in proportion to R. Parallel voltage same; branch currents add. Reduce parallel/series networks systematically, then work back to branch values.", "Aiding sources add; opposing sources subtract (choose loop direction). Off-load terminal voltage equals EMF; loaded source loses Ir internally. Vt = E − Ir, I = E/(R+r).", "For short circuit external R = 0, so current limited by source internal resistance; voltage across short nearly zero."], ["Do not add currents in series or voltages in parallel.", "Use signed voltage rises/drops consistently; terminal voltage is not always EMF."], "V = IR; KCL currents at junction, KVL voltages in loop. Same I series, same V parallel. Vt = E − Ir."], ["3.7", "Resistance and resistors", "101–153", ["R = ρl/A; longer wire higher R, wider area lower R. Resistivity depends on material and temperature; silver extremely low. Use consistent units for ρ and area.", "Colour digits: black 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, grey 8, white 9. Multiplier 10^digit; gold ×0.1, silver ×0.01; gold tolerance ±5%, silver ±10%. E12 10%, E24 5% typical.", "Resistor power rating is maximum dissipation under stated conditions; derate at high temperature. Wirewound high power (can be inductive), film precision, surface mount compact.", "Series Rt = ΣR; parallel 1/Rt = Σ1/R; two resistors Rt = R₁R₂/(R₁+R₂). Unloaded divider Vout = Vin × Rlower/Rtotal; load in parallel with lower resistor changes ratio.", "Potentiometer three terminals, wiper gives divider output; rheostat two terminals varies current; preset/trimmer adjustment. NTC resistance falls as temperature rises; PTC rises. VDR resistance falls with applied voltage magnitude.", "R = R₀(1+αΔT). Wheatstone bridge balanced when ratios equal; detector current zero; solve missing resistance by cross-multiplying."], ["Parallel total is below smallest branch; series total above largest.", "Gold and silver are not ordinary digit bands; no tolerance band typically ±20%.", "Area conversion: mm² to m² multiply 10⁻⁶."], "R = ρl/A. Series add; parallel reciprocals. NTC ↓R with ↑T; PTC ↑R. Pot 3 terminals; rheostat 2. Balanced bridge equal ratios."], ["3.8", "Power", "155–170", ["Kinetic energy motion; potential energy stored by position/configuration. Work = force × distance in force direction; joule = N·m. Energy conserved, converted between forms.", "Power is rate of energy transfer: P = E/t = VI = I²R = V²/R. E = Pt = QV = VIt; watt = J/s; 1 kWh = 3.6 MJ.", "At fixed R, doubling V or I quadruples power. At fixed current, P proportional R; at fixed voltage, P inversely proportional R.", "Direct power measurement wattmeter; indirect multiply voltage/current for DC. Current coil series, voltage coil parallel. Resistive heating and power rating determine safe dissipation."], ["kW is power; kWh energy.", "Use correct constant condition before predicting power change."], "P = VI = I²R = V²/R; E = Pt = QV. Double V at fixed R → 4× P. 1 kWh = 3.6 MJ."], ["3.9", "Capacitance and capacitors", "172–200", ["Two conducting plates separated by dielectric store equal/opposite charge; C = Q/V. C = εA/d: larger area or permittivity raises C, wider gap lowers C. Capacitance fuel gauging responds to dielectric changes.", "Electrolytic capacitor usually polarised; paper/film/ceramic typically non-polarised; trimmers variable. Observe voltage rating, polarity and discharge safely before testing.", "Parallel Ctotal = ΣC; series 1/Ctotal = Σ1/C. Series charge same; smaller C has larger voltage. Parallel voltage same.", "RC τ = RC (Ω × F = s). Uncharged capacitor initially draws maximum I = V/R; charging current decays. After 1τ voltage reaches 63.2%; discharge retains 36.8%; after 5τ near steady state.", "Continuity/resistance check: sound capacitor momentary charge indication then high resistance; persistent low indicates short; no response may indicate open (meter/test-dependent). Leakage, dielectric breakdown and absorption possible."], ["Capacitor rules reverse resistor rules.", "Capacitor can retain dangerous charge after power off.", "Use µF = 10⁻⁶ F in RC calculations."], "C = Q/V = εA/d. Parallel add; series reciprocals; smaller series C gets higher V. τ = RC; 63% charge / 37% remain; ~5τ."], ["3.10", "Magnetism", "202–255", ["Field lines form closed loops, outside magnet N→S, never cross; closer lines stronger field. Like poles repel. Magnetic declination is angle between magnetic and geographic north.", "Ferromagnetic domains align when magnetised. Ferromagnetic strongly attracted; paramagnetic weak attraction; diamagnetic weak repulsion. Heating above Curie temperature or alternating field can demagnetise.", "Electromagnet field from current and turns; soft iron core increases field, can be switched. Right-hand grip: fingers conventional current, thumb north/field direction in solenoid. Shielding redirects flux via high permeability material.", "MMF = NI (At); H = NI/l (A/m); Φ flux in Wb; B = Φ/A (T); B = μH; μr = μ/μ₀. Reluctance ℜ = l/(μA), Φ = MMF/ℜ; air gap increases reluctance.", "Hysteresis: lag of B behind H; remanence residual flux, coercivity reverse field needed to reduce it. Saturation: little more B with more H. Soft magnetic materials narrow loop/low loss; permanent magnets hard materials high coercivity. Laminations reduce eddy-current loss; keepers provide magnetic path."], ["Weber total flux, tesla flux density; H and B differ.", "Laminations reduce eddy currents, not hysteresis."], "MMF = NI; H = NI/l; B = Φ/A = μH; ℜ = l/(μA). Soft core low hysteresis; hard magnet high coercivity. Air gap ↑ reluctance."], ["3.11", "Inductance and inductors", "257–288", ["Faraday: induced EMF proportional to rate of change of flux linkage E = −NΔΦ/Δt. Relative motion, stronger field, faster change or more turns increase EMF. Lenz: induced effect opposes change causing it.", "Fleming right hand generator: thumb motion, first finger field N→S, second finger conventional induced current. Left hand motor: thumb force/motion, first finger field, second current.", "Self-induction E = −LΔI/Δt; mutual E₂ = −MΔI₁/Δt. One henry induces 1 V for 1 A/s change. L ∝ μN²A/l for ideal solenoid; coupling depends on distance, orientation, core.", "Inductor opposes current change; switch-off can create large voltage spike. Freewheel diode reverse biased during normal DC supply, conducts when coil switches off. Choke impedes AC, passes steady DC (winding resistance remains).", "Core saturation reduces effective incremental inductance; air core avoids ferromagnetic saturation. Transformers use mutual induction; LC circuits tune frequency."], ["Lenz opposes CHANGE, not always the original field.", "Turns squared for self-inductance; Faraday EMF proportional to turns."], "Faraday E = −NΔΦ/Δt; Lenz opposes change. E = −LΔI/Δt; L ∝ N². Right hand generator, left hand motor."], ["3.12", "DC motor and generator theory", "292–324", ["Motor electrical→mechanical; generator mechanical→electrical. DC commutator reverses armature connection each half-turn for unidirectional torque or rectified output. Brushes contact segmented commutator; laminated armature reduces eddy currents.", "Armature reaction distorts main field and shifts neutral plane; interpoles improve commutation, compensating windings counter armature reaction. Generator EMF increases with flux, speed and active conductor count; field control regulates output.", "Motor back EMF opposes supply; at stall/starting, back EMF near zero → high current. Torque proportional to flux × armature current; P = Tω, ω = 2πn/60. Weakening field generally raises speed at a given armature voltage.", "Series motor field in series: high starting torque, speed varies greatly with load; dangerous unloaded overspeed. Shunt field parallel: relatively constant speed. Compound combines series/shunt characteristics; separately excited field has own supply.", "Reverse either armature or field connection (not both) to reverse rotation. Starter-generator acts as motor for starting then generator; changeover/control circuit reconfigures function."], ["Never run a DC series motor unloaded.", "Back EMF is smallest at start, not largest.", "Reversing both field and armature leaves direction unchanged."], "Motor electrical→mechanical; generator reverse. Series high start torque, no-load danger; shunt constant speed. Back EMF low at stall; P = Tω."], ["3.13", "AC theory", "327–351", ["Cycle 360°; period T = 1/f, frequency Hz. Phase difference is angular/time displacement. Instantaneous sine v = Vpk sin(2πft + φ). Phasor represents magnitude and phase.", "For pure sine Vrms = Vpk/√2 ≈ 0.707 Vpk; Vpp = 2Vpk. Half-cycle mean = 0.637 Vpk; full-cycle algebraic mean zero. RMS is effective heating equivalent, not mean or peak.", "Square, triangle and sawtooth have different waveforms; sine conversion factors not universal. AC ratings normally RMS unless stated.", "Three-phase balanced waveforms 120° apart. Star: VL = √3 Vph, IL = Iph; neutral possible. Delta: VL = Vph, IL = √3 Iph. Single-phase one waveform; polyphase multiple phase-displaced waveforms."], ["Do not use 0.707 for non-sinusoidal waveform.", "Star voltage ratio; delta current ratio."], "T = 1/f; sine RMS = 0.707 peak; Vpp = 2 peak; half mean 0.637 peak. 3φ 120°. Star V×√3; delta I×√3."], ["3.14", "Resistive, capacitive and inductive circuits", "353–401", ["Pure R: current and voltage in phase; pure L: current lags voltage 90°; pure C: current leads voltage 90°. ELI the ICE man (E leads I in L; I leads E in C).", "XL = 2πfL increases with f; XC = 1/(2πfC) decreases with f. Impedance Z = V/I (RMS magnitudes). Skin effect raises AC resistance at higher f.", "Series RL/RC/RLC: same current; voltages add as phasors. Z = √(R²+(XL−XC)²); tan φ = (XL−XC)/R. Net inductive if XL>XC, capacitive if XC>XL.", "Parallel branches: common voltage; branch currents add vectorially; inductive and capacitive reactive currents oppose. Series resonance XL = XC, Z minimum (R), I maximum; ideal parallel resonance input impedance maximum, supply current minimum.", "Real power P = VI cos φ (W), reactive Q = VI sin φ (var), apparent S = VI (VA), S² = P²+Q²; PF = P/S. Pure reactive ideal load average real power zero; low PF requires more current for same real power."], ["Do not add R + XL mechanically; use vectors.", "L lags, C leads.", "Real W, apparent VA, reactive var."], "ELI ICE. XL ↑f, XC ↓f. Z = √(R²+(XL−XC)²). Resonance XL=XC. P=VI cosφ; S=VI; Q=VI sinφ; PF=P/S."], ["3.15", "Transformers", "404–447", ["AC transformer uses mutual induction; primary and secondary share alternating magnetic flux, ideally frequency unchanged. Vs/Vp = Ns/Np = Ip/Is. Step-up voltage means step-down current for ideal power conservation.", "Copper losses I²R, eddy-current loss reduced by laminations, hysteresis reduced by low-loss core. No-load current has magnetising (quadrature) and core-loss (in-phase) components. Loaded secondary current reflected into primary.", "Efficiency η = Pout/Pin × 100%; VA rating limits voltage/current heating, not W alone. P = S × PF; balanced three-phase S = √3 VL IL; P = √3 VL IL cosφ.", "Dots indicate corresponding instantaneous polarity; reversing winding connections reverses relative phase. Impedance reflected by turns ratio squared: Zp/Zs = (Np/Ns)².", "Autotransformer shares winding, no galvanic isolation; Variac variable autotransformer. Current transformer steps current for measurement: never open secondary while primary energised. Star/delta connections as 3.13."], ["Transformer cannot sustain ordinary steady DC transformation.", "CT secondary must not be open circuit when primary energised.", "Turns ratio squared for impedance, inverse for current."], "Vs/Vp=Ns/Np=Ip/Is; Z ratio squared. η=Pout/Pin. Laminations eddy; soft core hysteresis. Auto no isolation; CT never open live."], ["3.16", "Filters", "449–456", ["Low-pass passes lower frequencies, attenuates higher (series L, shunt C; RC version output across C). High-pass passes higher frequencies, attenuates lower (series C, shunt L; RC output across R).", "Band-pass passes a band; band-stop/notch rejects a band. Series resonant LC low impedance, parallel LC high impedance at resonance; arrangement determines whether pass or reject.", "Cutoff frequencies define bandwidth BW = fH−fL; usual half-power point −3 dB. Q = let weakSize=20;
const baseTopic=t=>String(t||'').replace(/[ab]$/,'');
function weaknessData(){
 const history=state.history.filter(h=>h.completed!==false&&Array.isArray(h.responses));
 const latest=new Map(),seen=new Set(),completedPapers=new Set(history.filter(h=>h.mode==='mock'||h.mode==='calc-exam').map(h=>h.title));
 for(const h of history)for(const r of h.responses){if(!r.id)continue;seen.add(r.id);if(!latest.has(r.id))latest.set(r.id,r)}
 const reserved=new Set(state.packs.filter(p=>(formal(p)||calculationPack(p))&&!completedPapers.has(p.title)).flatMap(p=>p.questions.map(q=>q.id)));
 const all=allQ(),pool=all.filter(q=>seen.has(q.id)||!reserved.has(q.id)),byId=new Map(all.map(q=>[q.id,q]));
 const misses=[...latest.values()].filter(r=>!r.correct),missIds=new Set(misses.map(r=>r.id)),missObjectives=new Set(misses.map(r=>r.objective||byId.get(r.id)?.objective).filter(Boolean));
 const stats=SYLLABUS.map(t=>{const rows=[...latest.values()].filter(r=>baseTopic(r.topic||byId.get(r.id)?.topic)===t[0]),attempted=rows.filter(r=>r.chosen!==null&&r.chosen!==undefined),correct=attempted.filter(r=>r.correct).length,missed=rows.filter(r=>!r.correct).length,available=pool.filter(q=>baseTopic(q.topic)===t[0]).length;return {id:t[0],name:t[1],attempted:attempted.length,correct,missed,seen:rows.length,available,accuracy:attempted.length?Math.round(100*correct/attempted.length):null}});
 const weak=stats.filter(s=>s.missed>0||(s.accuracy!==null&&s.accuracy<75)).sort((a,b)=>(a.accuracy??0)-(b.accuracy??0)||b.missed-a.missed||syllabusRank({topic:a.id})-syllabusRank({topic:b.id}));
 return {latest,seen,pool,byId,misses,missIds,missObjectives,stats,weak,reserved,completedPapers};
}
function weaknessPick(kind,limit=weakSize,topic=''){
 const d=weaknessData(),rank=new Map(d.weak.map((s,i)=>[s.id,i]));
 let candidates=d.pool.filter(q=>{const t=baseTopic(q.topic);if(kind==='missed')return d.missIds.has(q.id);if(kind==='related')return !d.seen.has(q.id)&&d.missObjectives.has(q.objective);if(kind==='topic')return t===topic;if(kind==='untested')return !d.seen.has(q.id);return d.missIds.has(q.id)||d.missObjectives.has(q.objective)||rank.has(t)});
 // Exact missed questions first; unseen related items next, then weakest topics. Never fill with unrelated questions.
 const priority=q=>d.missIds.has(q.id)?0:!d.seen.has(q.id)&&d.missObjectives.has(q.objective)?1:!d.seen.has(q.id)?2:3;
 candidates.sort((a,b)=>priority(a)-priority(b)||(rank.get(baseTopic(a.topic))??99)-(rank.get(baseTopic(b.topic))??99)||syllabusRank(a)-syllabusRank(b)||String(a.id).localeCompare(String(b.id)));
 return candidates.slice(0,limit).map(q=>q.id);
}
function startWeakness(kind,topic=''){const ids=weaknessPick(kind,weakSize,topic);if(!ids.length)return;const labels={mixed:'Targeted mixed practice',missed:'Missed-question recovery',related:'Related unseen questions',untested:'Untested questions',topic:'Topic '+topic};start('study',ids,'Weakness Trainer · '+labels[kind]);}
function weakness(){const d=weaknessData(),unresolved=d.misses.length,reviewable=d.misses.filter(r=>d.byId.has(r.id)).length,covered=d.stats.filter(s=>s.seen>0).length;const tiles=[['mixed','Targeted mixed practice','Missed answers, related objectives and weakest topics'],['missed','Retry missed questions','Questions still incorrect or unanswered on their latest attempt'],['related','Fresh related practice','Unseen questions matching missed objectives'],['untested','Untested practice','Available questions you have not seen in completed sessions']];return hdr('Weakness Trainer','Targeted revision based on your recorded answers')+`<div class="metrics"><div class="card"><div class="kicker">Unresolved misses</div><div class="metric">${unresolved}</div></div><div class="card"><div class="kicker">Weak topics</div><div class="metric">${d.weak.length}</div></div><div class="card"><div class="kicker">Topics seen</div><div class="metric">${covered}/18</div></div></div><div class="card"><h2 style="margin-top:0">Build a practice session</h2><p class="softnote">A correct answer on a later completed practice clears that question from unresolved misses. Latest answers are used once per question. Unanswered items remain unresolved, but are not included in accuracy. Unattempted official mock and calculation papers are protected from being revealed here.</p>${!d.seen.size?'<p class="softnote"><b>No completed answers yet.</b> Complete a mock or a study session to generate targeted recommendations. Untested practice can use available non-reserved questions.</p>':''}<label class="mini" for="weakSize">Maximum session size</label><select id="weakSize" class="field" onchange="weakSize=Number(this.value);render()" style="display:block;margin-top:6px;width:100%">${[10,20,30,50].map(n=>`<option value="${n}" ${n===weakSize?'selected':''}>${n} questions</option>`).join('')}</select>${tiles.map(([id,title,sub])=>{const count=weaknessPick(id,Infinity).length;return `<div class="listitem" style="flex-wrap:wrap"><div><b>${title}</b><div class="mini">${sub} · ${count} available</div></div><button class="btn secondary" ${count?'':'disabled'} onclick="startWeakness('${id}')">Practise ${Math.min(weakSize,count)}</button></div>`}).join('')}${reviewable<unresolved?`<p class="softnote">${unresolved-reviewable} missed question(s) are not in your current bank. Reimport the original pack to practise them.</p>`:''}</div><h2 class="sectiontitle">Topic priorities</h2><div class="card">${[...d.weak,...d.stats.filter(s=>!d.weak.some(w=>w.id===s.id))].map(s=>`<div class="weak-topic"><div class="weak-topic-head"><div><b>${s.id} · ${safe(s.name)}</b><div class="mini">${s.attempted} distinct answered · ${s.missed} unresolved · ${s.available} available</div></div><span class="tag ${s.seen===0?'warn':s.missed?'warn':s.accuracy>=75?'good':''}">${s.seen===0?'Untested':s.accuracy===null?'Unanswered':s.accuracy+'% latest'}</span></div>${s.accuracy!==null?`<div class="progress"><i style="width:${s.accuracy}%"></i></div>`:''}<button class="btn secondary" ${s.available?'':'disabled'} onclick="startWeakness('topic','${s.id}')" style="margin-top:10px">Practise topic</button>${s.attempted<3&&s.seen>0?'<span class="mini" style="margin-left:9px">Limited evidence</span>':''}</div>`).join('')}</div><p class="softnote">These are practice indicators, not pass predictions. Official mock and calculation exam marks are not changed; targeted sessions are saved separately as study results.</p>`}

const labFmt=n=>Number(n.toPrecision(4)).toLocaleString('en-GB',{maximumFractionDigits:8});
function labCalc(id,x){let {V,R,R1,R2,C,L,f,t,A,phase,N,B,p,slip,Np,Ns}=x;switch(id){
case 'ohm':return {I:V/R,P:V*V/R};
case 'series':return {Rs:R1+R2,Rp:R1*R2/(R1+R2),Is:V/(R1+R2),Vs1:V*R1/(R1+R2),Vs2:V*R2/(R1+R2),Ip:V/R1+V/R2,I1:V/R1,I2:V/R2};
case 'rc':{let tau=R*1000*C*1e-6,ratio=Math.exp(-t/tau);return {tau,Vc:V*(1-ratio),Vd:V*ratio,I:V/(R*1000)*ratio*1000,percent:100*(1-ratio)}}
case 'sine':return {rms:A/Math.sqrt(2),pp:2*A,period:1000/f,mean:2*A/Math.PI};
case 'rlc':{let XL=2*Math.PI*f*L/1000,XC=1/(2*Math.PI*f*C*1e-6),X=XL-XC,Z=Math.hypot(R,X);return {XL,XC,X,Z,I:V/Z,phi:Math.atan2(X,R)*180/Math.PI,f0:1/(2*Math.PI*Math.sqrt(L/1000*C*1e-6)),pf:R/Z}}
case 'transformer':{let Vs=V*Ns/Np,Is=Vs/R;return {ratio:Ns/Np,Vs,Is,Ip:Is*Ns/Np,P:Vs*Is}};
case 'motor':{let Ns=120*f/p,Nr=Ns*(1-slip/100);return {Ns,Nr,diff:Ns-Nr}};
case 'magnetic':{let flux=B*A*1e-4;return {flux,E:N*flux/(t/1000)}};

 if(id==='transformer'){return labSvg(`<path d="M55 45H165M55 205H165M395 45H505M395 205H505"/><path d="M254 35V215M274 35V215" stroke-width="8" stroke="#91a0b1"/>${[0,1,2,3,4].map(i=>`<path d="M165 ${45+i*32}q70 16 0 32M395 ${45+i*32}q-70 16 0 32" stroke="#0878f9"/>`).join('')}<g fill="currentColor" stroke="none" font-size="14"><text x="55" y="27">Primary ${x.Np} turns</text><text x="365" y="27">Secondary ${x.Ns} turns</text><text x="55" y="235">${labFmt(x.V)} V</text><text x="395" y="235">${labFmt(y.Vs)} V</text></g>`,'Ideal transformer primary and secondary winding schematic')}
 if(id==='motor'){return labSvg(`<circle cx="280" cy="125" r="85" stroke="#91a0b1" stroke-width="9"/><circle cx="280" cy="125" r="48" stroke="#0878f9" stroke-width="5"/>${Array.from({length:x.p},(_,i)=>{let a=i*2*Math.PI/x.p;return `<circle cx="${280+85*Math.cos(a)}" cy="${125+85*Math.sin(a)}" r="8" fill="${i%2?'#d58c12':'#0878f9'}" stroke="none"/>`}).join('')}<g fill="currentColor" stroke="none" font-size="14"><text x="280" y="121" text-anchor="middle">Rotor</text><text x="280" y="142" text-anchor="middle">${labFmt(y.Nr)} rpm</text><text x="392" y="85">Field</text><text x="392" y="106">${labFmt(y.Ns)} rpm</text></g>`,'Schematic stator poles and rotor speed')}
 if(id==='magnetic'){return labSvg(`<rect x="30" y="55" width="70" height="140" rx="10" fill="#0878f9"/><rect x="460" y="55" width="70" height="140" rx="10" fill="#d58c12"/>${[80,105,130,155,180].map(v=>`<path d="M110 ${v}H450m-9 -5 9 5 -9 5" stroke="#91a0b1"/>`).join('')}<rect x="218" y="55" width="124" height="140" rx="10" stroke="#16835a" stroke-width="5"/><g fill="currentColor" stroke="none" font-size="14"><text x="65" y="130" text-anchor="middle" fill="white">N</text><text x="495" y="130" text-anchor="middle" fill="white">S</text><text x="280" y="25" text-anchor="middle">${x.N} turns · ${x.B} T</text><text x="280" y="235" text-anchor="middle">Flux changes to zero in ${x.t} ms</text></g>`,'Coil within magnetic field with changing flux')}
 let series=id==='series';return labSvg(`<path d="M90 75H${series?180:220}M${series?440:340} 75H470V200H90V145M90 115V75"/><path d="M70 115H110M80 145H100" stroke-width="4"/><path d="M${series?180:220} 75${series?'l10 -12 15 24 15 -24 15 24 10 -12H320l10 -12 15 24 15 -24 15 24 10 -12H440':'l10 -12 20 24 20 -24 20 24 20 -24 20 12H340'}" stroke="#0878f9"/><g fill="currentColor" stroke="none" font-size="14"><text x="55" y="105">+</text><text x="30" y="138">${x.V} V</text><text x="200" y="45">${series?x.R1+' Ω':x.R+' Ω'}</text>${series?`<text x="340" y="45">${x.R2} Ω</text>`:''}<text x="270" y="230" text-anchor="middle">${labFmt(series?y.Is:y.I)} A · ${series?'series schematic':'DC current'}</text></g>`,series?'Series circuit schematic; parallel equivalent calculated separately':'DC source and resistor circuit');
}
function labResults(){let [m,x]=labState(),y=labCalc(m.id,x),metrics=[],explain='';let add=(l,k,u)=>metrics.push(labMetric(l,y[k],u));switch(m.id){case 'ohm':add('Current','I','A');add('Power','P','W');explain=`${x.V} ÷ ${x.R} = ${labFmt(y.I)} A. The resistor dissipates ${labFmt(y.P)} W.`;break;case 'series':add('Series total R','Rs','Ω');add('Parallel total R','Rp','Ω');add('Series current','Is','A');add('Parallel total current','Ip','A');add('Series V₁','Vs1','V');add('Series V₂','Vs2','V');add('Parallel I₁','I1','A');add('Parallel I₂','I2','A');explain='The diagram shows the series circuit. In parallel both resistors have the full supply voltage; branch currents add.';break;case 'rc':add('Time constant','tau','s');add('Charging voltage','Vc','V');add('Discharging voltage','Vd','V');add('Charge current','I','mA');explain=`At ${x.t} s, the capacitor is ${labFmt(y.percent)}% of its final charging voltage.`;break;case 'sine':add('RMS','rms','V');add('Peak-to-peak','pp','V');add('Period','period','ms');add('Half-cycle mean magnitude','mean','V');explain='Phase shift changes timing; frequency changes period; peak determines amplitude and RMS.';break;case 'rlc':add('Inductive XL','XL','Ω');add('Capacitive XC','XC','Ω');add('Impedance','Z','Ω');add('Current','I','A');add('Phase angle','phi','°');add('Resonance frequency','f0','Hz');add('Power factor','pf','');explain=y.X>0?'Net inductive: current lags voltage.':y.X<0?'Net capacitive: current leads voltage.':'Series resonance: voltage and current in phase.';break;case 'transformer':add('Turns ratio Ns/Np','ratio','');add('Secondary voltage','Vs','V');add('Secondary current','Is','A');add('Primary current','Ip','A');add('Ideal power (each side)','P','W');explain=y.ratio>1?'Step-up: voltage rises, current falls.':y.ratio<1?'Step-down: voltage falls, current rises.':'1:1 transformer: equal voltages.';break;case 'motor':add('Synchronous speed','Ns','rpm');add('Rotor speed','Nr','rpm');add('Slip speed','diff','rpm');explain='Rotor speed falls below synchronous speed by the selected slip percentage.';break;case 'magnetic':add('Flux per turn','flux','Wb');add('Average EMF magnitude','E','V');explain='Assumes uniform perpendicular flux and a linear reduction to zero, with all turns fully linked.';break}return `<div class="lab-metrics">${metrics.join('')}</div><div class="lab-diagram">${labDiagram(m.id,x,y)}</div><div class="explain"><b>What is happening?</b><p>${safe(explain)}</p></div>`}
function labSet(k,v){labValues[k]=Number(v);let [m,x]=labState();$('labValue-'+k).textContent=labFmt(x[k])+' '+m.controls.find(c=>c[0]===k)[2];$('labResults').innerHTML=labResults()}
function labSelect(id){labId=id;labValues={};render()}
function lab(){let [m,x]=labState();return hdr('Electrical Lab','Interactive offline models · change a value and see the result')+`<div class="card"><label class="mini" for="labSelect">Choose a simulation</label><select id="labSelect" class="field" style="display:block;width:100%;margin-top:5px" onchange="labSelect(this.value)">${LABS.map(l=>`<option value="${l.id}" ${l.id===m.id?'selected':''}>${l.topic} · ${safe(l.title)}</option>`).join('')}</select></div><div class="lab-grid"><div class="card"><h2 style="margin-top:0">${safe(m.title)}</h2><p class="formula">${safe(m.formula)}</p>${m.controls.map(c=>`<label class="lab-control"><span><b>${safe(c[1])}</b><strong id="labValue-${c[0]}">${labFmt(x[c[0]])} ${safe(c[2])}</strong></span><input type="range" min="${c[3]}" max="${c[4]}" step="${c[5]}" value="${x[c[0]]}" oninput="labSet('${c[0]}',this.value)"></label>`).join('')}<button class="btn secondary" onclick="labSelect('${m.id}')">Reset values</button><div class="revision-traps"><b>Exam trap</b><p>${safe(m.trap)}</p></div>${noteButtons(m.page)}</div><div class="card" id="labResults">${labResults()}</div></div><p class="softnote">Idealised learning simulations, not a substitute for aircraft maintenance data or electrical test procedures.</p>`}

window.addEventListener('resize',()=>{if(view==='notes')refreshNotes();if(view==='tutor')renderTutorSource()});
render();if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Offline cache registration failed:',e)))}
